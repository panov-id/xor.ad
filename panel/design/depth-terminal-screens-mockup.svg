<text x="754.0" y="538" class="h">4 · чат, код безопасности в шапке</text>
<text x="754.0" y="572" xml:space="preserve">Ира, 31 · до 23:40 · код 3583 1171 6974</text>
<text x="754.0" y="590" xml:space="preserve">сверьте код голосом или при встрече: совпал — между вами никого нет</text>
<text x="754.0" y="608" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────</text>
<text x="754.0" y="626" xml:space="preserve">                                                   Ира: привет, ты у реки?</text>
<text x="754.0" y="644" xml:space="preserve">Ты: да, у моста</text>
<text x="754.0" y="662" xml:space="preserve">                                                   Ира: иду</text>
<text x="754.0" y="680" xml:space="preserve"></text>
<text x="754.0" y="698" xml:space="preserve"></text>
