<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
<defs><style>@font-face{font-family:"Russo One";src:url(/fonts/comic-russo-one.ttf)}@font-face{font-family:"Golos Text";font-weight:500;src:url(/fonts/comic-golos-500.ttf)}
.h{font-family:"Russo One";letter-spacing:.04em}.b,.m{font-family:"Golos Text";font-weight:500}.mono{font-family:"DejaVu Sans Mono",monospace;font-weight:700}</style>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8893b"/><stop offset=".5" stop-color="#e9cf8a"/><stop offset="1" stop-color="#b8893b"/></linearGradient><pattern id="sh" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#141018"/><circle cx="3" cy="3" r="1.9" fill="#141018"/></pattern></defs>
<rect width="375" height="812" fill="#f6efe2"/>
<g transform="translate(4.4 0) scale(0.9767)">
<polygon points="12,16 363,12 367,60 8,64" fill="url(#gold)" stroke="#141018" stroke-width="2.5" stroke-linejoin="round"/>
<text x="24" y="46" class="h" font-size="19.8" fill="#141018" text-anchor="start" >Ограничений: 1</text>
<polygon points="20,88 345,88 363,106 363,478 20,478" fill="#141018" stroke="#141018" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="16,84 341,84 359,102 359,474 16,474" fill="#fffaf0" stroke="#141018" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="20,88 343,88 355,100 355,470 20,470" fill="none" stroke="url(#gold)" stroke-width="1"/>
<text x="32" y="108" class="h" font-size="11.7" fill="#5a4e44" text-anchor="start" >Что произошло</text>
<text x="32" y="128" class="b" font-size="16" fill="#141018" text-anchor="start" >скрыто из ленты</text>
<text x="32" y="154" class="h" font-size="11.7" fill="#5a4e44" text-anchor="start" >Почему</text>
<text x="32" y="174" class="b" font-size="16" fill="#141018" text-anchor="start" >фраза скрыта по жалобе соседа</text>
<text x="32" y="200" class="h" font-size="11.7" fill="#5a4e44" text-anchor="start" >Как решали</text>
<text x="32" y="220" class="b" font-size="16" fill="#141018" text-anchor="start" >автоматическая проверка не</text>
<text x="32" y="242" class="b" font-size="16" fill="#141018" text-anchor="start" >применялась; решение принял</text>
<text x="32" y="264" class="b" font-size="16" fill="#141018" text-anchor="start" >человек</text>
<text x="32" y="290" class="h" font-size="11.7" fill="#5a4e44" text-anchor="start" >Основание</text>
<text x="32" y="310" class="b" font-size="16" fill="#141018" text-anchor="start" >условия: правила сообщества, п.</text>
<text x="32" y="332" class="b" font-size="16" fill="#141018" text-anchor="start" >3</text>
<text x="32" y="358" class="h" font-size="11.7" fill="#5a4e44" text-anchor="start" >Что дальше</text>
<text x="32" y="378" class="b" font-size="16" fill="#141018" text-anchor="start" >ответить нам, обратиться к</text>
<text x="32" y="400" class="b" font-size="16" fill="#141018" text-anchor="start" >координатору цифровых услуг,</text>
<text x="32" y="422" class="b" font-size="16" fill="#141018" text-anchor="start" >обратиться в суд</text>
<text x="32" y="454" class="m" font-size="14" fill="#5a4e44" text-anchor="start" >01.10.2026</text>
<rect x="20" y="500" width="343" height="52" fill="#141018"/>
<rect x="16" y="496" width="343" height="52" fill="url(#gold)" stroke="#141018" stroke-width="2.5" />
<g opacity="1">
<g transform="translate(173.1 507.6) scale(1.2)" fill="none" stroke="#141018" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="--f:#d9b766"><path d="M4 12 L10 18 L20 6"/></g>
</g>
</g>
