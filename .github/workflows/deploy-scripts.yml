name: deploy scripts

# The deploy scripts had no CI: they were exercised for the first time by a
# deploy, which is the worst place to learn that a key is read from the wrong
# place or that a rejected upload reports success. These tests reach no network —
# curl and the Bunny API are stubbed — so they cost seconds and can run on
# every push that touches the directory.
#
# Its own workflow rather than a step in panel.yml, whose path filter is
# panel/** — a step there would never fire on a change to deploy/, which is the
# only change that could break these.
on:
  push:
    branches: ["**"]
    paths: ["deploy/**", "relay/wizard/**", ".github/workflows/deploy-scripts.yml"]
  pull_request:
    paths: ["deploy/**", "relay/wizard/**", ".github/workflows/deploy-scripts.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shell syntax
        run: |
          for script in deploy/*.sh; do
            bash -n "$script" || exit 1
          done
          echo "all deploy shell scripts parse"

      - name: edge rule logic
        run: python3 deploy/test_apply_edge_headers.py

      - name: the panel's policy
        run: bash deploy/test_panel_security_headers.sh

      - name: panel deploy against a stubbed curl
        run: bash deploy/test_deploy_panel_ci.sh

      # The deploy test stubs the guard out with an exit code, which proves the
      # deploy calls something rather than that the something works. These two
      # exercise the logic that stands between a build and a live zone.
      - name: a file nobody allowed stops the deploy
        run: python3 deploy/test_check_shipped_files.py

      - name: what the prune refuses to delete
        run: python3 deploy/test_prune_storage_zone.py

      - name: no secret on a command line
        run: python3 deploy/test_no_secrets_in_argv.py

      # The judgement only, not the fetching: whether a zone that stopped
      # learning is still merely watching is decidable without a key.
      - name: what Bunny Shield is allowed to do
        run: python3 deploy/test_shield_state.py

      - name: the release tag survives a re-run
        run: python3 deploy/test_release_tag.py

      # Both WAF tools spend their measurements on a live zone under blocking,
      # so what is pinned is the part that decides: the bisection must land on
      # the culprit from every position, and "nothing was cut" must not be
      # reported when the control never fired.
      - name: the WAF rule search lands on the right rule
        run: python3 deploy/test_waf_rule_search.py

      - name: a clean route is only a finding when the control fired
        run: python3 deploy/test_waf_route_probe.py

      # The wizard is a deploy script too: it decides what permissions the
      # secrets land with on a node, and which secret signs that node's sessions.
      - name: what the wizard writes to a node
        run: python3 relay/wizard/test_wizard.py
