      summary: Audit log
      x-summary-ru: Журнал аудита
  /admin/brands:
    get:
      tags: [admin]
      summary: Brands
      x-summary-ru: Бренды
      x-status: built
      x-internal: true
      x-source: relay/node/src/routes/admin.ts
      security: [{panelSession: []}]
      responses:
        "200": {description: Brands from the registry and the environment., x-description-ru: Бренды из реестра и окружения.}
    post:
      tags: [admin]
