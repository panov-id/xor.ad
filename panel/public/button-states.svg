<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2260" viewBox="0 0 1440 2260" font-family="Inter, system-ui, sans-serif">
  <title>xor.ad panel — button mechanics, as built</title>
  <desc>
    Drawn from panel/src/App.css as it stands, not from intent. Every state, what
    it changes, what it inherits, and the questions the mechanics leave open.
  </desc>

  <style>
    @font-face { font-family: "Inter"; font-weight: 400 700;
      src: url(/fonts/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2) format("woff2"); }
    @font-face { font-family: "Unbounded"; font-weight: 700;
      src: url(/fonts/Yq6W-LOTXCb04q32xlpwu8Zf.woff2) format("woff2"); }
    .display { font-family: "Unbounded", "Inter", sans-serif; font-weight: 700; fill: #14140f; }
    .body  { font-size: 14px; font-weight: 500; fill: #14140f; }
    .muted { font-size: 13px; font-weight: 500; fill: #5b5b55; }
    .micro { font-size: 11px; font-weight: 700; fill: #5b5b55; letter-spacing: 0.7px; }
    .mono  { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: #5b5b55; }
    .mono-ink { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: #14140f; }
    .q     { font-size: 13px; font-weight: 600; fill: #b26a00; }
    .bad   { font-size: 11px; font-weight: 600; fill: #b3261e; }
  </style>

  <rect width="1440" height="2260" fill="#f2f2f0"/>

  <!-- ========================================================== MASTHEAD === -->
  <g transform="translate(48,48)">
    <rect x="0" y="0" width="1344" height="104" rx="6" fill="#14140f"/>
    <text x="28" y="46" class="display" font-size="26" style="fill:#f2f2f0">Button mechanics<tspan fill="#7d9bff">.</tspan></text>
    <text x="28" y="76" class="body" style="fill:#f2f2f0;opacity:0.75">
      Read out of panel/src/App.css as it stands today — not what it was meant to be. Six open questions at the bottom.
    </text>
  </g>

  <!-- ============================================================ AS BUILT = -->
  <g transform="translate(48,192)">
    <text x="0" y="20" class="display" font-size="20">The rules, in file order</text>
    <line x1="0" y1="34" x2="1344" y2="34" stroke="#14140f" stroke-width="2"/>
  </g>

  <g transform="translate(48,244)">
    <rect x="0" y="0" width="1344" height="252" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
    <rect x="1" y="1" width="1342" height="30" rx="5" fill="#f7f7f5"/>
    <text x="20" y="21" class="micro">SELECTOR</text>
    <text x="330" y="21" class="micro">SPECIFICITY</text>
    <text x="430" y="21" class="micro">TRANSFORM</text>
    <text x="600" y="21" class="micro">BOX-SHADOW</text>
    <text x="780" y="21" class="micro">BACKGROUND</text>
    <text x="940" y="21" class="micro">BORDER</text>
    <text x="1090" y="21" class="micro">TEXT</text>

    <g class="mono-ink">
      <g transform="translate(0,48)">
        <text x="20" y="0">button</text>
        <text x="330" y="0" class="mono">0,0,1</text>
        <text x="430" y="0" class="mono">—</text>
        <text x="600" y="0">4px 4px 0 --shadow-ink</text>
        <text x="780" y="0">--surface</text>
        <text x="940" y="0">2px --line-strong</text>
        <text x="1090" y="0">--ink</text>
        <line x1="1" y1="12" x2="1343" y2="12" stroke="#d9d9d4" stroke-width="1"/>
      </g>
      <g transform="translate(0,80)">
        <text x="20" y="0">button:hover:not(:disabled)</text>
        <text x="330" y="0" class="mono">0,2,1</text>
        <text x="430" y="0">translate(-2px, -2px)</text>
        <text x="600" y="0">6px 6px 0</text>
        <text x="780" y="0" class="mono">inherits</text>
        <text x="940" y="0" class="mono">inherits</text>
        <text x="1090" y="0" class="mono">inherits</text>
        <line x1="1" y1="12" x2="1343" y2="12" stroke="#d9d9d4" stroke-width="1"/>
      </g>
      <g transform="translate(0,112)">
        <text x="20" y="0">button:active:not(:disabled)</text>
        <text x="330" y="0" class="mono">0,2,1</text>
        <text x="430" y="0">translate(4px, 4px)</text>
        <text x="600" y="0">none</text>
        <text x="780" y="0" class="mono">inherits</text>
        <text x="940" y="0" class="mono">inherits</text>
        <text x="1090" y="0" class="mono">inherits</text>
        <line x1="1" y1="12" x2="1343" y2="12" stroke="#d9d9d4" stroke-width="1"/>
      </g>
      <g transform="translate(0,144)">
        <text x="20" y="0">button[aria-pressed="true"]</text>
        <text x="330" y="0" class="mono">0,1,1</text>
        <text x="430" y="0">none</text>
        <text x="600" y="0">none</text>
        <text x="780" y="0">--ink</text>
        <text x="940" y="0">--ink</text>
        <text x="1090" y="0">--page</text>
        <line x1="1" y1="12" x2="1343" y2="12" stroke="#d9d9d4" stroke-width="1"/>
      </g>
      <g transform="translate(0,176)">
        <text x="20" y="0">button:disabled</text>
        <text x="330" y="0" class="mono">0,1,1</text>
        <text x="430" y="0">none</text>
        <text x="600" y="0">none</text>
        <text x="780" y="0" class="mono">+ opacity .5</text>
        <text x="940" y="0" class="mono">inherits</text>
        <text x="1090" y="0" class="mono">inherits</text>
        <line x1="1" y1="12" x2="1343" y2="12" stroke="#d9d9d4" stroke-width="1"/>
      </g>
      <g transform="translate(0,208)">
        <text x="20" y="0">button:focus-visible</text>
        <text x="330" y="0" class="mono">0,2,1</text>
        <text x="430" y="0" class="mono">inherits</text>
        <text x="600" y="0" class="mono">inherits</text>
        <text x="780" y="0" class="mono">inherits</text>
        <text x="940" y="0">2px --accent</text>
        <text x="1090" y="0" class="mono">inherits</text>
      </g>
    </g>
    <text x="20" y="242" class="mono">transition: transform 90ms ease-out, box-shadow 90ms ease-out — and nothing else.</text>
  </g>

  <!-- ============================================================== STATES = -->
  <g transform="translate(48,540)">
    <text x="0" y="20" class="display" font-size="20">The eight states, drawn</text>
    <line x1="0" y1="34" x2="1344" y2="34" stroke="#14140f" stroke-width="2"/>
    <text x="0" y="58" class="muted">
      The dotted outline is where the button rests. Everything is drawn at true size.
    </text>
  </g>

  <!-- row 1 -->
  <g transform="translate(48,630)">
    <!-- rest -->
    <g>
      <rect x="0" y="0" width="320" height="176" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
      <text x="20" y="26" class="micro">1 · REST</text>
      <g transform="translate(60,54)">
        <rect x="4" y="4" width="120" height="36" rx="6" fill="#14140f"/>
        <rect x="0" y="0" width="120" height="36" rx="6" fill="#ffffff" stroke="#14140f" stroke-width="2"/>
        <text x="60" y="24" class="body" font-size="13" text-anchor="middle">Refresh</text>
      </g>
      <text x="20" y="132" class="mono">shadow 4 4 · the distance it stands</text>
      <text x="20" y="150" class="mono">off the page</text>
    </g>

    <!-- hover -->
    <g transform="translate(344,0)">
      <rect x="0" y="0" width="320" height="176" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
      <text x="20" y="26" class="micro">2 · HOVER</text>
      <g transform="translate(60,54)">
        <rect x="0" y="0" width="120" height="36" rx="6" fill="none" stroke="#a8a8a2" stroke-width="1" stroke-dasharray="3 3"/>
        <g transform="translate(-2,-2)">
          <rect x="6" y="6" width="120" height="36" rx="6" fill="#14140f"/>
          <rect x="0" y="0" width="120" height="36" rx="6" fill="#ffffff" stroke="#14140f" stroke-width="2"/>
          <text x="60" y="24" class="body" font-size="13" text-anchor="middle">Refresh</text>
        </g>
        <path d="M150 30 l-14 -14 m0 0 l0 8 m0 -8 l8 0" fill="none" stroke="#3355dd" stroke-width="2"/>
      </g>
      <text x="20" y="132" class="mono">moves −2 −2, shadow grows to 6 6</text>
      <text x="20" y="150" class="mono">gap under it: 4 → 8</text>
    </g>

    <!-- active -->
    <g transform="translate(688,0)">
      <rect x="0" y="0" width="320" height="176" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
      <text x="20" y="26" class="micro">3 · ACTIVE — THE CLICK ITSELF</text>
      <g transform="translate(60,54)">
        <rect x="0" y="0" width="120" height="36" rx="6" fill="none" stroke="#a8a8a2" stroke-width="1" stroke-dasharray="3 3"/>
        <g transform="translate(4,4)">
          <rect x="0" y="0" width="120" height="36" rx="6" fill="#ffffff" stroke="#14140f" stroke-width="2"/>
          <text x="60" y="24" class="body" font-size="13" text-anchor="middle">Refresh</text>
        </g>
        <path d="M136 12 l14 14 m0 0 l-8 0 m8 0 l0 -8" fill="none" stroke="#3355dd" stroke-width="2"/>
      </g>
      <text x="20" y="132" class="mono">moves +4 +4, shadow gone — it lands</text>
      <text x="20" y="150" class="mono">exactly where the shadow was</text>
    </g>

    <!-- focus -->
    <g transform="translate(1032,0)">
      <rect x="0" y="0" width="320" height="176" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
      <text x="20" y="26" class="micro">4 · FOCUS — KEYBOARD ONLY</text>
      <g transform="translate(60,54)">
        <rect x="4" y="4" width="120" height="36" rx="6" fill="#14140f"/>
        <rect x="0" y="0" width="120" height="36" rx="6" fill="#ffffff" stroke="#3355dd" stroke-width="2"/>
        <text x="60" y="24" class="body" font-size="13" text-anchor="middle">Refresh</text>
      </g>
      <text x="20" y="132" class="mono">frame turns accent. Does not move,</text>
      <text x="20" y="150" class="mono">keeps its shadow. 3.07:1 vs rest</text>
    </g>
  </g>

  <!-- row 2 -->
  <g transform="translate(48,830)">
    <!-- held -->
    <g>
      <rect x="0" y="0" width="320" height="176" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
      <text x="20" y="26" class="micro">5 · HELD — aria-pressed="true"</text>
      <g transform="translate(60,54)">
        <rect x="0" y="0" width="120" height="36" rx="6" fill="none" stroke="#a8a8a2" stroke-width="1" stroke-dasharray="3 3"/>
        <rect x="0" y="0" width="120" height="36" rx="6" fill="#14140f" stroke="#14140f" stroke-width="2"/>
        <text x="60" y="24" class="body" font-size="13" style="fill:#f2f2f0" text-anchor="middle">Refresh</text>
      </g>
      <text x="20" y="132" class="mono">stays on the baseline, no shadow,</text>
      <text x="20" y="150" class="mono">inverts. The row stays a row.</text>
    </g>

    <!-- disabled -->
    <g transform="translate(344,0)">
      <rect x="0" y="0" width="320" height="176" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
      <text x="20" y="26" class="micro">6 · DISABLED</text>
      <g transform="translate(60,54)" opacity="0.5">
        <rect x="0" y="0" width="120" height="36" rx="6" fill="#ffffff" stroke="#14140f" stroke-width="2"/>
        <text x="60" y="24" class="body" font-size="13" text-anchor="middle">Refresh</text>
      </g>
      <text x="20" y="132" class="mono">no shadow, no travel, opacity .5 —</text>
      <text x="20" y="150" class="mono">and hover/active never reach it</text>
    </g>

    <!-- focus + hover -->
    <g transform="translate(688,0)">
      <rect x="0" y="0" width="320" height="176" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
      <text x="20" y="26" class="micro">7 · FOCUS + HOVER</text>
      <g transform="translate(60,54)">
        <rect x="0" y="0" width="120" height="36" rx="6" fill="none" stroke="#a8a8a2" stroke-width="1" stroke-dasharray="3 3"/>
        <g transform="translate(-2,-2)">
          <rect x="6" y="6" width="120" height="36" rx="6" fill="#14140f"/>
          <rect x="0" y="0" width="120" height="36" rx="6" fill="#ffffff" stroke="#3355dd" stroke-width="2"/>
          <text x="60" y="24" class="body" font-size="13" text-anchor="middle">Refresh</text>
        </g>
      </g>
      <text x="20" y="132" class="mono">they compose: accent frame and the</text>
      <text x="20" y="150" class="mono">lift, because they change different things</text>
    </g>

    <!-- held + focus -->
    <g transform="translate(1032,0)">
      <rect x="0" y="0" width="320" height="176" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
      <text x="20" y="26" class="micro">8 · HELD + FOCUS</text>
      <g transform="translate(60,54)">
        <rect x="0" y="0" width="120" height="36" rx="6" fill="#14140f" stroke="#3355dd" stroke-width="2"/>
        <text x="60" y="24" class="body" font-size="13" style="fill:#f2f2f0" text-anchor="middle">Refresh</text>
      </g>
      <text x="20" y="126" class="bad">accent on ink is 2.82:1 — under the 3:1</text>
      <text x="20" y="144" class="bad">a state change needs. Question 2 below.</text>
    </g>
  </g>

  <!-- ============================================================ TIMELINE = -->
  <g transform="translate(48,1050)">
    <text x="0" y="20" class="display" font-size="20">What animates, and what snaps</text>
    <line x1="0" y1="34" x2="1344" y2="34" stroke="#14140f" stroke-width="2"/>
  </g>

  <g transform="translate(48,1102)">
    <rect x="0" y="0" width="1344" height="150" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
    <g transform="translate(28,36)">
      <text x="0" y="0" class="micro">ANIMATED — 90ms ease-out</text>
      <rect x="0" y="14" width="300" height="26" rx="4" fill="#f7f7f5" stroke="#d9d9d4" stroke-width="1"/>
      <text x="12" y="32" class="mono-ink">transform</text>
      <rect x="316" y="14" width="300" height="26" rx="4" fill="#f7f7f5" stroke="#d9d9d4" stroke-width="1"/>
      <text x="328" y="32" class="mono-ink">box-shadow</text>

      <text x="0" y="76" class="micro">INSTANT — NOT IN THE TRANSITION</text>
      <rect x="0" y="90" width="190" height="26" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
      <text x="12" y="108" class="mono-ink">background</text>
      <rect x="206" y="90" width="190" height="26" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
      <text x="218" y="108" class="mono-ink">border-color</text>
      <rect x="412" y="90" width="190" height="26" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
      <text x="424" y="108" class="mono-ink">color</text>
      <rect x="618" y="90" width="190" height="26" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
      <text x="630" y="108" class="mono-ink">opacity</text>

      <text x="836" y="108" class="bad">So the movement eases and the colour jumps — the two halves of the</text>
      <text x="836" y="124" class="bad">same event arrive at different times. Question 3.</text>
    </g>
  </g>

  <!-- ============================================================ QUESTIONS -->
  <g transform="translate(48,1298)">
    <text x="0" y="20" class="display" font-size="20">Six things the mechanics leave open</text>
    <line x1="0" y1="34" x2="1344" y2="34" stroke="#14140f" stroke-width="2"/>
    <text x="0" y="58" class="muted">Each is a decision, not a bug. Pick, and I will move it into the CSS.</text>
  </g>

  <g transform="translate(48,1382)">
    <rect x="0" y="0" width="1344" height="700" rx="6" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>

    <g transform="translate(28,40)">
      <text x="0" y="0" class="q">1 — Hover to press is a 6px journey.</text>
      <text x="0" y="22" class="body">Hover sits at −2, active at +4, so pressing moves the button six pixels. Nothing else in the panel moves that far.</text>
      <g transform="translate(0,38)">
        <text x="0" y="14" class="mono">a) leave it — the press is meant to be felt</text>
        <text x="380" y="14" class="mono">b) hover does not move, only the shadow grows (4 → 6)</text>
        <text x="860" y="14" class="mono">c) active travels 2 instead of 4</text>
      </g>
      <line x1="-28" y1="70" x2="1316" y2="70" stroke="#d9d9d4" stroke-width="1"/>
    </g>

    <g transform="translate(28,152)">
      <text x="0" y="0" class="q">2 — Focus on a held or filled button is 2.82:1.</text>
      <text x="0" y="22" class="body">The accent frame is read against the ink fill it now sits on, and lands under the 3:1 a state change needs.</text>
      <g transform="translate(0,38)">
        <text x="0" y="14" class="mono">a) the held state's focus frame goes --page instead of --accent</text>
        <text x="480" y="14" class="mono">b) an inset ring in --page, as the welded button had</text>
        <text x="900" y="14" class="mono">c) leave it, and never invert a focusable</text>
      </g>
      <line x1="-28" y1="70" x2="1316" y2="70" stroke="#d9d9d4" stroke-width="1"/>
    </g>

    <g transform="translate(28,264)">
      <text x="0" y="0" class="q">3 — Half the state eases, half of it jumps.</text>
      <text x="0" y="22" class="body">The transition names transform and box-shadow. Fill, frame and text change instantly, so hold and focus snap while the lift glides.</text>
      <g transform="translate(0,38)">
        <text x="0" y="14" class="mono">a) add background, border-color, color to the transition</text>
        <text x="480" y="14" class="mono">b) drop the transition — brutalism does not ease</text>
        <text x="900" y="14" class="mono">c) leave it</text>
      </g>
      <line x1="-28" y1="70" x2="1316" y2="70" stroke="#d9d9d4" stroke-width="1"/>
    </g>

    <g transform="translate(28,376)">
      <text x="0" y="0" class="q">4 — Disabled is opacity, so it dims the label too.</text>
      <text x="0" y="22" class="body">opacity .5 fades the frame, the fill and the text together. On the inverted held state it fades to a grey block.</text>
      <g transform="translate(0,38)">
        <text x="0" y="14" class="mono">a) explicit tokens: --line for the frame, --ink-muted for the label</text>
        <text x="560" y="14" class="mono">b) leave the opacity — it is one line and reads everywhere</text>
      </g>
      <line x1="-28" y1="70" x2="1316" y2="70" stroke="#d9d9d4" stroke-width="1"/>
    </g>

    <g transform="translate(28,488)">
      <text x="0" y="0" class="q">5 — :active outranks aria-pressed, so a held button still travels when clicked.</text>
      <text x="0" y="22" class="body">0,2,1 against 0,1,1. Clicking a chosen range moves it 4px for as long as the mouse is down, then it snaps back to the row.</text>
      <g transform="translate(0,38)">
        <text x="0" y="14" class="mono">a) leave it — a click should be felt even on a held control</text>
        <text x="520" y="14" class="mono">b) held never moves: add :not([aria-pressed="true"]) to :active</text>
      </g>
      <line x1="-28" y1="70" x2="1316" y2="70" stroke="#d9d9d4" stroke-width="1"/>
    </g>

    <g transform="translate(28,600)">
      <text x="0" y="0" class="q">6 — There is one button. The variants live only in the mockup.</text>
      <text x="0" y="22" class="body">primary, danger outlined, danger filled, ghost, icon, link — none of them exist in App.css. Today everything is the secondary one.</text>
      <g transform="translate(0,38)">
        <text x="0" y="14" class="mono">a) add them now, as classes</text>
        <text x="300" y="14" class="mono">b) add them when a page needs one</text>
        <text x="640" y="14" class="mono">c) only primary and danger, the two the panel already wants</text>
      </g>
    </g>
  </g>

  <g transform="translate(48,2114)">
    <rect x="0" y="0" width="1344" height="60" rx="6" fill="#f7f7f5" stroke="#d9d9d4" stroke-width="2"/>
    <text x="20" y="26" class="body" font-size="13">
      panel/public/button-states.svg — drawn from the stylesheet as it is. Answer by number; nothing here changes until you do.
    </text>
    <text x="20" y="46" class="muted">
      Not drawn: hover on a touch screen (there is none), and :focus without -visible (the panel never shows it).
    </text>
  </g>
</svg>
