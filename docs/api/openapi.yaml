openapi: 3.1.0
info:
  title: xor.ad relay node
  version: "2026-09-17"
  description: |-
    The contract of the relay node, spec first (route to drawing, stage S4a, decided by the owner on 2026-09-15).
    x-status built — the route exists in relay/node/src (main.ts, routes/*.ts); its shapes were read from the code on 2026-09-15 and not exercised live.
    x-status spec — described in docs/protocol_EN.md §4 and the chat canon, not built; the 56 names proposed on 2026-09-16 were agreed by the owner on 2026-09-17 (docs/api/ROUTES_2026-09-17_naming_EN.md). Where the canon names no body, none is invented here.
    Checked by scripts/check-openapi.sh against the protocol tables, the code and the rendered pages.
    Since 2026-09-16 the eight areas of protocol §4.6–4.12 are in as proposed operations (tables, games in a chat, blocks and hiding, stepping away, support, the profile, reissuing the paper code); "My notices" reuse /report/decision and /legal/manifest. Decided the same day: the error shape ApiError, the x-protocol-version header, cursor pagination (protocol §6, §8).
  x-description-ru: |-
    Контракт узла relay, спецификация первая (маршрут до отрисовки, этап Э4а, решение владельца 15.09.2026).
    x-status built — маршрут есть в relay/node/src (main.ts, routes/*.ts); формы прочитаны из кода 15.09.2026 и живым запросом не проверены.
    x-status spec — описано в docs/protocol_RU.md §4 и каноне чата, не построено; 56 имён, предложенных 16.09.2026, утверждены владельцем 17.09.2026 (docs/api/ROUTES_2026-09-17_naming_RU.md). Где канон тела не называет, здесь его не выдумывают.
    Сверяется scripts/check-openapi.sh с таблицами протокола, кодом и собранными страницами.
    С 16.09.2026 восемь областей протокола §4.6–4.12 внесены операциями proposed (столы, игры в чате, блокировки и скрытие, отлучка, поддержка, профиль, перевыпуск бумажного кода); «Мои уведомления» идут через /report/decision и /legal/manifest. Тем же днём решены форма ошибки ApiError, заголовок x-protocol-version и пагинация курсором (протокол §6, §8).
tags:
  - name: node
    description: Service routes of the node. HEAD answers for every GET, OPTIONS answers 204 on any path (main.ts).
    x-description-ru: Служебные маршруты узла. HEAD отвечает на каждый GET, OPTIONS — 204 на любой путь (main.ts).
  - name: intake
    description: Public intake from the storefronts, keyed by a publishable key or none.
    x-description-ru: Публичный приём с витрин, по публикуемому ключу или без него.
  - name: v1
    description: The public API for third parties, by secret key. Errors have the form {error:{code,message}}.
    x-description-ru: Публичный API для третьих сторон, по секретному ключу. Ошибки в форме {error:{code,message}}.
  - name: auth
    description: Sign-in to the panel by an emailed link.
    x-description-ru: Вход в панель по ссылке из письма.
  - name: admin
    description: The panel's routes, by panel session and permission.
    x-description-ru: Маршруты панели, по сессии панели и пермишену.
  - name: identity
    description: Identity and session, the profile, reissuing the paper code (protocol §4.1, §4.11, §4.12). Not built.
    x-description-ru: Личность и сессия, профиль, перевыпуск бумажного кода (протокол §4.1, §4.11, §4.12). Не построено.
  - name: feed
    description: The feed (protocol §4.2). Not built.
    x-description-ru: Лента (протокол §4.2). Не построено.
  - name: chat
    description: Like, match, chat, games in a chat (protocol §4.3, §4.7). Not built.
    x-description-ru: Лайк, мэтч, чат, игры в чате (протокол §4.3, §4.7). Не построено.
  - name: tables
    description: Tables — a game for a company (protocol §4.6). Proposed 2026-09-16, not built.
    x-description-ru: Столы — игра компанией (протокол §4.6). Предложено 16.09.2026, не построено.
  - name: safety
    description: Blocks, hiding, stepping away (protocol §4.8, §4.9). Proposed 2026-09-16, not built.
    x-description-ru: Блокировки, скрытие, отлучка (протокол §4.8, §4.9). Предложено 16.09.2026, не построено.
  - name: offers
    description: Offers — the venue card in the feed, the redirect, complaints, the venue cabinet at adv.<storefront> (offers/SPEC_EN.md; protocol §4.13). Described 2026-09-19, not built.
    x-description-ru: Офферы — карточка заведения в ленте, переход, жалобы, кабинет заведения на adv.<витрина> (offers/SPEC_RU.md; протокол §4.13). Описано 19.09.2026, не построено.
  - name: support
    description: Support requests (protocol §4.10). Proposed 2026-09-16, not built.
    x-description-ru: Обращения в поддержку (протокол §4.10). Предложено 16.09.2026, не построено.
components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Publishable storefront key ak_pub_…, public by design; answers "which face", nothing more.
      x-description-ru: Публикуемый ключ витрины ak_pub_…, публичен по замыслу; отвечает «какое лицо», и только.
    secretKey:
      type: http
      scheme: bearer
      description: Secret key "ak_live_….secret" in Authorization. Scopes are permissions of access/.
      x-description-ru: Секретный ключ «ak_live_….секрет» в Authorization. Скоупы — пермишены access/.
    panelSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Panel session JWT (HS256, 7 days) from /auth/callback; each route checks a permission.
      x-description-ru: Сессия панели, JWT (HS256, 7 суток) из /auth/callback; каждый маршрут проверяет пермишен.
    metricsToken:
      type: http
      scheme: bearer
      description: METRICS_TOKEN in Authorization or x-metrics-token; without it the route answers 404.
      x-description-ru: METRICS_TOKEN в Authorization или x-metrics-token; без него маршрут отвечает 404.
    identitySignature:
      type: apiKey
      in: header
      name: x-identity-sign
      description: 'Request signature (protocol §2): ECDSA P-256 over method, path, body sha256 and unix time; with x-identity-session and x-identity-time, a ±5 minute window.'
      x-description-ru: 'Подпись запроса (протокол §2): ECDSA P-256 над методом, путём, sha256 тела и unix-временем; вместе с x-identity-session и x-identity-time, окно ±5 минут.'
    advertiserSession:
      type: apiKey
      in: cookie
      name: __Host-adv
      description: "The venue cabinet session (offers/SPEC_EN.md §2.1) — a cookie with HttpOnly, Secure, SameSite=Lax, Path=/, no Domain, on its own origin adv.<storefront> (2026-09-19: a shared origin with the app handed the cabinet to any XSS there) from the same magic link as the panel, role advertiser; every request checks ownership, not only the role."
      x-description-ru: "Сессия кабинета заведения (offers/SPEC_RU.md §2.1) — cookie с HttpOnly, Secure, SameSite=Lax, Path=/, без Domain, на своём источнике adv.<витрина> (19.09.2026: общий источник с приложением отдавал кабинет любой XSS в нём) по той же ссылке на почту, что у панели, роль advertiser; каждый запрос проверяет владение, а не только роль."
  schemas:
    Error:
      type: object
      description: The node's flat error.
      x-description-ru: Плоская ошибка узла.
      required: [error]
      properties:
        error: {type: string}
    V1Error:
      type: object
      description: The error form of /v1.
      x-description-ru: Форма ошибки /v1.
      required: [error]
      properties:
        error:
          type: object
          properties:
            code: {type: string, enum: [rate_limited, unauthorized, forbidden, unknown_brand, invalid_body]}
            message: {type: string}
    LegalReacceptance:
      type: object
      description: 409 for any signed request that publishes or opens a chat while an accepted revision is stale (protocol §6).
      x-description-ru: 409 на подписанный запрос, который публикует или открывает чат при разошедшейся редакции (протокол §6).
      properties:
        error: {type: string, const: legal_reacceptance_required}
        documents:
          type: array
          items:
            type: object
            properties:
              document: {type: string, enum: [terms, privacy, guidelines]}
              revision_date: {type: string, format: date}
              revision_sha256: {type: string}
    Ok:
      type: object
      properties:
        ok: {type: boolean}
    Health:
      type: object
      properties:
        status: {type: string, const: ok}
        node: {type: string}
        region: {type: string}
        env: {type: string}
        image: {type: string}
        storage: {type: boolean}
        storage_transport: {type: string}
        mail: {type: string}
        brands: {type: array, items: {type: string}}
        database: {type: string, enum: [ok, down, "off"]}
        ts: {type: string}
    Ready:
      type: object
      properties:
        status: {type: string, enum: [ready, not_ready]}
        node: {type: string}
        env: {type: string}
        database: {type: string}
        ts: {type: string}
    WaitlistLead:
      type: object
      required: [email]
      properties:
        email: {type: string, maxLength: 254, description: Checked by isEmail.}
        website: {type: string, description: Bot trap; a non-empty value answers 202 before any check.}
        source: {type: string, maxLength: 120}
        lang: {type: string, maxLength: 8}
        accent: {type: string, maxLength: 16}
        mode: {type: string, maxLength: 16}
        early_access: {type: boolean}
    ClientError:
      type: object
      properties:
        kind: {type: string, maxLength: 64}
        message: {type: string, maxLength: 1000}
        stack: {type: string, maxLength: 2000}
        page_url: {type: string, maxLength: 300}
        user_agent: {type: string, maxLength: 300}
        source: {type: string, maxLength: 120}
        extra: {type: object, description: "Flat, at most 12 keys."}
    Pageview:
      type: object
      properties:
        path: {type: string, maxLength: 200}
        lang: {type: string, maxLength: 8}
        referrer: {type: string, description: Only the host of an http(s) referrer is kept.}
        viewport: {type: number, description: "Reduced to mobile, tablet or desktop."}
        first_in_tab: {type: boolean}
        source: {type: string, maxLength: 120}
    Notice:
      type: object
      description: An Article 16 DSA notice.
      x-description-ru: Уведомление по ст. 16 DSA.
      required: [target_kind, reason_text, bona_fide]
      properties:
        receipt_hash: {type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256 of the receipt code born on the device (dsa/SPEC §6); proposed 2026-09-16, LAW-2 of pass 3 — not accepted by report.ts yet.", x-description-ru: "SHA-256 кода квитанции, рождённого на устройстве (dsa/SPEC §6); предложено 16.09.2026, LAW-2 прохода 3 — report.ts его ещё не принимает."}
        target_kind: {type: string, enum: [feed_message, offer, table_line, chat, other]}
        reason_text: {type: string, maxLength: 4000}
        bona_fide: {type: boolean, const: true}
        notifier_name: {type: string, maxLength: 200}
        notifier_email: {type: string}
        target_id: {type: string, maxLength: 400}
        lang: {type: string, maxLength: 8}
        source: {type: string, maxLength: 120}
    KeySelf:
      type: object
      properties:
        id: {type: string}
        brand: {type: string}
        name: {type: string}
        scopes: {type: array, items: {type: string}}
    FeedItem:
      type: object
      description: A feed card — a phrase, or a table on the first page only (protocol §4.2; kind added 2026-09-16, DATA-23). A feed item is a circle, not a point; lat and lon rounded to the grid of area_radius (protocol §4.2).
      x-description-ru: Карточка ленты — фраза либо стол только на первой странице (протокол §4.2; kind добавлен 16.09.2026, DATA-23). Карточка — круг, а не точка; lat и lon округлены до узла сетки с шагом area_radius (протокол §4.2).
      properties:
        kind: {type: string, enum: [phrase, table, offer], description: "offer — a venue's offer (2026-09-19, offers/SPEC_EN.md §7); a private author's offer stays a phrase with offer filled.", x-description-ru: "offer — оффер заведения (19.09.2026, offers/SPEC_RU.md §7); оффер частника остаётся фразой с заполненным offer."}
        offer: {$ref: "#/components/schemas/OfferCard"}
        game: {type: string, description: Table only., x-description-ru: Только у стола.}
        playing: {type: integer, description: Table only., x-description-ru: Только у стола.}
        watching: {type: integer, description: Table only., x-description-ru: Только у стола.}
        name: {type: string, description: "Table only, and only after the queue's verdict (2026-09-17).", x-description-ru: "Только у стола и только после вердикта очереди (17.09.2026)."}
        state: {type: string, enum: [liked, matched], description: "Only in GET /likes, on a phrase or a private author's offer (2026-09-17).", x-description-ru: "Только в GET /likes, у фразы и оффера частника (17.09.2026)."}
        id: {type: string, format: uuid}
        text: {type: string, maxLength: 128}
        mode: {type: string}
        lat: {type: number}
        lon: {type: number}
        area_radius: {type: integer, enum: [100, 300, 1000, 3000, 10000]}
        like_count: {type: integer}
        created_at: {type: integer, description: 'Unix seconds; carries visible_at, the moment the phrase passed the queue, not the moment it was submitted (chat canon §8.3, 2026-09-15).', x-description-ru: 'Unix-секунды; несёт visible_at — момент прохождения очереди, а не отправки (канон чата §8.3, 15.09.2026).'}
    LikeResult:
      type: object
      properties:
        state: {type: string, enum: [liked, matched, spent]}
        match_id: {type: string, format: uuid}
    SessionsInvite:
      type: object
      properties:
        lookup_id: {type: string, description: First 32 bytes of Argon2id over the nine-character code.}
        ttl: {type: integer, const: 120}
    ReceiptQuery:
      type: object
      description: The device's receipt code, in the body and never in the address (dsa/SPEC §6).
      x-description-ru: Код квитанции с устройства, в теле и никогда в адресе (dsa/SPEC §6).
      properties:
        code: {type: string}
    SessionsClaim:
      type: object
      properties:
        lookup_id: {type: string}
        enc_secret: {type: string, description: 'An envelope: the new device''s signing and wrapping public keys and a label.'}
    ChatsAlive:
      type: object
      properties:
        ids: {type: array, items: {type: string, format: uuid}}
    ChatsAliveResult:
      type: object
      properties:
        alive: {type: array, items: {type: string, format: uuid}}
    ApiError:
      type: object
      description: The common error of identity-signed routes (protocol §6, decided 2026-09-16). reason only on moderation refusals, a text from refusal-wordings.
      x-description-ru: Общая ошибка подписанных личностью маршрутов (протокол §6, решено 16.09.2026). reason только у отказов модерации, текст из refusal-wordings.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [rate_limited, protocol_version_unsupported, invalid_body, unauthorized, unavailable, already_seated, not_your_turn, illegal_move, stale_seq, nothing_to_undo, pending_exists, stepped_away, name_frozen, paused, age_step_down, filter_out_of_band, refused, not_found, too_young, pin_locked]
            message: {type: string}
            reason: {type: string}
            attempts_left: {type: integer, description: "On a wrong PIN: how many are left before the lock (screen 12).", x-description-ru: "При неверном ПИН: сколько осталось до замка (экран 12)."}
    Page:
      type: object
      description: A page of items and the cursor of the next one; an empty next is the end (protocol §6).
      x-description-ru: Страница строк и курсор следующей; пустой next — конец (протокол §6).
      required: [items, next]
      properties:
        items: {type: array, items: {type: object}}
        next: {type: string}
    FeedPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - properties: {items: {type: array, items: {$ref: "#/components/schemas/FeedItem"}}}
    TableCreate:
      type: object
      description: Set a table (chat spec §6.1, schema tables). Field names proposed 2026-09-16.
      x-description-ru: Поставить стол (спека чата §6.1, схема tables). Имена полей предложены 16.09.2026.
      required: [class, set, lat, lon, area_radius, seats, nonce]
      properties:
        nonce: {$ref: "#/components/schemas/Nonce"}
        class: {type: string, enum: [grid, free, dots, deck, dice, physics, word]}
        set: {type: string}
        lat: {type: number}
        lon: {type: number}
        area_radius: {type: integer, enum: [100, 300, 1000, 3000, 10000]}
        seats: {type: integer, minimum: 2, maximum: 6}
        name: {type: string, description: "Optional, up to 24 graphemes counted by the node; goes through the moderation queue, the verdict as a name_verdict frame with table (2026-09-17).", x-description-ru: "Необязательное, до 24 графем считает узел; идёт в очередь модерации, вердикт кадром name_verdict с table (17.09.2026)."}
    TableView:
      type: object
      description: The table minus what is hidden — your own hand, the backs of others' (chat spec §6.1).
      x-description-ru: Стол без скрытого — своя рука, рубашки чужих (спека чата §6.1).
      properties:
        id: {type: string, format: uuid}
        class: {type: string}
        set: {type: string}
        seat: {type: integer, description: Your own seat number; a spectator sits too (seat_no)., x-description-ru: Номер своего места; зритель тоже сидит (seat_no).}
        is_playing: {type: boolean, description: false for a spectator (playing_from is empty)., x-description-ru: false у зрителя (playing_from пуст).}
        playing: {type: integer}
        watching: {type: integer}
        name: {type: string, description: "After the queue's verdict; absent while pending or refused (2026-09-17).", x-description-ru: "После вердикта очереди; пусто, пока ждёт или отклонено (17.09.2026)."}
        like_count: {type: integer, description: Public like count (2026-09-17)., x-description-ru: Публичное число лайков (17.09.2026).}
        seats: {type: array, description: "Who sits where — the names the screens write («Аня · 3», «ход: Аня»), the role and the size of a hand, never its tiles (chat spec §6.1).", x-description-ru: "Кто где сидит — имена, которые пишут экраны («Аня · 3», «ход: Аня»), роль и размер руки, но не её фишки (спека чата §6.1).", items: {type: object, properties: {seat: {type: integer}, name: {type: string}, role: {type: string, enum: [playing, watching]}, hand_count: {type: integer}}}}
        board: {$ref: "#/components/schemas/Board"}
        lines: {type: array, items: {$ref: "#/components/schemas/TableLine"}}
    Board:
      type: object
      description: Board state — seq, state by class (jsonb), whose turn, score by seat, expires_at (chat spec §6, table_games / chat_games).
      x-description-ru: Состояние доски — seq, state по классу (jsonb), чей ход, счёт по местам, expires_at (спека чата §6, table_games / chat_games).
      properties:
        seq: {type: integer}
        state: {type: object}
        turn: {type: integer}
        score: {type: object}
        over: {type: boolean, description: "The game ended; the score is final (screens 18 D, 19 C).", x-description-ru: "Партия окончена; счёт итоговый (экраны 18 D, 19 C)."}
        expires_at: {type: string, format: date-time}
        pending: {type: object, description: 'The open proposal or the running confirmation: {kind, id, class, set, answers, until}; survives a restart (OPS-12).', x-description-ru: 'Открытое предложение или идущий отсчёт: {kind, id, class, set, answers, until}; переживает перезапуск (OPS-12).'}
    TableLine:
      type: object
      properties:
        id: {type: string, format: uuid}
        seat: {type: integer}
        kind: {type: string, enum: [line, application, refusal, sticker, move, congratulation]}
        text: {type: string}
        sticker: {type: string}
        created_at: {type: string, format: date-time}
    TableLineCreate:
      type: object
      description: A line, an application or a refusal go through the moderation queue (202); a sticker from our catalogue does not (200). Chat spec §6.1.
      x-description-ru: Реплика, заявка и отказ идут через очередь модерации (202); стикер из нашего каталога — нет (200). Спека чата §6.1.
      required: [kind]
      properties:
        kind: {type: string, enum: [line, application, refusal, sticker]}
        text: {type: string, description: Up to 128 graphemes (phrase.length)., x-description-ru: До 128 графем (phrase.length).}
        sticker: {type: string}
    Move:
      type: object
      description: A move in the board class's terms, or a pass. seq is the expected board version (monotonic); the same body at the same seq answers the same board, a foreign version gets 409 stale_seq (protocol §4.6, 2026-09-16).
      x-description-ru: Ход в терминах класса доски или пас. seq — ожидаемая версия доски (монотонна); то же тело при том же seq отвечает той же доской, чужая версия — 409 stale_seq (протокол §4.6, 16.09.2026).
      required: [seq]
      properties:
        seq: {type: integer}
        pass: {type: boolean}
        move: {type: object, description: 'By class — a cell, an edge, a piece, a letter, {roll}, {deal}, {flick, impulse}.', x-description-ru: 'По классу — клетка, ребро, фишка, буква, {roll}, {deal}, {flick, impulse}.'}
    Proposal:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [rematch, draw, undo]}
        class: {type: string}
        set: {type: string}
    ProposalAnswer:
      type: object
      required: [answer]
      properties:
        answer: {type: string, enum: [accept, decline, counter]}
        class: {type: string}
        set: {type: string}
    Seat:
      type: object
      required: [seat]
      properties:
        seat: {type: integer}
    GameOffer:
      type: object
      required: [class, set]
      properties:
        class: {type: string, enum: [grid, free, dots, deck, dice, physics, word]}
        set: {type: string}
    Word:
      type: object
      required: [word]
      properties:
        word: {type: string, description: The hangman word; goes through the same queue as a phrase., x-description-ru: "Слово виселицы; идёт через ту же очередь, что и фраза."}
    BlockTarget:
      type: object
