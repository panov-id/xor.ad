# What the report says that no script can measure: expert estimates from the
# roadmap, the day's summary, what waits on the owner. build.py takes numbers
# from the measurements and words from here.
#
# Each block carries the date it was true on. build.py prints those dates next
# to the text and raises a red banner when a date falls behind the last day
# with commits — stale words are shown as stale, not passed off as today's.
#
# Text is HTML (<code>, <b>); {placeholders} are filled from the measurements:
#   {ahead} {ahead_commits} ("74 коммита") {mig_last} {branch}
# Numbers a script measures do not belong here: they drift from the tree.

