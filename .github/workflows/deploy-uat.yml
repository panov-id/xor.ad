name: Deploy UAT

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        name: Create release tag
        run: |
          # Semver, or the image never gets built. docker/metadata-action emits a
          # semver image tag only for a valid version, and "2026.08.05" is not one:
          # a leading zero makes it invalid, so the tag existed in git and nowhere
          # in the registry. %-m/%-d drop the padding.
          #
          # The sha carries a "g" prefix (git describe's convention) so it can
          # never be read as a numeric pre-release identifier — those may not have
          # a leading zero either, and a sha of all digits starting with one would
          # break the same way, rarely and unforgettably.
          TAG="v$(date +%Y.%-m.%-d)-g${GITHUB_SHA::7}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Created release $TAG"

  # Build the images under the release tag. Without this the tag exists in git
  # and nowhere in the registry, and a node can only ever be pinned by sha.
  images:
    needs: release
    uses: ./.github/workflows/relay.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  call:
    needs: release
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: uat
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
