# Local-dev xor.ad gateway: plain nginx, no TLS. Serves both landings by
# hostname and proxies their API calls to the local relay stand.
#
# Standalone — it used to be started alongside the vendored Supabase stack and
# depended on Kong; both are gone, so it now runs on its own:
#
#   docker compose -f docker-compose.gateway.yml up -d
#
# The relay stand supplies the API and must be up too:
#
#   cd relay/local && docker compose up -d
#
# Test locally without editing /etc/hosts:
#   curl -H "Host: sosed.place" http://localhost:8080/
#   curl -H "Host: neighbro.place" http://localhost:8080/

services:
  nginx:
    container_name: xor-ad-gateway
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    # The node lives in another compose project, so nginx reaches it through the
    # host. Without this mapping host.docker.internal does not resolve on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sosed.place/landing:/var/www/sosed.place:ro
      - ./neighbro.place/landing:/var/www/neighbro.place:ro
