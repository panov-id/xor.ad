<text x="48" y="96" font-family="Golos Text" font-weight="400" font-size="16" fill="#545b63" text-anchor="start">no heart (owner 11.10). Tap: the windows light one by one, once; liked: they stay lit — «I'm in».</text>
<text x="48" y="120" font-family="Golos Text" font-weight="400" font-size="16" fill="#545b63" text-anchor="start">Taken back: they go dark at once. Nothing moves at rest, nothing on scroll; reduced motion: lit at once.</text>
<text x="48" y="178" font-family="Golos Text" font-weight="600" font-size="20" fill="#141618" text-anchor="start">1 · states (96 here, 44 on a card)</text>
