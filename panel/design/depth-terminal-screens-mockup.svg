<g clip-path="url(#s0)">
<text x="34.0" y="36" class="h">1 · регистрация (new)</text>
<text x="34.0" y="70" xml:space="preserve">Operator.</text>
<text x="34.0" y="88" xml:space="preserve"></text>
<text x="34.0" y="106" xml:space="preserve">Новая личность. Она живёт в этом томе; удалишь том — это будет другой человек.</text>
<text x="34.0" y="124" xml:space="preserve"></text>
<text x="34.0" y="142" xml:space="preserve">  имя   &gt; Аня_</text>
<text x="34.0" y="160" xml:space="preserve">  возраст &gt; 27</text>
<text x="34.0" y="178" xml:space="preserve"></text>
<text x="34.0" y="196" xml:space="preserve">  [enter] дальше   [esc] выход</text>
<text x="34.0" y="214" xml:space="preserve"></text>
<text x="34.0" y="232" xml:space="preserve"></text>
<text x="34.0" y="250" xml:space="preserve">Бумажный код (запиши, на экране он больше не появится):</text>
<text x="34.0" y="268" xml:space="preserve"></text>
<text x="34.0" y="286" xml:space="preserve">      K7Q-M3F-2X9</text>
<text x="34.0" y="304" xml:space="preserve"></text>
<text x="34.0" y="322" xml:space="preserve">  повтори код &gt; ___-___-___</text>
<text x="34.0" y="340" xml:space="preserve"></text>
<text x="34.0" y="358" xml:space="preserve" class="c"># ПИН и настоящий код — заглушки testOnly до решения по Argon2id</text>
</g>
<clipPath id="s1"><rect x="740.0" y="20" width="686" height="482"/></clipPath>
<rect x="740.0" y="20" width="700" height="482" rx="6" fill="#14140f"/>
<g clip-path="url(#s1)">
<text x="754.0" y="36" class="h">2 · лента (signal)</text>
<text x="754.0" y="70" xml:space="preserve">signal · broadcast depth 1000 м · depth of field 24–34           Аня, 27</text>
<text x="754.0" y="88" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────</text>
<text x="754.0" y="106" xml:space="preserve">› Марк, 29 · 300 м · 4 мин</text>
<text x="754.0" y="124" xml:space="preserve">  кто на пробежку вдоль реки в семь?                                    [l] ♥</text>
<text x="754.0" y="142" xml:space="preserve"></text>
<text x="754.0" y="160" xml:space="preserve">  Ира, 31 · 1 км · 12 мин</text>
<text x="754.0" y="178" xml:space="preserve">  ищу компанию на выставку в субботу</text>
<text x="754.0" y="196" xml:space="preserve"></text>
<text x="754.0" y="214" xml:space="preserve">  Том, 26 · 800 м · 20 мин</text>
<text x="754.0" y="232" xml:space="preserve">  продаю велосипед, но лучше бы покатались вместе</text>
<text x="754.0" y="250" xml:space="preserve"></text>
<text x="754.0" y="268" xml:space="preserve"></text>
<text x="754.0" y="286" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────</text>
<text x="754.0" y="304" xml:space="preserve">твоя фраза: «гуляю у реки» · на проверке</text>
<text x="754.0" y="322" xml:space="preserve"></text>
<text x="754.0" y="340" xml:space="preserve">[↑↓] выбор  [l] лайк  [u] снять  [n] новая фраза  [i] входящие  [q] hardline</text>
</g>
