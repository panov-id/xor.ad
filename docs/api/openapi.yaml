      security: [{panelSession: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer}}
        - {name: before, in: query, schema: {type: string}}
        - {name: brand, in: query, schema: {type: string}}
      responses:
        "200": {description: Rows, totals and 32 time buckets., x-description-ru: Строки, итоги и 32 корзины по времени.}
        "403": {description: forbidden, x-description-ru: запрещено}
