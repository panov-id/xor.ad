# Dashboards come from files, and Grafana is told not to let anyone save over
# them: a dashboard edited in the browser is a dashboard that exists in one
# person's Grafana and nowhere else.
apiVersion: 1
providers:
  - name: relay
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
