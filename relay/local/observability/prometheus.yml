# What scrapes the node on the local stand.
#
# The node's /metrics is behind a shared token and answers 404 without one
# (relay/node/src/routes/metrics.ts explains why 404 and not 401), so the token
# is configured here as well as on the node. On the stand it is a throwaway
# string in plain sight; on a real box it comes from the wizard's secrets.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: relay-node
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: local-metrics-token
    static_configs:
      - targets: ["node:8080"]
        labels:
          env: local
