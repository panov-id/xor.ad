# Alerts, and for each one the sentence it is trying to make true.
#
# Every rule here answers a failure that was invisible before the numbers under
# it existed — most of them named by the review panel of 2026-09-20. Rules that
# would fire on an idle stand are written so that they do not: an alert nobody
# can act on at three in the morning teaches people to ignore the channel.
groups:
  - name: relay-identity
    rules:
      # The queue is how the node keeps the promises nobody watches. A chain
      # dies when a job exhausts its attempts and leaves a tombstone, because
      # enqueueOnce will not replace one — so "a tombstone and nothing standing"
      # is not a warning, it is the work having stopped for good.
      - alert: JobChainDead
        expr: relay_jobs_tombstones > 0 and relay_jobs_standing == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Очередь {{ $labels.kind }} встала: есть надгробие и нет стоячей задачи"
          description: "Задача выработала попытки и не перевзвелась. Сама она не вернётся — enqueueOnce надгробие не заменяет."

      # Overdue by an hour means nothing is claiming jobs: the worker loop is
      # gone, the lease is stuck, or every node is down. The number is an hour
      # because the shortest chain re-arms hourly.
      - alert: JobsOverdue
        expr: relay_jobs_oldest_due_seconds > 3600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Задача {{ $labels.kind }} просрочена больше часа"
          description: "Никто не берёт задачи: воркер не крутится, аренда застряла, или узлов нет."

      # The sweeper is the only thing enforcing three deadlines an identity has
      # (§8.2). Silence here is not calm — it is a promise nobody is keeping.
      # Two halves, and the second is the one that matters. "Last pass was long
      # ago" only fires once there has been a pass; a sweeper that never ran at
      # all publishes no series, and a rule written on the metric alone stays
      # silent in exactly the worst case — measured on the stand 2026-09-20,
      # where the rule sat inactive while the sweeper had never run. `absent()`
      # is guarded by the node's own uptime so that a node three minutes old is
      # not reported for work that is due hourly.
      - alert: IdentitySweeperSilent
        expr: >-
          (time() - relay_identity_sweeper_last_pass_seconds > 10800)
          or (absent(relay_identity_sweeper_last_pass_seconds) and on() (relay_process_uptime_seconds > 10800))
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Уборщик личностей молчит больше трёх часов"
          description: "Проход должен быть раз в час. Три срока §8.2 сейчас не исполняются: брошенные регистрации, год бездействия, тридцать дней после закрытия."

      # The sweeper that runs and still closes nobody. It passes over an
      # identity whose share, session or row somebody holds locked (SKIP LOCKED
      # in relay/node/src/lib/identity_sweeper.ts; rows since the same day —
      # the verifier found a row held for good raised nothing) — once is a transfer or a PIN in
      # flight, but a lock that never lets go keeps an identity past its year
      # while every pass looks healthy (review panel 2026-09-25, operations
      # lens). Passes are hourly, so a 90-minute window always holds one; `for:
      # 3h` means three passes in a row skipped somebody. The counter is not per
      # identity: a stream of different short holds reads the same, and the
      # answer to both is to look at pg_locks. retry_cap is that stream seen
      # from the batch: five attempts in a row each lost somebody new, and the
      # ones nobody held were dropped with them (counted as share_held until
      # 2026-09-26). came_back is a person, not a lock.
      - alert: IdentitySweeperKeepsSkipping
        expr: sum(increase(relay_identity_sweeper_skipped_total{reason=~"share_held|row_held|retry_cap"}[90m])) > 0
        for: 3h
        labels: { severity: warning }
        annotations:
          summary: "Уборщик третий час подряд пропускает личности: долю или строку держит блокировка"
          description: "Каждый проход находит личность, которой срок вышел, и не может её закрыть: её долю, сессию или строку держит чужая транзакция. Смотреть pg_locks по vault_shares, sessions и identities — застрявшая транзакция держит личность дольше её года."

      # Watchdog С7 (relay/node/src/lib/backup_watch.ts): the marker of the last
      # nightly dump is older than 26 hours. -1 means none seen yet, not old.
      - alert: BackupStale
        expr: max(relay_backup_age_seconds) > 26 * 3600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Ночной бэкап опаздывает: {{ $value | humanizeDuration }}"
          description: "Метка last-ok.json не обновлялась больше 26 часов. Смотреть relay-backup.service на боксе и зону хранилища."

      # Watchdog С6 (relay/node/src/lib/queue_metrics.ts): the oldest phrase
      # waiting for a verdict is near moderation.queue.wait, 10 minutes — past
      # it the phrase is swept unread, so an age there means the queue stopped,
      # not that it slowed. Nine minutes rather than ten: at ten the sweep has
      # already taken the evidence. `info` for the reason FeedPublishesNothing
      # gives: until the moderator of §8.14 is wired every phrase ages to the
      # ceiling, and a warning nobody can act on teaches the channel to be
      # ignored. Raise it with FeedPublishesNothing the day the moderator ships.
      #
      # Over five minutes, not the instant (review panel F12, 2026-09-26): one
      # stuck phrase is past nine minutes only from its ninth minute until the
      # sweep takes it between the tenth and the eleventh, so the instant value
      # never stayed up for `for: 2m` and a lone stuck phrase never fired. The
      # peak of the last five minutes stays up long enough.
      - alert: ModerationQueueStopped
        expr: max by (brand) (max_over_time(relay_moderation_oldest_seconds[5m])) > 9 * 60
        for: 2m
        labels: { severity: info }
        annotations:
          summary: "Очередь модерации {{ $labels.brand }} стоит: старейшей фразе {{ $value | humanizeDuration }}"
          description: "Фраза ждёт вердикта дольше девяти минут; на десятой её снимут непрочитанной (moderation.queue.wait). Смотреть воркер модерации и relay_feed_verdict_total."

      # A burst of wrong PINs is somebody working through a stolen signing key
      # or an unlocked tab. Ten in five minutes is far above a person mistyping.
      - alert: PinMissBurst
        # Every door that takes a PIN proof: the share, a PIN change and a close
        # (review panel 2026-09-24 — /vault/pin and /identities/close counted
        # their misses where this rule did not look).
        expr: ((sum(rate(relay_vault_share_total{result="wrong"}[5m])) or vector(0)) + sum(rate(relay_vault_pin_total{result="wrong"}[5m]) or vector(0)) + sum(rate(relay_identity_close_total{result="wrong"}[5m]) or vector(0))) * 300 > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Всплеск неверных ПИНов: {{ $value | printf \"%.0f\" }} за пять минут"
          description: "Похоже на перебор с украденным ключом подписи. Десятая ошибка закрывает вход до бумажного кода и замораживает сессию."

      # Freezes by pin_limit are people being locked out. A wave of them is
      # either an attack or a defect in the counter — both worth waking for.
      - alert: SessionFreezeBurst
        expr: sum(rate(relay_sessions_frozen_total{reason="pin_limit"}[15m])) * 900 > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Заморозок по лимиту ПИНа: {{ $value | printf \"%.0f\" }} за пятнадцать минут"
          description: "Либо атака на чужие вкладки, либо дефект счётчика попыток. Каждая такая заморозка — человек без входа до бумажного кода."

      # The shared brake on paper codes. It coming on at all is an event: it
      # means fifty wrong codes in an hour, and while it is on a genuine code
      # waits too — the price the spec names out loud.
      - alert: RecoveryBrakeOn
        expr: relay_recovery_pause_seconds_left > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Приём бумажных кодов на паузе"
          description: "Пятьдесят промахов за час. Пока пауза держится, честный код тоже не принимается."

      # The same brake on transfer codes (claim.miss.shared / claim.miss.pause:
      # the recovery numbers, chat spec §8.2, SEC-4). The node exported the
      # series and nothing watched it (quorum of B30, 2026-09-26): while it is
      # on, nobody can move an identity to a new device, and the owner would
      # learn it from a person who could not.
      - alert: TransferBrakeOn
        expr: relay_transfer_pause_seconds_left > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Приём кодов переноса на паузе"
          description: "Пятьдесят неверных кодов переноса за час. Пока пауза держится, честный перенос тоже не принимается."

      # The minute's job that finishes the tenth PIN miss (lib/take_down.ts,
      # takeDownLeftByPinLimit): a freeze or a take-down it could not do this
      # minute is put off to the next, and one that keeps being put off leaves a
      # session live, or phrases and likes up, under a name whose entry is
      # closed (review panel 4, К5, B74). A lock held that long is a stuck
      # transaction somewhere; the log line carries the database's code. Put off
      # at least once in every five minutes, for half an hour.
      - alert: TakeDownPinLimitDeferred
        expr: sum(increase(relay_take_down_pin_limit_total{result=~"deferred|freeze_deferred"}[5m])) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Снятие после десятого неверного ПИНа откладывается"
          description: "Минутная задача полчаса не может заморозить сессию или снять живое у личности с закрытым входом. Код ошибки — в журнале узла."

      # The same job meeting something other than a lock (B93): one person's
      # pass logged, counted failed and passed over, the rest done. Not the
      # alert above, by cause and by what to look at: a lock lets go and is
      # watched for half an hour; an error is code or data, it fails the same
      # person every minute and does not pass on its own. A quarter of an hour
      # of failing every five minutes, so a single failure — a restart, a
      # dropped connection — stays quiet (B100, 2026-09-26).
      - alert: TakeDownPinLimitFailing
        expr: sum(increase(relay_take_down_pin_limit_total{result="failed"}[5m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Минутная задача снятия после десятого неверного ПИНа падает"
          description: "Минутная задача четверть часа подряд падает на одной или нескольких личностях с закрытым входом — не на блокировке, а на ошибке. Сама она не пройдёт: у человека остаётся живая сессия или живое под именем. Смотреть журнал узла: «failed; the next minute tries again» с идентификатором и текстом ошибки."

      # A right paper code the node could not write (relay/node/src/routes/
      # identity.ts, claim on a new device). There is no retry on the person's
      # side worth the name: they hold the code and got 503, so one is enough.
      # The node publishes the series at zero from the start, so the first
      # failure after a restart is a 0 -> 1 step increase() sees; an earlier
      # `unless … offset` half guessed at it and fired on a 20-minute scrape gap
      # over an old failure (verifier, 2026-09-25; alerts.test.yml).
      - alert: RecoveryClaimCannotWrite
        expr: sum(increase(relay_recovery_claim_total{result="storage_failed"}[15m])) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Восстановление бумажным кодом не записывается"
          description: "Верный бумажный код получил 503: узел не смог записать новое устройство. Человек без входа держит код в руках — смотреть журнал узла, «recovery claim failed on a new device»."

      # Anything the node answers 5xx to. The label comes from dispatch.ts's own
      # request counter, so this covers every route rather than the ones
      # somebody remembered to instrument.
      - alert: ServerErrors
        expr: sum(rate(relay_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Узел отвечает пятисотыми"
          description: "Больше шести ошибок в минуту. Смотреть журнал узла: чаще всего это база."

      # Mail is how the product answers people under Article 16 and how the
      # panel lets anyone in at all. A node that cannot send is a node that
      # looks healthy and quietly stops answering obligations.
      - alert: MailFailing
        expr: sum(rate(relay_mail_total{result!="sent"}[15m])) > 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Почта не уходит"
          description: "Подтверждения по ст. 16 и ссылки для входа в панель не доставляются."

      # The DSA queue has a legal clock on it, not an operational one.
      - alert: DsaQueueStuck
        expr: sum(relay_dsa_queue_open) > 0 and sum(rate(relay_dsa_decisions_total[6h])) == 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Очередь ст. 16 не разбирается"
          description: "Есть незакрытые уведомления и ни одного решения за шесть часов. Сроки ответа — регуляторные. Возраст самого старого — relay_dsa_queue_oldest_seconds."

      # The notifier's Article 16(5) letter about a decision, given up: every
      # try used (lib/notice_notify.ts, about a day of doubling waits), or a
      # notice decided in the db/058 window with no text to send again. The
      # decision still reaches the notifier's device by the receipt (§6); the
      # letter is the channel for whoever cleared their browser, and nothing
      # else retries it (review panel G1, G3; B46, 2026-09-26).
      #
      # Over a gauge read from the rows, not an hour's increase of a counter
      # (review panel 3, O2 and O3; B63): the increase went "resolved" an hour
      # later with the letter still unsent, and a node that died holding the
      # last try counted nothing. Every node reads the same table, hence max.
      - alert: DsaDecisionLetterExhausted
        expr: max(relay_dsa_decision_letters_given_up) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Письмо о решении по ст. 16(5) не ушло"
          description: "Все попытки исчерпаны, или у решения нет сохранённого текста письма. Заявитель узнает решение только по квитанции на устройстве. Тревога держится, пока у такого уведомления не отмечена отправка (dsa_notices.decision_sent_at). Смотреть relay_dsa_decision_letters_given_up и почтовый транспорт."

      # A DSA letter that left and whose sent mark could not be written
      # (markLetterSent in lib/notice_notify.ts; review panel G5, B47). At least
      # once is the design, so the next pass sends it again — but a mark that
      # keeps failing is the database refusing writes, and the notifier gets the
      # same letter on every pass until someone looks (B53, 2026-09-26).
      - alert: DsaLetterMarkFailed
        expr: sum by (letter) (increase(relay_dsa_letter_mark_failed_total[1h])) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Письмо по ст. 16 ушло, отметка об отправке не записалась ({{ $labels.letter }})"
          description: "Следующий проход отправит письмо снова: заявитель получит его повторно. Смотреть журнал узла («a letter left and its mark was not written») и запись в dsa_notices."

      # The feed with no moderator behind it. publishPhrase() is called by the
      # stale-queue sweeper after ten minutes and by nothing else, so a phrase
      # that nobody read is deleted unread — which is the design until §8.14 is
      # wired, and is also exactly what a broken moderator would look like. The
      # difference is in the ratio, not in either number alone: phrases coming
      # in and none going out.
      #
      # Warning, not critical: nothing is lost that was ever visible, and the
      # answer is a person deciding, not a restart at three in the morning.
      - alert: FeedPublishesNothing
        # `or vector(0)`: before the first phrase is ever published there is no
        # published series, and `sum` of nothing is an empty vector rather than
        # a zero — the rule stayed silent until a first publish after a
        # restart. alerts.test.yml holds that case (review panel, 2026-09-21).
        # `info` until the moderator of §8.14 is wired: until then this state is
        # the expected one, and a warning nobody can act on teaches people to
        # ignore the channel. Raise it back the day the moderator ships.
        expr: sum(rate(relay_feed_verdict_total{verdict="expired_unread"}[1h])) > 0
              and (sum(rate(relay_feed_verdict_total{verdict="published"}[1h])) or vector(0)) == 0
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Лента принимает фразы и не публикует ни одной"
          description: "За час ни одного published и хотя бы один expired_unread: очередь есть, вердиктов нет. Пока модератора нет (§8.14), это ожидаемо — тревога существует, чтобы ожидаемое не спуталось с поломкой в тот день, когда модератор появится."

      # Likes that the node could not write. Each is a person's like that came
      # back 503, and a stream of them is the database, not the people: the
      # likes review panel (2026-09-21) found the counter emitted and read by
      # nothing. `or vector(0)` on both sides for the reason FeedPublishesNothing
      # gives — a series that has never been written is empty, not zero.
      - alert: LikesCannotWrite
        expr: (sum(rate(relay_like_total{result="storage_failed"}[10m])) or vector(0))
              + (sum(rate(relay_unlike_total{result="storage_failed"}[10m])) or vector(0)) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Лайки не записываются"
          description: "Десять минут подряд лайк или его снятие отвечают 503: узел не может писать в базу. Люди видят, что лайк не поставился."

      # A stolen signing key being walked through PINs at the transfer window.
      # Until 2026-09-21 that cost nothing at all; now it spends attempts, and
      # the counter is what makes the attempt visible. A handful of wrong PINs
      # is somebody's memory; a stream of them from one node is not.
      - alert: TransferPinGuessing
        expr: sum(rate(relay_transfer_total{result="wrong_pin"}[15m])) * 900 > 20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "ПИН на окне переноса подбирают"
          description: "Больше двадцати неверных ПИНов за пятнадцать минут. Десятая попытка закрывает вход и замораживает сессию (§8.2) — если вместе с ним растёт relay_sessions_frozen_total{reason=\"pin_limit\"} (SessionFreezeBurst), защита сработала; если нет, попытки идут с разных сессий."

      # Article 17 is a duty, not a feature: an author with no mailbox learns
      # why their phrase went only through this route.
      - alert: StatementsUnavailable
        expr: sum(rate(relay_statements_total{result="unavailable"}[15m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Мотивировки по ст. 17 не отдаются"
          description: "Маршрут отвечает 503. Это единственный путь, которым автор без почты узнаёт причину ограничения."
