<text x="870" y="916" class="cap">C · Аня отказала или срок мэтча вышел: надгробие поверх ждущей беседы, очередь погашена, поле закрыто</text>

<text x="40" y="970" class="h">Вопросы</text>
<text x="40" y="1002" class="q">1. Очередь: A — только без ✓ (как при переподключении), или B — плюс строка «в очереди · уйдут, когда Аня согласится»?</text>
<text x="40" y="1030" class="q">2. Шапка ждущей беседы: «ждём ответа · остаток 3 ч 50 мин» (срок мэтча) — или «Аня, 24 · ждёт ответа» без числа?</text>
<text x="40" y="1058" class="q">3. Надгробие отказа: слова «Написанное никуда не отправилось.» оставить (честно про очередь) или убрать (не напоминать)?</text>
