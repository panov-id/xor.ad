<text x="754.0" y="860" xml:space="preserve">&gt; _                                                                      0/146</text>
<text x="754.0" y="878" xml:space="preserve">[enter] отправить  [ctrl+k] сверено  [esc] назад · истории на диске нет</text>
</g>
<text x="20" y="1024" class="q" font-weight="600">Вопросы</text>
<text x="20" y="1048" class="q">1. Язык экранов: русский (как нарисовано), английский или по локали терминала?</text>
<text x="20" y="1072" class="q">2. Голос Operator (signal, broadcast depth, depth of field, hardline) — оставляем как в памяти от 07.08?</text>
<text x="20" y="1096" class="q">3. Координаты в терминале: ввод руками при старте, сохранённая точка в томе или только область без точки?</text>
<text x="20" y="1120" class="q">4. Код в шапке — всегда видно (как нарисовано) или по клавише?</text>
<text x="20" y="1144" class="q">5. «Сверено» — отметка до выхода из процесса (как нарисовано, не хранится) — так?</text>
<text x="20" y="1168" class="q">6. Навигация: клавиши-буквы (как нарисовано) или только стрелки и enter?</text>
</svg>