<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
<title>Panel · Venue envelopes — codes to print and post · light theme, 1280 px (D3, 2026-09-27)</title>
<style>
  text { font-family: "Inter", system-ui, sans-serif; font-size: 15px; fill: #14140f; }
  .disp { font-family: "Unbounded", "Inter", sans-serif; font-size: 22px; font-weight: 600; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 15px; }
  .muted { fill: #5b5b55; }
  .micro { font-size: 12px; fill: #5b5b55; }
  .th { font-size: 12px; font-weight: 600; fill: #5b5b55; letter-spacing: .04em; }
  .warn { fill: #8a5200; }
  .danger { fill: #b3261e; }
  .onaccent { fill: #ffffff; font-weight: 600; }
  .q { font-size: 14px; }
  .qh { font-size: 14px; font-weight: 600; }
  .line { stroke: #d9d9d4; stroke-width: 1; }
</style>
<rect width="1280" height="960" fill="#f2f2f0"/>

<!-- page head: venue_envelopes (db/068, O1): the code is kept only to be printed -->
<text x="40" y="56" class="disp">Envelopes to post</text>
<text x="40" y="82" class="muted">Venues that ordered an envelope. The code proves the address: print it, post it, mark it sent. 30 days, then it burns.</text>
<text x="1240" y="56" text-anchor="end" class="micro">2 to print · 1 posted</text>

<!-- card -->
<rect x="44" y="108" width="1200" height="324" rx="6" fill="#14140f"/>
<rect x="40" y="104" width="1200" height="324" rx="6" fill="#ffffff" stroke="#14140f" stroke-width="2"/>

<text x="60" y="130" class="th">ORDERED</text>
<text x="170" y="130" class="th">VENUE</text>
<text x="420" y="130" class="th">ADDRESS</text>
<text x="760" y="130" class="th">CODE</text>
<text x="930" y="130" class="th">BURNS</text>
<line x1="41" y1="144" x2="1239" y2="144" class="line"/>

<!-- row 1: to print -->
<text x="60" y="180">26.09 18:04</text>
<text x="170" y="180">Кофейня «Угол»</text>
<text x="420" y="180">ул. Руставели 12, Тбилиси</text>
<text x="760" y="180" class="mono">K7QD-4MXA-9PTE</text>
<text x="930" y="180" class="muted">26.10</text>
<rect x="1002" y="159" width="100" height="36" rx="6" fill="#14140f"/><rect x="1000" y="157" width="100" height="36" rx="6" fill="#3355dd" stroke="#14140f" stroke-width="2"/><text x="1050" y="180" text-anchor="middle" class="onaccent">Print</text>
<rect x="1116" y="157" width="100" height="36" rx="6" fill="#ffffff" stroke="#14140f" stroke-width="2"/><text x="1166" y="180" text-anchor="middle">Sent</text>
<line x1="41" y1="216" x2="1239" y2="216" class="line"/>

<!-- row 2: to print, reordered — the earlier one is burnt -->
<text x="60" y="252">27.09 09:40</text>
<text x="170" y="252">Пекарня на Садовой</text>
<text x="420" y="252">Садовая ул. 3, Санкт-Петербург</text>
<text x="760" y="252" class="mono">R2WN-8HCF-3LZB</text>
<text x="930" y="252" class="muted">27.10</text>
<rect x="170" y="262" width="176" height="20" rx="3" fill="none" stroke="#b26a00"/><text x="258" y="276" text-anchor="middle" class="micro warn">second order · the first burnt</text>
<rect x="1002" y="231" width="100" height="36" rx="6" fill="#14140f"/><rect x="1000" y="229" width="100" height="36" rx="6" fill="#3355dd" stroke="#14140f" stroke-width="2"/><text x="1050" y="252" text-anchor="middle" class="onaccent">Print</text>
<rect x="1116" y="229" width="100" height="36" rx="6" fill="#ffffff" stroke="#14140f" stroke-width="2"/><text x="1166" y="252" text-anchor="middle">Sent</text>
<line x1="41" y1="304" x2="1239" y2="304" class="line"/>

<!-- row 3: posted, code no longer on the screen -->
<text x="60" y="340" class="muted">24.09 12:15</text>
<text x="170" y="340" class="muted">Бар «Дача»</text>
<text x="420" y="340" class="muted">Kurfürstendamm 40, Berlin</text>
<text x="760" y="340" class="muted">sent 25.09</text>
<text x="760" y="360" class="micro">2 of 5 tries left</text>
<text x="930" y="340" class="muted">24.10</text>
<text x="60" y="404" class="micro">The code stays readable until the envelope is used or burnt (db/068). Once marked sent it is hidden here, to keep it off screens it no longer needs.</text>

<!-- the printed sheet: A6 envelope insert, what Print opens -->
<text x="40" y="476" class="qh">What «Print» opens — the insert, A6</text>
<rect x="44" y="492" width="420" height="296" rx="6" fill="#14140f"/>
<rect x="40" y="488" width="420" height="296" rx="6" fill="#ffffff" stroke="#14140f" stroke-width="2"/>
<text x="64" y="528" class="qh">Кофейня «Угол»</text>
<text x="64" y="552" class="muted">ул. Руставели 12, Тбилиси</text>
<text x="64" y="600">Your code</text>
<text x="64" y="636" class="mono" style="font-size:22px">K7QD-4MXA-9PTE</text>
<text x="64" y="680" class="micro">Enter it in the cabinet within 30 days.</text>
<text x="64" y="700" class="micro">Did not order this? Enter it on the «not us» page — the venue is stopped.</text>
<text x="64" y="760" class="micro">xor.ad · printed 27.09</text>

<!-- questions -->
<text x="520" y="508" class="qh">Questions to the owner</text>
<text x="520" y="538" class="q">1. The node has no admin route for this page yet: the codes</text>
<text x="520" y="558" class="q">    sit in venue_envelopes, nothing reads them for the panel.</text>
<text x="520" y="578" class="q">    a) add GET /admin/envelopes + POST …/sent   b) print by hand from the database</text>
<text x="520" y="610" class="q">2. «Sent»: does the panel record it?  a) yes, sent_at on the envelope</text>
<text x="520" y="630" class="q">    b) no, printing is enough</text>
<text x="520" y="662" class="q">3. The code on screen after it is sent.  a) hidden (drawn)   b) kept until used</text>
<text x="520" y="694" class="q">4. Insert format.  a) A6 insert (drawn)   b) the address on the envelope itself</text>
<text x="520" y="726" class="q">5. Language of the insert.  a) the venue's storefront language   b) always English</text>
<text x="520" y="758" class="q">6. Who may print.  a) platform staff only   b) also a tenant's moderator, own brand</text>
</svg>
