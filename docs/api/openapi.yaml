openapi: 3.1.0
info:
  title: xor.ad relay node
  version: "2026-09-16.2"
  description: |-
    The contract of the relay node, spec first (route to drawing, stage S4a, decided by the owner on 2026-09-15).
    x-status built — the route exists in relay/node/src (main.ts, routes/*.ts); its shapes were read from the code on 2026-09-15 and not exercised live.
    x-status spec or proposed — described in docs/protocol_EN.md §4 and the chat canon, not built. Where the canon names no body, none is invented here.
    Checked by scripts/check-openapi.sh against the protocol tables, the code and the rendered pages.
    Since 2026-09-16 the eight areas of protocol §4.6–4.12 are in as proposed operations (tables, games in a chat, blocks and hiding, stepping away, support, the profile, reissuing the paper code); "My notices" reuse /report/decision and /legal/manifest. Decided the same day: the error shape ApiError, the x-protocol-version header, cursor pagination (protocol §6, §8).
  x-description-ru: |-
    Контракт узла relay, спецификация первая (маршрут до отрисовки, этап Э4а, решение владельца 15.09.2026).
    x-status built — маршрут есть в relay/node/src (main.ts, routes/*.ts); формы прочитаны из кода 15.09.2026 и живым запросом не проверены.
    x-status spec или proposed — описано в docs/protocol_RU.md §4 и каноне чата, не построено. Где канон тела не называет, здесь его не выдумывают.
    Сверяется scripts/check-openapi.sh с таблицами протокола, кодом и собранными страницами.
    С 16.09.2026 восемь областей протокола §4.6–4.12 внесены операциями proposed (столы, игры в чате, блокировки и скрытие, отлучка, поддержка, профиль, перевыпуск бумажного кода); «Мои уведомления» идут через /report/decision и /legal/manifest. Тем же днём решены форма ошибки ApiError, заголовок x-protocol-version и пагинация курсором (протокол §6, §8).
tags:
  - name: node
    description: Service routes of the node. HEAD answers for every GET, OPTIONS answers 204 on any path (main.ts).
    x-description-ru: Служебные маршруты узла. HEAD отвечает на каждый GET, OPTIONS — 204 на любой путь (main.ts).
  - name: intake
    description: Public intake from the storefronts, keyed by a publishable key or none.
    x-description-ru: Публичный приём с витрин, по публикуемому ключу или без него.
  - name: v1
    description: The public API for third parties, by secret key. Errors have the form {error:{code,message}}.
    x-description-ru: Публичный API для третьих сторон, по секретному ключу. Ошибки в форме {error:{code,message}}.
  - name: auth
    description: Sign-in to the panel by an emailed link.
    x-description-ru: Вход в панель по ссылке из письма.
  - name: admin
    description: The panel's routes, by panel session and permission.
    x-description-ru: Маршруты панели, по сессии панели и пермишену.
  - name: identity
    description: Identity and session, the profile, reissuing the paper code (protocol §4.1, §4.11, §4.12). Not built.
    x-description-ru: Личность и сессия, профиль, перевыпуск бумажного кода (протокол §4.1, §4.11, §4.12). Не построено.
  - name: feed
    description: The feed (protocol §4.2). Not built.
    x-description-ru: Лента (протокол §4.2). Не построено.
  - name: chat
    description: Like, match, chat, games in a chat (protocol §4.3, §4.7). Not built.
    x-description-ru: Лайк, мэтч, чат, игры в чате (протокол §4.3, §4.7). Не построено.
  - name: tables
    description: Tables — a game for a company (protocol §4.6). Proposed 2026-09-16, not built.
    x-description-ru: Столы — игра компанией (протокол §4.6). Предложено 16.09.2026, не построено.
  - name: safety
    description: Blocks, hiding, stepping away (protocol §4.8, §4.9). Proposed 2026-09-16, not built.
    x-description-ru: Блокировки, скрытие, отлучка (протокол §4.8, §4.9). Предложено 16.09.2026, не построено.
  - name: support
    description: Support requests (protocol §4.10). Proposed 2026-09-16, not built.
    x-description-ru: Обращения в поддержку (протокол §4.10). Предложено 16.09.2026, не построено.
components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Publishable storefront key ak_pub_…, public by design; answers "which face", nothing more.
      x-description-ru: Публикуемый ключ витрины ak_pub_…, публичен по замыслу; отвечает «какое лицо», и только.
    secretKey:
      type: http
      scheme: bearer
      description: Secret key "ak_live_….secret" in Authorization. Scopes are permissions of access/.
      x-description-ru: Секретный ключ «ak_live_….секрет» в Authorization. Скоупы — пермишены access/.
    panelSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Panel session JWT (HS256, 7 days) from /auth/callback; each route checks a permission.
      x-description-ru: Сессия панели, JWT (HS256, 7 суток) из /auth/callback; каждый маршрут проверяет пермишен.
    metricsToken:
      type: http
      scheme: bearer
      description: METRICS_TOKEN in Authorization or x-metrics-token; without it the route answers 404.
      x-description-ru: METRICS_TOKEN в Authorization или x-metrics-token; без него маршрут отвечает 404.
    identitySignature:
      type: apiKey
      in: header
      name: x-identity-sign
      description: 'Request signature (protocol §2): ECDSA P-256 over method, path, body sha256 and unix time; with x-identity-session and x-identity-time, a ±5 minute window.'
      x-description-ru: 'Подпись запроса (протокол §2): ECDSA P-256 над методом, путём, sha256 тела и unix-временем; вместе с x-identity-session и x-identity-time, окно ±5 минут.'
  schemas:
    Error:
      type: object
      description: The node's flat error.
      x-description-ru: Плоская ошибка узла.
      required: [error]
      properties:
        error: {type: string}
    V1Error:
      type: object
      description: The error form of /v1.
      x-description-ru: Форма ошибки /v1.
      required: [error]
      properties:
        error:
          type: object
          properties:
            code: {type: string, enum: [rate_limited, unauthorized, forbidden, unknown_brand, invalid_body]}
            message: {type: string}
    LegalReacceptance:
      type: object
      description: 409 for any signed request that publishes or opens a chat while an accepted revision is stale (protocol §6).
      x-description-ru: 409 на подписанный запрос, который публикует или открывает чат при разошедшейся редакции (протокол §6).
      properties:
        error: {type: string, const: legal_reacceptance_required}
        documents:
          type: array
          items:
            type: object
            properties:
              document: {type: string, enum: [terms, privacy, guidelines]}
              revision_date: {type: string, format: date}
              revision_sha256: {type: string}
    Ok:
      type: object
      properties:
        ok: {type: boolean}
    Health:
      type: object
      properties:
        status: {type: string, const: ok}
        node: {type: string}
        region: {type: string}
        env: {type: string}
        image: {type: string}
        storage: {type: boolean}
        storage_transport: {type: string}
        mail: {type: string}
        brands: {type: array, items: {type: string}}
        database: {type: string, enum: [ok, down, "off"]}
        ts: {type: string}
    Ready:
      type: object
      properties:
        status: {type: string, enum: [ready, not_ready]}
        node: {type: string}
        env: {type: string}
        database: {type: string}
        ts: {type: string}
    WaitlistLead:
      type: object
      required: [email]
      properties:
        email: {type: string, maxLength: 254, description: Checked by isEmail.}
        website: {type: string, description: Bot trap; a non-empty value answers 202 before any check.}
        source: {type: string, maxLength: 120}
        lang: {type: string, maxLength: 8}
        accent: {type: string, maxLength: 16}
        mode: {type: string, maxLength: 16}
        early_access: {type: boolean}
    ClientError:
      type: object
      properties:
        kind: {type: string, maxLength: 64}
        message: {type: string, maxLength: 1000}
        stack: {type: string, maxLength: 2000}
        page_url: {type: string, maxLength: 300}
        user_agent: {type: string, maxLength: 300}
        source: {type: string, maxLength: 120}
        extra: {type: object, description: Flat, at most 12 keys.}
    Pageview:
      type: object
      properties:
        path: {type: string, maxLength: 200}
        lang: {type: string, maxLength: 8}
        referrer: {type: string, description: Only the host of an http(s) referrer is kept.}
        viewport: {type: number, description: Reduced to mobile, tablet or desktop.}
        first_in_tab: {type: boolean}
        source: {type: string, maxLength: 120}
    Notice:
      type: object
      description: An Article 16 DSA notice.
      x-description-ru: Уведомление по ст. 16 DSA.
      required: [target_kind, reason_text, bona_fide]
      properties:
        receipt_hash: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the receipt code born on the device (dsa/SPEC §6); proposed 2026-09-16, LAW-2 of pass 3 — not accepted by report.ts yet., x-description-ru: SHA-256 кода квитанции, рождённого на устройстве (dsa/SPEC §6); предложено 16.09.2026, LAW-2 прохода 3 — report.ts его ещё не принимает.}
        target_kind: {type: string, enum: [feed_message, offer, table_line, chat, other]}
        reason_text: {type: string, maxLength: 4000}
        bona_fide: {type: boolean, const: true}
        notifier_name: {type: string, maxLength: 200}
        notifier_email: {type: string}
        target_id: {type: string, maxLength: 400}
        lang: {type: string, maxLength: 8}
        source: {type: string, maxLength: 120}
    KeySelf:
      type: object
      properties:
        id: {type: string}
        brand: {type: string}
        name: {type: string}
        scopes: {type: array, items: {type: string}}
    FeedItem:
      type: object
      description: A feed card — a phrase, or a table on the first page only (protocol §4.2; kind added 2026-09-16, DATA-23). A feed item is a circle, not a point; lat and lon rounded to the grid of area_radius (protocol §4.2).
      x-description-ru: Карточка ленты — фраза либо стол только на первой странице (протокол §4.2; kind добавлен 16.09.2026, DATA-23). Карточка — круг, а не точка; lat и lon округлены до узла сетки с шагом area_radius (протокол §4.2).
      properties:
        kind: {type: string, enum: [phrase, table]}
        game: {type: string, description: Table only., x-description-ru: Только у стола.}
        playing: {type: integer, description: Table only., x-description-ru: Только у стола.}
        watching: {type: integer, description: Table only., x-description-ru: Только у стола.}
        id: {type: string, format: uuid}
        text: {type: string, maxLength: 128}
        mode: {type: string}
        lat: {type: number}
        lon: {type: number}
        area_radius: {type: integer, enum: [100, 300, 1000, 3000, 10000]}
        like_count: {type: integer}
        created_at: {type: integer, description: 'Unix seconds; carries visible_at, the moment the phrase passed the queue, not the moment it was submitted (chat canon §8.3, 2026-09-15).', x-description-ru: 'Unix-секунды; несёт visible_at — момент прохождения очереди, а не отправки (канон чата §8.3, 15.09.2026).'}
    LikeResult:
      type: object
      properties:
        state: {type: string, enum: [liked, matched, spent]}
        match_id: {type: string, format: uuid}
    SessionsInvite:
      type: object
      properties:
        lookup_id: {type: string, description: First 32 bytes of Argon2id over the nine-character code.}
        ttl: {type: integer, const: 120}
    ReceiptQuery:
      type: object
      description: The device's receipt code, in the body and never in the address (dsa/SPEC §6).
      x-description-ru: Код квитанции с устройства, в теле и никогда в адресе (dsa/SPEC §6).
      properties:
        code: {type: string}
    SessionsClaim:
      type: object
      properties:
        lookup_id: {type: string}
        enc_secret: {type: string, description: 'An envelope: the new device''s signing and wrapping public keys and a label.'}
    ChatsAlive:
      type: object
      properties:
        ids: {type: array, items: {type: string, format: uuid}}
    ChatsAliveResult:
      type: object
      properties:
        alive: {type: array, items: {type: string, format: uuid}}
    ApiError:
      type: object
      description: The common error of identity-signed routes (protocol §6, decided 2026-09-16). reason only on moderation refusals, a text from refusal-wordings.
      x-description-ru: Общая ошибка подписанных личностью маршрутов (протокол §6, решено 16.09.2026). reason только у отказов модерации, текст из refusal-wordings.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [rate_limited, protocol_version_unsupported, invalid_body, unauthorized, unavailable, already_seated, not_your_turn, illegal_move, stale_seq, nothing_to_undo, pending_exists, stepped_away, name_frozen, paused, age_step_down, filter_out_of_band, refused, not_found]
            message: {type: string}
            reason: {type: string}
    Page:
      type: object
      description: A page of items and the cursor of the next one; an empty next is the end (protocol §6).
      x-description-ru: Страница строк и курсор следующей; пустой next — конец (протокол §6).
      required: [items, next]
      properties:
        items: {type: array, items: {type: object}}
        next: {type: string}
    FeedPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - properties: {items: {type: array, items: {$ref: "#/components/schemas/FeedItem"}}}
    TableCreate:
      type: object
      description: Set a table (chat spec §6.1, schema tables). Field names proposed 2026-09-16.
      x-description-ru: Поставить стол (спека чата §6.1, схема tables). Имена полей предложены 16.09.2026.
      required: [class, set, lat, lon, area_radius, seats, nonce]
      properties:
        nonce: {$ref: "#/components/schemas/Nonce"}
        class: {type: string, enum: [grid, free, dots, deck, dice, physics, word]}
        set: {type: string}
        lat: {type: number}
        lon: {type: number}
        area_radius: {type: integer, enum: [100, 300, 1000, 3000, 10000]}
        seats: {type: integer, minimum: 2, maximum: 6}
    TableView:
      type: object
      description: The table minus what is hidden — your own hand, the backs of others' (chat spec §6.1).
      x-description-ru: Стол без скрытого — своя рука, рубашки чужих (спека чата §6.1).
      properties:
        id: {type: string, format: uuid}
        class: {type: string}
        set: {type: string}
        seat: {type: integer, description: Your own seat number; a spectator sits too (seat_no)., x-description-ru: Номер своего места; зритель тоже сидит (seat_no).}
        is_playing: {type: boolean, description: false for a spectator (playing_from is empty)., x-description-ru: false у зрителя (playing_from пуст).}
        playing: {type: integer}
        watching: {type: integer}
        board: {$ref: "#/components/schemas/Board"}
        lines: {type: array, items: {$ref: "#/components/schemas/TableLine"}}
    Board:
      type: object
      description: Board state — seq, state by class (jsonb), whose turn, score by seat, expires_at (chat spec §6, table_games / chat_games).
      x-description-ru: Состояние доски — seq, state по классу (jsonb), чей ход, счёт по местам, expires_at (спека чата §6, table_games / chat_games).
      properties:
        seq: {type: integer}
        state: {type: object}
        turn: {type: integer}
        score: {type: object}
        expires_at: {type: string, format: date-time}
        pending: {type: object, description: 'The open proposal or the running confirmation: {kind, id, class, set, answers, until}; survives a restart (OPS-12).', x-description-ru: 'Открытое предложение или идущий отсчёт: {kind, id, class, set, answers, until}; переживает перезапуск (OPS-12).'}
    TableLine:
      type: object
      properties:
        id: {type: string, format: uuid}
        seat: {type: integer}
        kind: {type: string, enum: [line, application, refusal, sticker, move, congratulation]}
        text: {type: string}
        sticker: {type: string}
        created_at: {type: string, format: date-time}
    TableLineCreate:
      type: object
      description: A line, an application or a refusal go through the moderation queue (202); a sticker from our catalogue does not (200). Chat spec §6.1.
      x-description-ru: Реплика, заявка и отказ идут через очередь модерации (202); стикер из нашего каталога — нет (200). Спека чата §6.1.
      required: [kind]
      properties:
        kind: {type: string, enum: [line, application, refusal, sticker]}
        text: {type: string, description: Up to 128 graphemes (phrase.length)., x-description-ru: До 128 графем (phrase.length).}
        sticker: {type: string}
    Move:
      type: object
      description: A move in the board class's terms, or a pass. seq is the expected board version (monotonic); the same body at the same seq answers the same board, a foreign version gets 409 stale_seq (protocol §4.6, 2026-09-16).
      x-description-ru: Ход в терминах класса доски или пас. seq — ожидаемая версия доски (монотонна); то же тело при том же seq отвечает той же доской, чужая версия — 409 stale_seq (протокол §4.6, 16.09.2026).
      required: [seq]
      properties:
        seq: {type: integer}
        pass: {type: boolean}
        move: {type: object, description: 'By class — a cell, an edge, a piece, a letter, {roll}, {deal}, {flick, impulse}.', x-description-ru: 'По классу — клетка, ребро, фишка, буква, {roll}, {deal}, {flick, impulse}.'}
    Proposal:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [rematch, draw, undo]}
        class: {type: string}
        set: {type: string}
    ProposalAnswer:
      type: object
      required: [answer]
      properties:
        answer: {type: string, enum: [accept, decline, counter]}
        class: {type: string}
        set: {type: string}
    Seat:
      type: object
      required: [seat]
      properties:
        seat: {type: integer}
    GameOffer:
      type: object
      required: [class, set]
      properties:
        class: {type: string, enum: [grid, free, dots, deck, dice, physics, word]}
        set: {type: string}
    Word:
      type: object
      required: [word]
      properties:
        word: {type: string, description: The hangman word; goes through the same queue as a phrase., x-description-ru: Слово виселицы; идёт через ту же очередь, что и фраза.}
    BlockTarget:
      type: object
      description: Exactly one of feed, chat, or table+seat (chat spec §8.9). The answer is 204 whatever happens — not an oracle.
      x-description-ru: Ровно одно из feed, chat или table+seat (спека чата §8.9). Ответ 204 в любом случае — не оракул.
      required: [nonce]
      properties:
        feed: {type: string, format: uuid}
        chat: {type: string, format: uuid}
        table: {type: string, format: uuid}
        seat: {type: integer}
        nonce: {$ref: "#/components/schemas/Nonce"}
    HideTarget:
      type: object
      description: Exactly one of feed or line (chat spec §8.9, hidden_messages). feed comes from the "…" menu; line is the outcome of a complaint without the "illegal" checkbox (screen 19), not a menu item.
      x-description-ru: Ровно одно из feed или line (спека чата §8.9, hidden_messages). feed — из меню «…»; line — исход жалобы без галочки «незаконно» (экран 19), не пункт меню.
      properties:
        feed: {type: string, format: uuid}
        line: {type: string, format: uuid}
    Away:
      type: object
      required: [span, nonce]
      properties:
        nonce: {$ref: "#/components/schemas/Nonce"}
        span: {type: string, enum: [short, hour, long], description: away.span.short / hour / long., x-description-ru: away.span.short / hour / long.}
    SupportCreate:
      type: object
      required: [body, nonce]
      properties:
        nonce: {$ref: "#/components/schemas/Nonce"}
        body: {type: string}
        email: {type: string, format: email}
    SupportRequest:
      type: object
      properties:
        public_no: {type: string}
        created_at: {type: string, format: date-time}
        answer: {type: string}
        answered_at: {type: string, format: date-time}
        answer_seen: {type: boolean}
    Profile:
      type: object
      properties:
        name: {type: string}
        name_pending: {type: string, description: A name awaiting the queue's verdict., x-description-ru: Имя, ждущее вердикта очереди.}
        age: {type: integer}
        filter_age_min: {type: integer}
        filter_age_max: {type: integer}
        languages: {type: array, maxItems: 3, items: {type: string}}
        stepped_away_until: {type: string, format: date-time}
        phrases:
          type: array
          description: Your own live phrases with their timers (screens 9 and 10).
          x-description-ru: Свои живые фразы с таймерами (экраны 9 и 10).
          items: {type: object, properties: {id: {type: string, format: uuid}, expires_at: {type: string, format: date-time}}}
        table:
          type: object
          description: Your own seat, if any.
          x-description-ru: Своё место за столом, если есть.
          properties: {id: {type: string, format: uuid}, seat: {type: integer}}
    ProfilePatch:
      type: object
      description: Any subset (chat spec §8.2, §8.3). A name goes to the queue; age across 20/21 only upwards; filter bounds multiples of 5 or the band's edge, width at least 5.
      x-description-ru: Любое подмножество (спека чата §8.2, §8.3). Имя уходит в очередь; возраст через 20/21 только вверх; границы фильтра кратны 5 или край полосы, охват не меньше 5.
      properties:
        name: {type: string}
        age: {type: integer, minimum: 13}
        filter_age_min: {type: integer}
        filter_age_max: {type: integer}
        languages: {type: array, maxItems: 3, items: {type: string}}
    Nonce:
      type: string
      pattern: '^[A-Za-z0-9_-]{22}$'
      description: 16 random bytes, base64url without padding (nonce.bytes); protocol §2.
      x-description-ru: 16 случайных байт, base64url без набивки (nonce.bytes); протокол §2.
    Auth:
      type: string
      description: The proof of the PIN — auth of chat spec §8.2 (material[0..32], base64url); the node compares its hash with vault_shares.auth_hash. Never the stored hash itself (2026-09-17, SEC-1).
      x-description-ru: Доказательство ПИНа — auth из спеки чата §8.2 (material[0..32], base64url); узел сравнивает его хэш с vault_shares.auth_hash. Никогда не сам хранимый хэш (17.09.2026, SEC-1).
    VaultShare:
      type: object
      required: [auth]
      properties:
        auth: {$ref: "#/components/schemas/Auth"}
    PinChange:
      type: object
      description: Change the PIN — proof of the old one, the new auth_hash and the reissued share, with the nonce of protocol §2 (chat spec §8.2; 2026-09-17, SEC-26).
      x-description-ru: Смена ПИНа — доказательство старого, новый auth_hash и перевыпущенная доля, с nonce из протокола §2 (спека чата §8.2; 17.09.2026, SEC-26).
      required: [nonce, current_auth, next_auth_hash, next_share]
      properties:
        nonce: {$ref: "#/components/schemas/Nonce"}
        current_auth: {$ref: "#/components/schemas/Auth"}
        next_auth_hash: {type: string, description: The hash the node will store for the new PIN., x-description-ru: Хэш, который узел сохранит для нового ПИНа.}
        next_share: {type: string}
    IdentityClose:
      type: object
      description: Start over — with a PIN proof and the nonce of protocol §2 (chat spec §8.2; 2026-09-17, SEC-26).
      x-description-ru: Начать заново — с доказательством ПИНа и nonce из протокола §2 (спека чата §8.2; 17.09.2026, SEC-26).
      required: [nonce, auth]
      properties:
        nonce: {$ref: "#/components/schemas/Nonce"}
        auth: {$ref: "#/components/schemas/Auth"}
    Message:
      type: object
      description: A ciphertext to deliver (chat spec §8.8; proposed 2026-09-16, SEC-8).
      x-description-ru: Шифротекст к доставке (спека чата §8.8; предложено 16.09.2026, SEC-8).
      required: [local_id, ciphertext]
      properties:
        local_id: {type: string}
        ciphertext: {type: string, description: base64url, at most max_ciphertext_bytes., x-description-ru: base64url, не больше max_ciphertext_bytes.}
    MessageAck:
      type: object
      required: [local_id]
      properties:
        local_id: {type: string}
        accepted: {type: boolean}
        error: {type: string}
    Received:
      type: object
      required: [ids]
      properties:
        ids: {type: array, items: {type: string, format: uuid}}
    Statement:
      type: object
      description: An Article 17 statement of reasons to its addressee, without the notifier's identity (dsa/SPEC §6).
      x-description-ru: Мотивировка по ст. 17 её адресату, без личности заявителя (dsa/SPEC §6).
      properties:
        id: {type: string, format: uuid}
        restriction: {type: string, enum: [removed, hidden, offer_taken_down, access_restricted]}
        until: {type: string, format: date-time, description: End of the restriction; absent — indefinite (Art. 17(3)(a)). Not yet a column of the built dsa_statements table (item dsa.statements.until.unbuilt)., x-description-ru: Конец ограничения; отсутствует — бессрочно (ст. 17(3)(a)). В построенной таблице dsa_statements колонки ещё нет (пункт dsa.statements.until.unbuilt).}
        facts: {type: string}
        ground_kind: {type: string, enum: [legal, contractual]}
        ground_text: {type: string}
        automated_used: {type: boolean}
        created_at: {type: string, format: date-time}
        appeal: {type: string}
    RecoveryReissue:
      type: object
      description: Proof of the current paper code and the derivatives of the new one born on the device (chat spec §8.2 "paper code"); one transaction.
      x-description-ru: Доказательство текущего бумажного кода и производные нового, рождённого на устройстве (спека чата §8.2 «бумажный код»); одна транзакция.
      required: [current, next, nonce]
      properties:
        nonce: {$ref: "#/components/schemas/Nonce"}
        current: {type: object, required: [lookup_id], properties: {lookup_id: {type: string}}}
        next: {type: object, required: [lookup_id, wrapped_key], properties: {lookup_id: {type: string}, wrapped_key: {type: string}}}
  parameters:
    ProtocolVersion:
      name: x-protocol-version
      in: header
      required: true
      schema: {type: integer, minimum: 1}
      description: The integer major version of the protocol (protocol §3, §6; decided 2026-09-16). Not signed; forging it only refuses this request. Unsupported → 400 protocol_version_unsupported.
      x-description-ru: Целое число мажорной версии протокола (протокол §3, §6; решено 16.09.2026). Не подписан; подделка даёт лишь отказ этого запроса. Неподдерживаемая → 400 protocol_version_unsupported.
    After:
      name: after
      in: query
      required: false
      schema: {type: string}
      description: Opaque cursor from the previous answer's `next` (protocol §6). Encodes (visible_at, id); reveals nothing beyond what was already given out.
      x-description-ru: Непрозрачный курсор из `next` предыдущего ответа (протокол §6). Кодирует (visible_at, id); не раскрывает ничего сверх уже выданного.
  headers:
    ProtocolSunset:
      schema: {type: integer}
      description: Unix time when the current major protocol version stops being served; present on every answer once the date is set (protocol §3, decided 2026-09-16).
      x-description-ru: Unix-время, когда текущая мажорная версия протокола перестанет обслуживаться; на каждом ответе с момента назначения даты (протокол §3, решено 16.09.2026).
  responses:
    ApiError:
      description: A refusal in the common shape {error:{code,message,reason?}} (protocol §6). Every answer of the node may carry x-protocol-sunset (components.headers.ProtocolSunset, protocol §3).
      x-description-ru: Отказ в общей форме {error:{code,message,reason?}} (протокол §6). На любом ответе узла может быть x-protocol-sunset (components.headers.ProtocolSunset, протокол §3).
      headers: {x-protocol-sunset: {$ref: "#/components/headers/ProtocolSunset"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ApiError"}}}
    RateLimited:
      description: Rate limit hit — code rate_limited, Retry-After in seconds (protocol §6).
      x-description-ru: Предел частоты — code rate_limited, Retry-After в секундах (протокол §6).
      headers: {Retry-After: {schema: {type: integer}, description: Seconds to wait., x-description-ru: Сколько секунд ждать.}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ApiError"}}}
    BadVersion:
      description: Unsupported protocol version — code protocol_version_unsupported, the update command in message (protocol §3, §6).
      x-description-ru: Неподдерживаемая версия протокола — code protocol_version_unsupported, команда обновления в message (протокол §3, §6).
      content: {application/json: {schema: {$ref: "#/components/schemas/ApiError"}}}
    NonceReused:
      description: The same nonce on another route, or a malformed nonce — code invalid_body (protocol §2). On POST /blocks this 409 answers the nonce only, never the target of the block.
      x-description-ru: Тот же nonce на другом маршруте или nonce не той формы — code invalid_body (протокол §2). У POST /blocks этот 409 отвечает только на nonce, никогда — на цель блокировки.
      content: {application/json: {schema: {$ref: "#/components/schemas/ApiError"}}}
    Reaccept:
      description: Re-acceptance required (protocol §6).
      x-description-ru: Нужно принять документы заново (протокол §6).
      content: {application/json: {schema: {$ref: "#/components/schemas/LegalReacceptance"}}}

paths:
  /health:
    get:
      tags: [node]
