# Local half of the wizard's configuration — copy to inventory.toml and fill in.
# Gitignored on purpose: the boxes' addresses and the IP allowlists must not be
# in a public repository (see commit 8002c46).
#
# The other half — which image each environment runs, and everything else about
# its composition — is environments.toml, and that one is tracked, so the answer
# to "what is on dev" survives the machine that rolled it.
#
# Pool inventory. Copy to inventory.toml (gitignored) and fill in.
#
# Model: BOXES host one or more env STACKS (multi-stand). dev+staging share the same
# boxes; prod uses its own boxes (same schema, access="public"). Each (box, env)
# gets a hostname "<box>-<env>.<dns_zone>" and its own node container; one shared
# Caddy per box terminates TLS (DNS-01 via Bunny) and routes by hostname.
#
# Secrets in secrets.env (SECRETS_ENV) — the whole list, because a partial one is
# how GITHUB_TOKEN went missing and made prod refuse with the wrong reason:
#   HETZNER_TOKEN, BUNNY_API_KEY, BUNNY_STORAGE_ZONE, BUNNY_STORAGE_KEY,
#   BUNNY_STORAGE_HOST?, RESEND_API_KEY, RESEND_KEYS?, WELCOME_FROM?,
#   PANEL_SENDER?, SSH_PUBLIC_KEY, SESSION_SECRET, POSTGRES_PASSWORD,
#   ORIGIN_TOKEN, GHCR_USER, GHCR_TOKEN,
#   GITHUB_TOKEN  — needed only to deploy a public env: the release check reads
#                   it, and without it a private repo answers 404 and the tag
#                   looks unpublished when it is not.

[pool]
dns_zone = "relay.panov.id"          # Bunny DNS zone that holds the node records
node_repo = "ghcr.io/panov-id/relay-node"    # boxes pull; tag pinned per env below
caddy_repo = "ghcr.io/panov-id/relay-caddy"
caddy_tag = "dev"                           # caddy rarely changes; a branch/version tag
release_repo = "panov-id/xor.ad"            # prod only deploys a PUBLISHED release of this repo
# Admin IPs allowed to SSH (port 22) to EVERY box (on top of per-env 443 rules).
# The wizard also auto-allows the IP it connects from, so you can't lock yourself out.
ssh_whitelist = ["203.0.113.5"]     # <-- your admin IP(s)

# --- environments -----------------------------------------------------------
[env.dev]
# Composition (image_tag, access, tls, mail, allowed_origins, panel_url) lives
# in environments.toml, which IS tracked. Only what must stay out of a public
# repository belongs here.
whitelist_ips = ["203.0.113.5"]     # who may reach dev on 443 (testers/you)

[env.staging]
# Composition (image_tag, access, tls, mail, allowed_origins, panel_url) lives
# in environments.toml, which IS tracked. Only what must stay out of a public
# repository belongs here.
whitelist_ips = ["203.0.113.5"]

# prod lives on its OWN boxes (add [[box]] with envs=["prod"]); public-facing.
[env.prod]
# Composition (image_tag, access, tls, mail, allowed_origins, panel_url) lives
# in environments.toml, which IS tracked. Only what must stay out of a public
# repository belongs here.
whitelist_ips = []

# --- boxes (physical servers) ----------------------------------------------
# dev+staging share these three; provision-mode via provider API, configure-mode for
# manually-created free VMs (Oracle/GCP): paste their public IP into ssh_host.

[[box]]
id = "n1"
provider = "hetzner"
region = "eu-falkenstein"
location = "fsn1"
mode = "provision"
server_type = "cax11"
envs = ["dev", "staging"]
lat = 50.48
lon = 12.34

[[box]]
id = "n2"
provider = "oracle"
region = "eu-frankfurt"
mode = "configure"
ssh_host = ""
ssh_user = "ubuntu"
envs = ["dev", "staging"]
lat = 50.11
lon = 8.68

[[box]]
id = "n3"
provider = "gcp"
region = "us-central1"
mode = "configure"
ssh_host = ""
ssh_user = "ubuntu"
envs = ["dev", "staging"]
lat = 41.26
lon = -95.86
