<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720">
<title>Пустые состояния, шапка и таббар — варианты A/B · 375 px</title>
<style>
    @font-face { font-family: "Golos Text"; font-weight: 400 600;
      src: url(/fonts/q5uCsoe9Lv5t7Meb31EcExN8hA.woff2) format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 400;
      src: url(/fonts/tDbv2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKwBNntkaToggR7BYRbKPxDcwg.woff2) format("woff2"); }
    text { font-family: "Golos Text", Inter, system-ui, sans-serif; }
    .body { font-size: 16px; fill: #f0e7dc; }
    .muted { font-size: 16px; fill: #9a8d7c; }
    .meta { font-size: 14px; fill: #9a8d7c; }
    .metab { font-size: 14px; font-weight: 600; fill: #f0e7dc; }
    .disp { font-size: 26px; font-weight: 600; fill: #f0e7dc; }
    .title { font-size: 20px; font-weight: 600; fill: #f0e7dc; }
    .cap { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; fill: #6b5f4c; }
    .h { font-size: 20px; font-weight: 600; fill: #1c140d; }
    .q { font-size: 16px; fill: #1c140d; }
    .ico { fill: none; stroke: #9a8d7c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect width="1300" height="720" fill="#ece4d8"/>
<text x="40" y="44" class="h">Пустые состояния · шапка · таббар — варианты A и B</text>

<!-- 1. empty state -->
<text x="40" y="90" class="cap">1 · пустое состояние ленты</text>
<rect x="40" y="104" width="375" height="240" fill="#0d0b0a"/>
<g transform="translate(203.5,124) scale(0.857)"><path class="ico" d="M6 26 H50 M10 26 V46 M46 26 V46 M6 36 H50 M14 14 H42 V26"/></g>
<text x="227.5" y="216" class="disp" text-anchor="middle">Здесь пока тихо</text>
<text x="227.5" y="246" class="muted" text-anchor="middle">В вашем круге сейчас никто не говорит.</text>
<rect x="128" y="272" width="200" height="44" rx="13" fill="#bd4b2a"/>
<text x="228" y="300" class="body" text-anchor="middle" style="fill:#fff6f0">Расширить круг</text>
<text x="40" y="364" class="cap">A · иконка заставки 48 px --muted (скамейка) над заголовком display 26, отступ 16</text>
<rect x="40" y="380" width="375" height="240" fill="#0d0b0a"/>
<text x="227.5" y="476" class="disp" text-anchor="middle">Здесь пока тихо</text>
<text x="227.5" y="506" class="muted" text-anchor="middle">В вашем круге сейчас никто не говорит.</text>
<rect x="128" y="532" width="200" height="44" rx="13" fill="#bd4b2a"/>
<text x="228" y="560" class="body" text-anchor="middle" style="fill:#fff6f0">Расширить круг</text>
<text x="40" y="640" class="cap">B · без иконки: заголовок display 26, подстрока, кнопка</text>

<!-- 2. tab bar -->
<text x="470" y="90" class="cap">2 · таббар: активный пункт</text>
<rect x="470" y="104" width="375" height="64" fill="#0d0b0a"/>
<line x1="470" y1="104" x2="845" y2="104" stroke="#3a2e20" stroke-width="1"/>
<g transform="translate(470,104)">
  <rect x="37.875" y="14" width="18" height="2.5" fill="#f0e7dc"/><rect x="37.875" y="20" width="18" height="2.5" fill="#f0e7dc"/><rect x="37.875" y="26" width="18" height="2.5" fill="#f0e7dc"/>
  <text x="46.875" y="48" class="metab" text-anchor="middle">Лента</text>
  <rect x="30.875" y="56" width="32" height="2" fill="#bd4b2a"/>
  <rect x="131.6" y="14" width="18" height="14" rx="2" class="ico"/><text x="140.6" y="48" class="meta" text-anchor="middle">Беседы</text>
  <path class="ico" d="M234.4 14 V30 M226.4 22 H242.4"/><text x="234.4" y="48" class="meta" text-anchor="middle">Сказать</text>
  <circle cx="328.1" cy="18" r="5" class="ico"/><path class="ico" d="M319 30 C319 24 337 24 337 30"/><text x="328.1" y="48" class="meta" text-anchor="middle">Я</text>
</g>
<text x="470" y="190" class="cap">A · как сейчас: подчёркивание 32×2 --accent под активным, иконки контуром, подпись 14/600</text>
<rect x="470" y="210" width="375" height="64" fill="#0d0b0a"/>
<line x1="470" y1="210" x2="845" y2="210" stroke="#3a2e20" stroke-width="1"/>
<g transform="translate(470,210)">
  <rect x="37.875" y="14" width="18" height="2.5" fill="#f0e7dc"/><rect x="37.875" y="20" width="18" height="2.5" fill="#f0e7dc"/><rect x="37.875" y="26" width="18" height="2.5" fill="#f0e7dc"/>
  <text x="46.875" y="48" class="metab" text-anchor="middle">Лента</text>
  <rect x="131.6" y="14" width="18" height="14" rx="2" class="ico"/><text x="140.6" y="48" class="meta" text-anchor="middle">Беседы</text>
  <path class="ico" d="M234.4 14 V30 M226.4 22 H242.4"/><text x="234.4" y="48" class="meta" text-anchor="middle">Сказать</text>
  <circle cx="328.1" cy="18" r="5" class="ico"/><path class="ico" d="M319 30 C319 24 337 24 337 30"/><text x="328.1" y="48" class="meta" text-anchor="middle">Я</text>
</g>
<text x="470" y="296" class="cap">B · без подчёркивания: активный — иконка и подпись --fg 600, неактивные — --muted 400</text>
<rect x="470" y="316" width="375" height="64" fill="#0d0b0a"/>
<line x1="470" y1="316" x2="845" y2="316" stroke="#3a2e20" stroke-width="1"/>
<g transform="translate(470,316)">
  <rect x="30.875" y="8" width="32" height="32" rx="8" fill="#302720"/>
  <rect x="37.875" y="14" width="18" height="2.5" fill="#f0e7dc"/><rect x="37.875" y="20" width="18" height="2.5" fill="#f0e7dc"/><rect x="37.875" y="26" width="18" height="2.5" fill="#f0e7dc"/>
  <text x="46.875" y="48" class="metab" text-anchor="middle">Лента</text>
  <rect x="131.6" y="14" width="18" height="14" rx="2" class="ico"/><text x="140.6" y="48" class="meta" text-anchor="middle">Беседы</text>
  <path class="ico" d="M234.4 14 V30 M226.4 22 H242.4"/><text x="234.4" y="48" class="meta" text-anchor="middle">Сказать</text>
  <circle cx="328.1" cy="18" r="5" class="ico"/><path class="ico" d="M319 30 C319 24 337 24 337 30"/><text x="328.1" y="48" class="meta" text-anchor="middle">Я</text>
</g>
<text x="470" y="402" class="cap">C · плашка --panel-2 32×32 rx 8 под активной иконкой, без подчёркивания</text>

<!-- 3. header -->
<text x="900" y="90" class="cap">3 · шапка экрана: граница с контентом</text>
<rect x="900" y="104" width="375" height="150" fill="#0d0b0a"/>
<text x="916" y="140" class="title">Фильтры</text>
<line x1="900" y1="160" x2="1275" y2="160" stroke="#3a2e20" stroke-width="1"/>
<text x="916" y="196" class="body">возраст</text>
<text x="1259" y="196" class="meta" text-anchor="end">своя полоса</text>
<text x="900" y="276" class="cap">A · как сейчас: линия 1 px --border по низу шапки 56, контент от 176</text>
<rect x="900" y="296" width="375" height="150" fill="#0d0b0a"/>
<text x="916" y="332" class="title">Фильтры</text>
<text x="916" y="396" class="body">возраст</text>
<text x="1259" y="396" class="meta" text-anchor="end">своя полоса</text>
<text x="900" y="468" class="cap">B · без линии: шапка 56 на --bg, первый элемент через воздух 24 (--s-6)</text>

<!-- questions -->
<text x="40" y="560" class="h" transform="translate(0,110)">Вопросы</text>
<text x="470" y="520" class="q">1. Пустое состояние: A — иконка заставки над заголовком, или B — только текст?</text>
<text x="470" y="548" class="q">2. Таббар: A — подчёркивание (как есть), B — только вес и цвет, или C — плашка под иконкой?</text>
<text x="470" y="576" class="q">3. Шапка: A — линия 1 px по низу (как есть), или B — без линии, воздух 24?</text>
<text x="470" y="616" class="cap">Иконки заставки: 8 сюжетов, штрих 2, сетка 56; в пустых состояниях — 48 px --muted. Точка «новое» на «Я» в обоих вариантах остаётся.</text>
</svg>
