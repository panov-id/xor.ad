# The web face against a throwaway node, end to end, in containers only:
# Postgres, the migrations, one storefront key, the node from the current
# sources, the built page, and Playwright driving a browser at it.
#
#   scripts/run-web-tests.sh                 # up, test, down; exit code = the tests'
#   docker compose -f docker-compose.web.yml up web   # the page alone, at :4173
#
# The brand is VITE_BRAND (sosed by default): the page's build, the stand's
# storefront key and offers, the cabinet's Origin.
#
# Nothing here is the local stand of relay/local: a suite that registers
# identities must never land on a database somebody is looking at.
name: web-e2e
services:
  postgres:
    image: postgres:16.13-alpine
    environment: { POSTGRES_USER: relay, POSTGRES_PASSWORD: test, POSTGRES_DB: relay_test }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U relay -d relay_test"], interval: 2s, timeout: 3s, retries: 30 }
    mem_limit: 512m

  migrate:
    build: { context: ./relay/node }
    depends_on: { postgres: { condition: service_healthy } }
    environment: { DATABASE_URL: "postgres://relay:test@postgres:5432/relay_test" }
    command: ["run", "--allow-env", "--allow-net", "--allow-read", "tools/migrate_db.ts"]
    restart: "no"

  # The storefront's key, as the terminal's test stand seeds it
  # (scripts/run-depth-tests.sh): registration asks for one.
  seed:
    image: postgres:16.13-alpine
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment: { PGPASSWORD: test }
    command:
      - psql
      - -h
      - postgres
      - -U
      - relay
      - -d
      - relay_test
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "INSERT INTO api_keys (id, brand, origins) VALUES ('ak_pub_webtest0000000001', '${VITE_BRAND:-sosed}', '{}') ON CONFLICT DO NOTHING"
      # One neighbourhood venue with two offers (db/050), for the exit screen of
      # an offer's link (W5b): a live link that sends to ourcafe.cy, and one
      # switched off. Codes of at least ten characters (routes/offer_links.ts CODE).
      - -c
      - "INSERT INTO advertisers (id, email, email_confirmed_at, contact) VALUES ('00000000-0000-4000-8000-00000000ad01', 'venue@webtest.invalid', now(), 'Вера') ON CONFLICT DO NOTHING"
      - -c
      - "INSERT INTO venues (id, advertiser_id, name, address, verification_status, verified_at) VALUES ('00000000-0000-4000-8000-0000000000e1', '00000000-0000-4000-8000-00000000ad01', 'Наше кафе', 'Колонаки, 1', 'verified', now()) ON CONFLICT DO NOTHING"
      - -c
      - "INSERT INTO offers (id, brand, venue_id, offer_text, discount_value, conditions, external_url, redirect_code, discount_until, status, expires_at) VALUES ('00000000-0000-4000-8000-0000000000f1', '${VITE_BRAND:-sosed}', '00000000-0000-4000-8000-0000000000e1', 'кофе соседям', '-10 %', 'до полудня', 'https://ourcafe.cy/menu', 'webtestlive0001', now() + interval '1 day', 'active', now() + interval '4 hours 20 minutes') ON CONFLICT DO NOTHING"
      - -c
      - "INSERT INTO offers (id, brand, venue_id, offer_text, discount_value, external_url, redirect_code, redirect_disabled_at, discount_until, status, expires_at) VALUES ('00000000-0000-4000-8000-0000000000f2', '${VITE_BRAND:-sosed}', '00000000-0000-4000-8000-0000000000e1', 'вчерашний хлеб', '-50 %', 'https://ourcafe.cy/bread', 'webtestspent001', now(), now() + interval '1 day', 'active', now() + interval '4 hours 20 minutes') ON CONFLICT DO NOTHING"
    restart: "no"

  # The stand's mailbox (A1): SMTP in on 1025, the letters out over HTTP on
  # 8025 for the spec. A pinned tag, as every image of the stand.
  mailpit:
    image: axllent/mailpit:v1.21.8
    mem_limit: 128m

  # The first-tier model of §8.14 stands in here as a stub with Ollama's shape
  # (POST /api/chat → { message: { content } }): it says "reject" to every
  # phrase it is asked about. The node asks only about phrases the rules sent to
  # the queue (lib/moderator.ts), so what the stub says is the hint the panel
  # shows — a real model's judgement is relay/moderator's measurement, not this.
  moderator:
    image: denoland/deno:alpine-2.1.4
    command:
      - eval
      - >-
        Deno.serve({ port: 11434, hostname: "0.0.0.0" }, () => Response.json({ message: { content: JSON.stringify({ verdict: "reject", reason: "stub: a link" }) } }))
    mem_limit: 128m

  # One moderator of the panel, written where the node reads its operators
  # (lib/auth.ts: panel/<env>/users/<sha256(email)>.json in the fs storage).
  # The panel is invite-only, and inviting needs an operator already, so the
  # stand's first one is laid down here as the wizard lays it on a box. The
  # directory is opened to the node's non-root user, which writes there too.
  panel-user:
    image: alpine:3.20
    volumes: ["node-data:/data"]
    command:
      - sh
      - -c
      - >-
        d=/data/panel/test/users && mkdir -p $$d &&
        h=$$(printf %s moderator@webtest.invalid | sha256sum | cut -d' ' -f1) &&
        printf '{"email":"moderator@webtest.invalid","role":"moderator","brand":null,"created_at":"2026-09-28T00:00:00Z"}' > $$d/$$h.json &&
        chmod -R a+rwX /data
    restart: "no"

  node:
    build: { context: ./relay/node }
    depends_on:
      seed: { condition: service_completed_successfully }
      panel-user: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
      moderator: { condition: service_started }
    volumes: ["node-data:/data"]
    environment:
      DATABASE_URL: "postgres://relay:test@postgres:5432/relay_test"
      VAULT_SHARE_KEY: web-test-vault-key
      STORAGE_TRANSPORT: fs
      # Under /data: the node reads and writes only there (--allow-read=/data in
      # its image), so a record elsewhere is one it never sees — the panel's
      # operator laid in /tmp/data answered 401.
      STORAGE_DIR: /data
      # The cabinet's sign-in letter (A1) goes to Mailpit; the spec reads the link there.
      MAIL_TRANSPORT: smtp
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: "1025"
      NODE_ENV_NAME: test
      NODE_ID: web-test
      ALLOWED_ORIGINS: ""
      FEED_VERDICT: rules
      # The model behind its flag (§8.14): set, the node asks it about every
      # phrase the rules queue; the stub above answers.
      MODERATOR_URL: "http://moderator:11434"
      # The panel's sessions: the moderator spec mints its token from this.
      SESSION_SECRET: web-test-panel-secret
      PANEL_URL: "http://panel:5173"
      # The stand trusts X-Client-IP under this token, as production trusts Bunny (client_ip.ts):
      # every spec comes from an address of its own (web/e2e/fixtures/address.ts; W5c).
      ORIGIN_TOKEN: web-test-origin-token
      # The legal gate (W13-LN), off unless the run asks: LEGAL_REQUIRED=1 scripts/run-web-tests.sh (W13-LC).
      LEGAL_REQUIRED: "${LEGAL_REQUIRED:-0}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60
    mem_limit: 512m
    # As on the boxes (relay/wizard/wizard.py: restart: unless-stopped): a node
    # that meets an error nobody handled ends itself (lib/log.ts) and is
    # restarted. Without it one crash — postgres.js writing null to a killed
    # connection's socket (W15-NC) — took the node away for the rest of the
    # run and turned the suite's tail red (W15-NCs).
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args: { VITE_API_KEY: ak_pub_webtest0000000001, VITE_BRAND: "${VITE_BRAND:-sosed}", VITE_STAND: "1" }
    depends_on: { node: { condition: service_healthy } }
    environment: { WEB_NODE_URL: "http://node:8080" }
    # No host port by default: two or three worktrees run this stand at once
    # (verifier of W1; W1c, W2, W3, 2026-09-26). To look at the page,
    # WEB_PORT=4173 scripts/run-web-tests.sh --keep.
    ports: ["${WEB_PORT:-0}:4173"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/ >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60
    mem_limit: 512m

  # The cabinet (A1) on its own https service: its sign-in cookies are
  # __Host- and Secure, which Chromium keeps only from https — measured: after
  # POST /adv/signup over http://localhost the context held no cookie. The
  # rest of the stand stays on http (a page on https may not open the direct
  # ws:// the close-code spec opens). WEB_ADV_ORIGIN: the cabinet's Origin,
  # said for the page under /adv (vite.config.ts).
  web-adv:
    build:
      context: .
      dockerfile: web/Dockerfile
      args: { VITE_API_KEY: ak_pub_webtest0000000001, VITE_BRAND: "${VITE_BRAND:-sosed}", VITE_STAND: "1" }
    depends_on: { node: { condition: service_healthy } }
    environment: { WEB_NODE_URL: "http://node:8080", WEB_TLS: "1", WEB_ADV_ORIGIN: "https://adv.${VITE_BRAND:-sosed}.place" }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:4173/ >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60
    mem_limit: 512m

  # The moderator's panel, built from the current sources and served as the
  # static bundle it ships as. The browser reaches it at http://panel:5173 and
  # the node at http://node:8080 (ALLOWED_ORIGINS is empty on the stand).
  # Not started by the page's specs; a run that needs it names it.
  panel:
    image: node:20.18-alpine
    working_dir: /app
    volumes: ["./panel:/src:ro"]
    environment: { VITE_RELAY_API_URL: "http://node:8080" }
    command:
      - sh
      - -c
      - >-
        tar -C /src --exclude=node_modules --exclude=dist -cf - . | tar -xf - &&
        npm ci --no-audit --no-fund --loglevel=error &&
        npx vite build --logLevel error &&
        exec npx --yes serve@14.2.4 -s dist -l 5173
    depends_on: { node: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 200
    mem_limit: 1g

  # In the page's own network namespace, so the browser opens
  # http://localhost:4173 — a secure context, which WebCrypto (the PIN, the
  # keys, the signature) needs; a container name over plain http is not one.
  e2e:
    build: { context: ./web/e2e }
    # The panel too: run-web-tests.sh brings up what e2e depends on, and the
    # moderation path walks into the panel (PANEL_URL below).
    depends_on: { web: { condition: service_healthy }, web-adv: { condition: service_healthy }, panel: { condition: service_healthy } }
    network_mode: "service:web"
    environment:
      WEB_URL: "http://localhost:4173"
      # The storefront the page was built for: the specs' seeds and links follow it.
      BRAND: "${VITE_BRAND:-sosed}"
      # The cabinet's spec (A1): the letter from Mailpit, the envelope's code from the database.
      ADV_URL: "https://web-adv:4173"
      MAILPIT_URL: "http://mailpit:8025"
      DATABASE_URL: "postgres://relay:test@postgres:5432/relay_test"
      LEGAL_REQUIRED: "${LEGAL_REQUIRED:-0}"
      # The moderation path (moderation-path.spec.ts): the panel, and the
      # node's session secret and environment to sign its moderator in with.
      PANEL_URL: "http://panel:5173"
      PANEL_SESSION_SECRET: web-test-panel-secret
      PANEL_ENV_NAME: test
      # Playwright's output folder is this run's own (playwright.config.ts).
      E2E_RUN: "${COMPOSE_PROJECT_NAME:-local}"
    volumes:
      - ./web/e2e/results:/app/results
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    mem_limit: 3g

volumes:
  # The node's fs storage, so the panel-user service can lay the first operator in it.
  node-data: {}
