# promtool unit tests for alerts.yml — run by scripts/test_alerts.sh.
#
# Written for FeedPublishesNothing (second review panel, 2026-09-21, task 5):
# the rule read `sum(rate(published)) == 0`, and with no published series at
# all that side is an empty vector, not a zero — so the alert stayed silent
# until the first phrase was ever published after a restart, and only then
# could it fire. Behaviour that depends on the history of the process is the
# thing an alert must not have.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: expiring unread with no published series at all fires
    interval: 1m
    input_series:
      - series: 'relay_feed_verdict_total{verdict="expired_unread"}'
        values: '0+1x180'
    alert_rule_test:
      # The edge (B42): quiet one evaluation before for: is met, firing at it.
      - eval_time: 60m
        alertname: FeedPublishesNothing
        exp_alerts: []
      - eval_time: 61m
        alertname: FeedPublishesNothing
        exp_alerts:
          - exp_labels: { severity: info }
            exp_annotations:
              summary: "Лента принимает фразы и не публикует ни одной"
              description: "За час ни одного published и хотя бы один expired_unread: очередь есть, вердиктов нет. Пока модератора нет (§8.14), это ожидаемо — тревога существует, чтобы ожидаемое не спуталось с поломкой в тот день, когда модератор появится."
      - eval_time: 150m
        alertname: FeedPublishesNothing
        exp_alerts:
          - exp_labels: { severity: info }
            exp_annotations:
              summary: "Лента принимает фразы и не публикует ни одной"
              description: "За час ни одного published и хотя бы один expired_unread: очередь есть, вердиктов нет. Пока модератора нет (§8.14), это ожидаемо — тревога существует, чтобы ожидаемое не спуталось с поломкой в тот день, когда модератор появится."

  - name: publishing phrases keeps it quiet
    interval: 1m
    input_series:
      - series: 'relay_feed_verdict_total{verdict="expired_unread"}'
        values: '0+1x180'
      - series: 'relay_feed_verdict_total{verdict="published"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: FeedPublishesNothing
        exp_alerts: []

  - name: an idle feed is not an alert
    interval: 1m
    input_series:
      - series: 'relay_feed_verdict_total{verdict="expired_unread"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: FeedPublishesNothing
        exp_alerts: []

  - name: likes that cannot be written raise LikesCannotWrite
    interval: 1m
    input_series:
      - series: 'relay_like_total{result="storage_failed"}'
        values: '0+1x60'
    alert_rule_test:
      # The edge (B42): quiet one evaluation before for: is met, firing at it.
      - eval_time: 10m
        alertname: LikesCannotWrite
        exp_alerts: []
      - eval_time: 11m
        alertname: LikesCannotWrite
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Лайки не записываются"
              description: "Десять минут подряд лайк или его снятие отвечают 503: узел не может писать в базу. Люди видят, что лайк не поставился."
      - eval_time: 30m
        alertname: LikesCannotWrite
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Лайки не записываются"
              description: "Десять минут подряд лайк или его снятие отвечают 503: узел не может писать в базу. Люди видят, что лайк не поставился."

  - name: likes that are written are not an alert
    interval: 1m
    input_series:
      - series: 'relay_like_total{result="liked"}'
        values: '0+5x60'
      - series: 'relay_like_total{result="storage_failed"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: LikesCannotWrite
        exp_alerts: []

  # IdentitySweeperKeepsSkipping (2026-09-25). The sweeper passes hourly and the
  # counter moves once per pass, so the series below steps every sixty samples
  # rather than growing every minute — the shape a 15-second scrape of an
  # hourly counter actually has.
  - name: share_held growing every pass for hours raises IdentitySweeperKeepsSkipping
    interval: 1m
    input_series:
      - series: 'relay_identity_sweeper_skipped_total{reason="share_held"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59'
    alert_rule_test:
      # The edge (B42): quiet one evaluation before for: is met, firing at it.
      - eval_time: 239m
        alertname: IdentitySweeperKeepsSkipping
        exp_alerts: []
      - eval_time: 240m
        alertname: IdentitySweeperKeepsSkipping
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Уборщик третий час подряд пропускает личности: долю или строку держит блокировка"
              description: "Каждый проход находит личность, которой срок вышел, и не может её закрыть: её долю, сессию или строку держит чужая транзакция. Смотреть pg_locks по vault_shares, sessions и identities — застрявшая транзакция держит личность дольше её года."
      - eval_time: 5h
        alertname: IdentitySweeperKeepsSkipping
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Уборщик третий час подряд пропускает личности: долю или строку держит блокировка"
              description: "Каждый проход находит личность, которой срок вышел, и не может её закрыть: её долю, сессию или строку держит чужая транзакция. Смотреть pg_locks по vault_shares, sessions и identities — застрявшая транзакция держит личность дольше её года."

  - name: row_held growing every pass for hours raises IdentitySweeperKeepsSkipping
    interval: 1m
    input_series:
      - series: 'relay_identity_sweeper_skipped_total{reason="row_held"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59'
    alert_rule_test:
      - eval_time: 5h
        alertname: IdentitySweeperKeepsSkipping
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Уборщик третий час подряд пропускает личности: долю или строку держит блокировка"
              description: "Каждый проход находит личность, которой срок вышел, и не может её закрыть: её долю, сессию или строку держит чужая транзакция. Смотреть pg_locks по vault_shares, sessions и identities — застрявшая транзакция держит личность дольше её года."

  - name: retry_cap growing every pass for hours raises IdentitySweeperKeepsSkipping
    interval: 1m
    input_series:
      - series: 'relay_identity_sweeper_skipped_total{reason="retry_cap"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59'
    alert_rule_test:
      - eval_time: 5h
        alertname: IdentitySweeperKeepsSkipping
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Уборщик третий час подряд пропускает личности: долю или строку держит блокировка"
              description: "Каждый проход находит личность, которой срок вышел, и не может её закрыть: её долю, сессию или строку держит чужая транзакция. Смотреть pg_locks по vault_shares, sessions и identities — застрявшая транзакция держит личность дольше её года."

  - name: one pass that met a held share is not an alert
    interval: 1m
    input_series:
      - series: 'relay_identity_sweeper_skipped_total{reason="share_held"}'
        values: '0x59 1x299'
    alert_rule_test:
      - eval_time: 2h
        alertname: IdentitySweeperKeepsSkipping
        exp_alerts: []
      - eval_time: 5h
        alertname: IdentitySweeperKeepsSkipping
        exp_alerts: []

  - name: people coming back during the pass are not an alert
    interval: 1m
    input_series:
      - series: 'relay_identity_sweeper_skipped_total{reason="came_back"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59'
    alert_rule_test:
      - eval_time: 5h
        alertname: IdentitySweeperKeepsSkipping
        exp_alerts: []

  # RecoveryClaimCannotWrite (2026-09-25).
  - name: a recovery claim that cannot be written raises RecoveryClaimCannotWrite
    interval: 1m
    input_series:
      - series: 'relay_recovery_claim_total{result="storage_failed"}'
        values: '0x10 1x50'
    alert_rule_test:
      # The edge (B42): quiet one evaluation before for: is met, firing at it.
      - eval_time: 11m
        alertname: RecoveryClaimCannotWrite
        exp_alerts: []
      - eval_time: 12m
        alertname: RecoveryClaimCannotWrite
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Восстановление бумажным кодом не записывается"
              description: "Верный бумажный код получил 503: узел не смог записать новое устройство. Человек без входа держит код в руках — смотреть журнал узла, «recovery claim failed on a new device»."
      - eval_time: 20m
        alertname: RecoveryClaimCannotWrite
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Восстановление бумажным кодом не записывается"
              description: "Верный бумажный код получил 503: узел не смог записать новое устройство. Человек без входа держит код в руках — смотреть журнал узла, «recovery claim failed on a new device»."

  # The first failure after a restart: the node publishes the series at zero
  # from the start, so an old failure, a restart and a new one read as
  # 1, reset to 0, then 1 — a step increase() sees.
  - name: the first storage_failed after a restart is not missed
    interval: 1m
    input_series:
      - series: 'relay_recovery_claim_total{result="storage_failed"}'
        values: '1x30 0x3 1x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: RecoveryClaimCannotWrite
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Восстановление бумажным кодом не записывается"
              description: "Верный бумажный код получил 503: узел не смог записать новое устройство. Человек без входа держит код в руках — смотреть журнал узла, «recovery claim failed on a new device»."

  # A scrape gap over an old failure is not a new one (verifier, 2026-09-25:
  # the `unless … offset` rule fired here).
  - name: a scrape gap over an old storage_failed is not an alert
    interval: 1m
    input_series:
      - series: 'relay_recovery_claim_total{result="storage_failed"}'
        values: '1x60 _x20 1x60'
    alert_rule_test:
      - eval_time: 90m
        alertname: RecoveryClaimCannotWrite
        exp_alerts: []

  - name: recovery claims that are written, and an old failure, are not an alert
    interval: 1m
    input_series:
      - series: 'relay_recovery_claim_total{result="new_device"}'
        values: '0+1x120'
      - series: 'relay_recovery_claim_total{result="storage_failed"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: RecoveryClaimCannotWrite
        exp_alerts: []

  # Watchdog С6: the oldest phrase waiting for a verdict, near the ten-minute
  # ceiling after which the sweep takes it unread.
  - name: a phrase waiting past nine minutes is a stopped queue
    interval: 1m
    input_series:
      - series: 'relay_moderation_oldest_seconds{brand="sosed"}'
        values: '600x10'
    alert_rule_test:
      # The edge (B42): quiet one evaluation before for: is met, firing at it.
      - eval_time: 1m
        alertname: ModerationQueueStopped
        exp_alerts: []
      - eval_time: 2m
        alertname: ModerationQueueStopped
        exp_alerts:
          - exp_labels: { severity: info, brand: sosed }
            exp_annotations:
              summary: "Очередь модерации sosed стоит: старейшей фразе 10m 0s"
              description: "Фраза ждёт вердикта дольше девяти минут; на десятой её снимут непрочитанной (moderation.queue.wait). Смотреть воркер модерации и relay_feed_verdict_total."
      - eval_time: 5m
        alertname: ModerationQueueStopped
        exp_alerts:
          - exp_labels: { severity: info, brand: sosed }
            exp_annotations:
              summary: "Очередь модерации sosed стоит: старейшей фразе 10m 0s"
              description: "Фраза ждёт вердикта дольше девяти минут; на десятой её снимут непрочитанной (moderation.queue.wait). Смотреть воркер модерации и relay_feed_verdict_total."

  # The shape the sweep actually leaves (review panel F12): one phrase ages a
  # minute at a time, passes nine minutes, and is gone at eleven. The instant
  # value was over the line for two samples only, and `for: 2m` never fired.
  # `stale`, not `_`: a series the node stops exporting is marked stale by
  # Prometheus at the next scrape, while `_` leaves the last value visible for
  # the five-minute lookback — and under `_` the old rule passed this case too.
  - name: one stuck phrase, swept at its eleventh minute, still fires
    interval: 1m
    input_series:
      - series: 'relay_moderation_oldest_seconds{brand="sosed"}'
        values: '60+60x10 stale'
    alert_rule_test:
      - eval_time: 12m
        alertname: ModerationQueueStopped
        exp_alerts:
          - exp_labels: { severity: info, brand: sosed }
            exp_annotations:
              summary: "Очередь модерации sosed стоит: старейшей фразе 11m 0s"
              description: "Фраза ждёт вердикта дольше девяти минут; на десятой её снимут непрочитанной (moderation.queue.wait). Смотреть воркер модерации и relay_feed_verdict_total."

  - name: a queue moving faster than nine minutes, or empty, is not an alert
    interval: 1m
    input_series:
      - series: 'relay_moderation_oldest_seconds{brand="sosed"}'
        values: '120x10'
      - series: 'relay_moderation_oldest_seconds{brand="neighbro"}'
        values: '600 _x9'
    alert_rule_test:
      - eval_time: 8m
        alertname: ModerationQueueStopped
        exp_alerts: []

  # TransferBrakeOn (B36, 2026-09-26): the transfer brake's pause had a series
  # and no alert. The node publishes it at zero from the start (queue_metrics.ts).
  - name: a transfer brake that stays on fires
    interval: 1m
    input_series:
      - series: 'relay_transfer_pause_seconds_left'
        values: '0 0 900 840 780 720 660'
    alert_rule_test:
      # The edge (B42): quiet one evaluation before for: is met, firing at it.
      - eval_time: 2m
        alertname: TransferBrakeOn
        exp_alerts: []
      - eval_time: 3m
        alertname: TransferBrakeOn
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Приём кодов переноса на паузе"
              description: "Пятьдесят неверных кодов переноса за час. Пока пауза держится, честный перенос тоже не принимается."
      - eval_time: 5m
        alertname: TransferBrakeOn
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Приём кодов переноса на паузе"
              description: "Пятьдесят неверных кодов переноса за час. Пока пауза держится, честный перенос тоже не принимается."

  - name: no transfer brake is not an alert
    interval: 1m
    input_series:
      - series: 'relay_transfer_pause_seconds_left'
        values: '0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: TransferBrakeOn
        exp_alerts: []

  # RecoveryBrakeOn had no test at all (B37, 2026-09-26): the same two cases as
  # its transfer twin, over its own series.
  - name: a paper-code brake that stays on fires
    interval: 1m
    input_series:
      - series: 'relay_recovery_pause_seconds_left'
        values: '0 0 900 840 780 720 660'
    alert_rule_test:
      # The edge (B42): quiet one evaluation before for: is met, firing at it.
      - eval_time: 2m
        alertname: RecoveryBrakeOn
        exp_alerts: []
      - eval_time: 3m
        alertname: RecoveryBrakeOn
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Приём бумажных кодов на паузе"
              description: "Пятьдесят промахов за час. Пока пауза держится, честный код тоже не принимается."
      - eval_time: 5m
        alertname: RecoveryBrakeOn
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Приём бумажных кодов на паузе"
              description: "Пятьдесят промахов за час. Пока пауза держится, честный код тоже не принимается."

  - name: no paper-code brake is not an alert
    interval: 1m
    input_series:
      - series: 'relay_recovery_pause_seconds_left'
        values: '0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: RecoveryBrakeOn
        exp_alerts: []

  # ── B40, 2026-09-26: a probe for every rule that had none. Each rule gets a
  # series that fires exactly on the edge of its for: (quiet one evaluation
  # before, firing at it) and a series that must stay quiet. Counters lie flat
  # first and then rise evenly, so a rate window never extrapolates and the
  # edge is where the arithmetic in the comment says it is.

  # JobChainDead: tombstone and no standing job from t0; for 5m.
  - name: a dead job chain fires at five minutes, not before
    interval: 1m
    input_series:
      - series: 'relay_jobs_tombstones{kind="mail"}'
        values: '1x20'
      - series: 'relay_jobs_standing{kind="mail"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: JobChainDead
        exp_alerts: []
      - eval_time: 5m
        alertname: JobChainDead
        exp_alerts:
          - exp_labels: { severity: critical, kind: mail }
            exp_annotations:
              summary: "Очередь mail встала: есть надгробие и нет стоячей задачи"
              description: "Задача выработала попытки и не перевзвелась. Сама она не вернётся — enqueueOnce надгробие не заменяет."

  - name: a tombstone beside a standing job is not a dead chain
    interval: 1m
    input_series:
      - series: 'relay_jobs_tombstones{kind="mail"}'
        values: '1x20'
      - series: 'relay_jobs_standing{kind="mail"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: JobChainDead
        exp_alerts: []

  # JobsOverdue: the oldest due job over an hour from t0; for 10m.
  - name: a job overdue past an hour fires at ten minutes, not before
    interval: 1m
    input_series:
      - series: 'relay_jobs_oldest_due_seconds{kind="mail"}'
        values: '3700x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: JobsOverdue
        exp_alerts: []
      - eval_time: 10m
        alertname: JobsOverdue
        exp_alerts:
          - exp_labels: { severity: warning, kind: mail }
            exp_annotations:
              summary: "Задача mail просрочена больше часа"
              description: "Никто не берёт задачи: воркер не крутится, аренда застряла, или узлов нет."

  - name: a job due under an hour is not overdue
    interval: 1m
    input_series:
      - series: 'relay_jobs_oldest_due_seconds{kind="mail"}'
        values: '3500x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: JobsOverdue
        exp_alerts: []

  # IdentitySweeperSilent, first branch: the last pass stays at 0 while time()
  # passes 10800 s after 180m, so the condition holds from 181m; for 15m.
  - name: a sweeper silent past three hours fires fifteen minutes later, not before
    interval: 1m
    input_series:
      - series: 'relay_identity_sweeper_last_pass_seconds'
        values: '0x220'
    alert_rule_test:
      - eval_time: 195m
        alertname: IdentitySweeperSilent
        exp_alerts: []
      - eval_time: 196m
        alertname: IdentitySweeperSilent
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Уборщик личностей молчит больше трёх часов"
              description: "Проход должен быть раз в час. Три срока §8.2 сейчас не исполняются: брошенные регистрации, год бездействия, тридцать дней после закрытия."

  # Second branch: no pass ever recorded, and a process up for more than three hours.
  - name: a sweeper that never passed in a process up three hours fires too
    interval: 1m
    input_series:
      - series: 'relay_process_uptime_seconds'
        values: '0+60x220'
    alert_rule_test:
      - eval_time: 195m
        alertname: IdentitySweeperSilent
        exp_alerts: []
      - eval_time: 196m
        alertname: IdentitySweeperSilent
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Уборщик личностей молчит больше трёх часов"
              description: "Проход должен быть раз в час. Три срока §8.2 сейчас не исполняются: брошенные регистрации, год бездействия, тридцать дней после закрытия."

  - name: a sweeper passing every minute is not silent
    interval: 1m
    input_series:
      - series: 'relay_identity_sweeper_last_pass_seconds'
        values: '0+60x220'
      - series: 'relay_process_uptime_seconds'
        values: '0+60x220'
    alert_rule_test:
      - eval_time: 210m
        alertname: IdentitySweeperSilent
        exp_alerts: []

  # BackupStale: 27 hours old from t0; for 10m.
  - name: a backup older than 26 hours fires at ten minutes, not before
    interval: 1m
    input_series:
      - series: 'relay_backup_age_seconds{env="prod"}'
        values: '97200x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: BackupStale
        exp_alerts: []
      - eval_time: 10m
        alertname: BackupStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Ночной бэкап опаздывает: 1d 3h 0m 0s"
              description: "Метка last-ok.json не обновлялась больше 26 часов. Смотреть relay-backup.service на боксе и зону хранилища."

  - name: a backup a day old is not stale
    interval: 1m
    input_series:
      - series: 'relay_backup_age_seconds{env="prod"}'
        values: '86400x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: BackupStale
        exp_alerts: []

  # PinMissBurst: flat for 10m, then 3 wrong PINs a minute; over 5m the count
  # is 3k at 10+k, above 10 from k=4 (14m); for 5m → 19m, with 15 in the window.
  - name: a burst of wrong PINs fires five minutes after it passes ten, not before
    interval: 1m
    input_series:
      - series: 'relay_vault_share_total{result="wrong"}'
        values: '0x10 3+3x30'
    alert_rule_test:
      - eval_time: 18m
        alertname: PinMissBurst
        exp_alerts: []
      - eval_time: 19m
        alertname: PinMissBurst
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Всплеск неверных ПИНов: 15 за пять минут"
              description: "Похоже на перебор с украденным ключом подписи. Десятая ошибка закрывает вход до бумажного кода и замораживает сессию."

  - name: one wrong PIN a minute is not a burst
    interval: 1m
    input_series:
      - series: 'relay_vault_share_total{result="wrong"}'
        values: '0x10 1+1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PinMissBurst
        exp_alerts: []

  # SessionFreezeBurst: flat for 20m, then one pin_limit freeze a minute; over
  # 15m the count is k at 20+k, above 5 from k=6 (26m); for 10m → 36m, 15 in the window.
  - name: a burst of PIN-limit freezes fires ten minutes after it passes five, not before
    interval: 1m
    input_series:
      - series: 'relay_sessions_frozen_total{reason="pin_limit"}'
        values: '0x20 1+1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: SessionFreezeBurst
        exp_alerts: []
      - eval_time: 36m
        alertname: SessionFreezeBurst
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Заморозок по лимиту ПИНа: 15 за пятнадцать минут"
              description: "Либо атака на чужие вкладки, либо дефект счётчика попыток. Каждая такая заморозка — человек без входа до бумажного кода."

  - name: freezes for other reasons are not a PIN-limit burst
    interval: 1m
    input_series:
      - series: 'relay_sessions_frozen_total{reason="transfer"}'
        values: '0x20 1+1x40'
    alert_rule_test:
      - eval_time: 50m
        alertname: SessionFreezeBurst
        exp_alerts: []

  # ServerErrors: flat for 10m, then 12 5xx a minute (0.2/s); over 5m the rate
  # is 12k/300 at 10+k, above 0.1 from k=3 (13m); for 5m → 18m.
  - name: server errors above six a minute fire at five minutes, not before
    interval: 1m
    input_series:
      - series: 'relay_requests_total{status="500"}'
        values: '0x10 12+12x30'
    alert_rule_test:
      - eval_time: 17m
        alertname: ServerErrors
        exp_alerts: []
      - eval_time: 18m
        alertname: ServerErrors
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Узел отвечает пятисотыми"
              description: "Больше шести ошибок в минуту. Смотреть журнал узла: чаще всего это база."

  - name: 4xx answers are not server errors
    interval: 1m
    input_series:
      - series: 'relay_requests_total{status="404"}'
        values: '0x10 12+12x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ServerErrors
        exp_alerts: []

  # MailFailing: flat at 0 for 20m, then one refused letter a minute; true from
  # 21m; for 10m → 31m.
  - name: refused letters fire at ten minutes, not before
    interval: 1m
    input_series:
      - series: 'relay_mail_total{result="failed",kind="notice_receipt",transport="resend"}'
        values: '0x20 1+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MailFailing
        exp_alerts: []
      - eval_time: 31m
        alertname: MailFailing
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Почта не уходит"
              description: "Подтверждения по ст. 16 и ссылки для входа в панель не доставляются."

  - name: letters that leave are not a mail failure
    interval: 1m
    input_series:
      - series: 'relay_mail_total{result="sent",kind="notice_receipt",transport="resend"}'
        values: '0x20 1+1x40'
    alert_rule_test:
      - eval_time: 50m
        alertname: MailFailing
        exp_alerts: []

  # DsaQueueStuck: three open notices and a decisions counter that stays at 0;
  # true from 1m (rate needs two samples); for 1h → 61m.
  - name: an open queue with no decisions in six hours fires at an hour, not before
    interval: 1m
    input_series:
      - series: 'relay_dsa_queue_open'
        values: '3x70'
      - series: 'relay_dsa_decisions_total{decision="upheld"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 60m
        alertname: DsaQueueStuck
        exp_alerts: []
      - eval_time: 61m
        alertname: DsaQueueStuck
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Очередь ст. 16 не разбирается"
              description: "Есть незакрытые уведомления и ни одного решения за шесть часов. Сроки ответа — регуляторные. Возраст самого старого — relay_dsa_queue_oldest_seconds."

  - name: an open queue being decided is not stuck
    interval: 1m
    input_series:
      - series: 'relay_dsa_queue_open'
        values: '3x70'
      - series: 'relay_dsa_decisions_total{decision="upheld"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: DsaQueueStuck
        exp_alerts: []

  # TransferPinGuessing: flat for 20m, then 2 wrong PINs a minute; over 15m the
  # count is 2k at 20+k, above 20 from k=11 (31m); for 15m → 46m.
  - name: guessing the transfer PIN fires fifteen minutes after it passes twenty, not before
    interval: 1m
    input_series:
      - series: 'relay_transfer_total{result="wrong_pin"}'
        values: '0x20 2+2x40'
    alert_rule_test:
      - eval_time: 45m
        alertname: TransferPinGuessing
        exp_alerts: []
      - eval_time: 46m
        alertname: TransferPinGuessing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "ПИН на окне переноса подбирают"
              description: "Больше двадцати неверных ПИНов за пятнадцать минут. Десятая попытка закрывает вход и замораживает сессию (§8.2) — если вместе с ним растёт relay_sessions_frozen_total{reason=\"pin_limit\"} (SessionFreezeBurst), защита сработала; если нет, попытки идут с разных сессий."

  - name: a wrong transfer PIN a minute is not guessing
    interval: 1m
    input_series:
      - series: 'relay_transfer_total{result="wrong_pin"}'
        values: '0x20 1+1x40'
    alert_rule_test:
      - eval_time: 55m
        alertname: TransferPinGuessing
        exp_alerts: []

  # StatementsUnavailable: flat at 0 for 20m, then a 503 a minute; true from
  # 21m; for 10m → 31m.
  - name: statements answering 503 fire at ten minutes, not before
    interval: 1m
    input_series:
      - series: 'relay_statements_total{result="unavailable"}'
        values: '0x20 1+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: StatementsUnavailable
        exp_alerts: []
      - eval_time: 31m
        alertname: StatementsUnavailable
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Мотивировки по ст. 17 не отдаются"
              description: "Маршрут отвечает 503. Это единственный путь, которым автор без почты узнаёт причину ограничения."

  - name: statements served are not unavailable
    interval: 1m
    input_series:
      - series: 'relay_statements_total{result="served"}'
        values: '0x20 1+1x40'
    alert_rule_test:
      - eval_time: 50m
        alertname: StatementsUnavailable
        exp_alerts: []

  # ── B42, 2026-09-26: the node publishes every counter these rules read at
  # zero from the start (relay/node/test/metrics_zeros.test.ts holds it to
  # that). These were the B40 findings, on series as the node emitted them
  # then: born at 1, or absent, and every one was silent. From zero, a single
  # event after a start is seen.

  # One refused letter after a start: 0 then 1 at 21m, rate > 0 until 36m; for 10m.
  - name: the one refused letter after a start fires, the counter being there at zero
    interval: 1m
    input_series:
      - series: 'relay_mail_total{result="failed",kind="notice_receipt",transport="resend"}'
        values: '0x20 1x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: MailFailing
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Почта не уходит"
              description: "Подтверждения по ст. 16 и ссылки для входа в панель не доставляются."

  # One 503 on the statements route after a start.
  - name: the one 503 on statements after a start fires, the counter being there at zero
    interval: 1m
    input_series:
      - series: 'relay_statements_total{result="unavailable"}'
        values: '0x20 1x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: StatementsUnavailable
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Мотивировки по ст. 17 не отдаются"
              description: "Маршрут отвечает 503. Это единственный путь, которым автор без почты узнаёт причину ограничения."

  # An open queue on a node that has decided nothing since it started: both
  # decision counters sit at zero, so the rate is 0 rather than absent.
  - name: an open queue with no decision since the start fires, the decision counters being there at zero
    interval: 1m
    input_series:
      - series: 'relay_dsa_queue_open'
        values: '3x70'
      - series: 'relay_dsa_decisions_total{decision="upheld"}'
        values: '0x70'
      - series: 'relay_dsa_decisions_total{decision="rejected"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: DsaQueueStuck
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Очередь ст. 16 не разбирается"
              description: "Есть незакрытые уведомления и ни одного решения за шесть часов. Сроки ответа — регуляторные. Возраст самого старого — relay_dsa_queue_oldest_seconds."

  # DsaDecisionLetterExhausted (B46; over the gauge since B63, 2026-09-26):
  # one letter given up at 11m and never sent, seen by two nodes; for 1m. It
  # still fires two hours on — the increase over 1h this replaced had gone
  # quiet by 72m (O2).
  - name: a decision letter given up fires a minute later and holds while it stays unsent
    interval: 1m
    input_series:
      - series: 'relay_dsa_decision_letters_given_up{instance="a"}'
        values: '0x10 1x130'
      - series: 'relay_dsa_decision_letters_given_up{instance="b"}'
        values: '0x10 1x130'
    alert_rule_test:
      - eval_time: 11m
        alertname: DsaDecisionLetterExhausted
        exp_alerts: []
      - eval_time: 12m
        alertname: DsaDecisionLetterExhausted
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Письмо о решении по ст. 16(5) не ушло"
              description: "Все попытки исчерпаны, или у решения нет сохранённого текста письма. Заявитель узнает решение только по квитанции на устройстве. Тревога держится, пока у такого уведомления не отмечена отправка (dsa_notices.decision_sent_at). Смотреть relay_dsa_decision_letters_given_up и почтовый транспорт."
      - eval_time: 135m
        alertname: DsaDecisionLetterExhausted
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Письмо о решении по ст. 16(5) не ушло"
              description: "Все попытки исчерпаны, или у решения нет сохранённого текста письма. Заявитель узнает решение только по квитанции на устройстве. Тревога держится, пока у такого уведомления не отмечена отправка (dsa_notices.decision_sent_at). Смотреть relay_dsa_decision_letters_given_up и почтовый транспорт."

  - name: a given-up decision letter marked sent stops the alert
    interval: 1m
    input_series:
      - series: 'relay_dsa_decision_letters_given_up'
        values: '0x10 1x20 0x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: DsaDecisionLetterExhausted
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Письмо о решении по ст. 16(5) не ушло"
              description: "Все попытки исчерпаны, или у решения нет сохранённого текста письма. Заявитель узнает решение только по квитанции на устройстве. Тревога держится, пока у такого уведомления не отмечена отправка (dsa_notices.decision_sent_at). Смотреть relay_dsa_decision_letters_given_up и почтовый транспорт."
      - eval_time: 35m
        alertname: DsaDecisionLetterExhausted
        exp_alerts: []

  - name: decision letters that fail and are retried are not given up
    interval: 1m
    input_series:
      - series: 'relay_dsa_decision_letters_given_up'
        values: '0x70'
      - series: 'relay_dsa_decision_letter_total{result="failed"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: DsaDecisionLetterExhausted
        exp_alerts: []

  # DsaLetterMarkFailed (B53, 2026-09-26): both letters' counters are there at
  # zero from the start; one decision mark fails at 11m, increase over 1h > 0
  # from then; for 1m. The arrival letter stays quiet and is not named.
  - name: a letter whose sent mark failed fires a minute later, naming the letter
    interval: 1m
    input_series:
      - series: 'relay_dsa_letter_mark_failed_total{letter="decision"}'
        values: '0x10 1x60'
      - series: 'relay_dsa_letter_mark_failed_total{letter="arrival"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 11m
        alertname: DsaLetterMarkFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: DsaLetterMarkFailed
        exp_alerts:
          - exp_labels: { severity: warning, letter: decision }
            exp_annotations:
              summary: "Письмо по ст. 16 ушло, отметка об отправке не записалась (decision)"
              description: "Следующий проход отправит письмо снова: заявитель получит его повторно. Смотреть журнал узла («a letter left and its mark was not written») и запись в dsa_notices."

  - name: letters that leave and are marked do not fire the mark alert
    interval: 1m
    input_series:
      - series: 'relay_dsa_letter_mark_failed_total{letter="decision"}'
        values: '0x70'
      - series: 'relay_dsa_letter_mark_failed_total{letter="arrival"}'
        values: '0x70'
      - series: 'relay_dsa_decision_letter_total{result="sent_on_retry"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: DsaLetterMarkFailed
        exp_alerts: []
