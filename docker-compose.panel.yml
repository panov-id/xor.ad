# Local dev server for the admin panel (Refine + Vite), hot-reloading.
# Run: docker compose -f docker-compose.panel.yml up
# Then open http://localhost:5173
#
# Talks to the local relay stand (relay/local), which must be up — the panel has
# no backend of its own.
services:
  panel-dev:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./panel:/app
    environment:
      VITE_RELAY_API_URL: http://localhost:8081
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
