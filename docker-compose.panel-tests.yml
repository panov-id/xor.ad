# Panel E2E / responsive test runner (Playwright in Docker).
#
# Uses host networking so localhost:62173 (panel dev server) and localhost:62080
# (the relay stand) resolve exactly as on the host.
#
# Requires the panel dev server and the relay stand to be up first.
# Run: scripts/run-panel-tests.sh
services:
  panel-tests:
    # drives a real Chromium; the browser is the whole cost
    mem_limit: 3g
    cpus: 2.0
    build: ./panel/tests
    network_mode: host
    # Write screenshots/report as the host user, not root, so git doesn't choke
    # on root-owned output files. HOST_UID/HOST_GID are exported by the runner.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./panel/tests/e2e:/tests/e2e
      - ./panel/tests/helpers:/tests/helpers
      - ./panel/tests/global-setup.ts:/tests/global-setup.ts
      - ./panel/tests/playwright.config.ts:/tests/playwright.config.ts
      - ./testing/screenshots:/tests/screenshots
      - ./panel/tests/report:/tests/report
      # Playwright's own output (traces, failure screenshots). Mounted for the
      # same reason as the report: the image's /tests belongs to root, and the
      # container runs as the host user, so it cannot create this itself.
      - ./panel/tests/results:/tests/results
