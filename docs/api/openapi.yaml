openapi: 3.1.0
info:
  title: xor.ad relay node
  version: "2026-09-15"
  description: |-
    The contract of the relay node, spec first (route to drawing, stage S4a, decided by the owner on 2026-09-15).
    x-status built — the route exists in relay/node/src (main.ts, routes/*.ts); its shapes were read from the code on 2026-09-15 and not exercised live.
    x-status spec or proposed — described in docs/protocol_EN.md §4 and the chat canon, not built. Where the canon names no body, none is invented here.
    Checked by scripts/check-openapi.sh against the protocol tables, the code and the rendered pages.
    Not in the contract yet (2026-09-15, open item api.contract.incomplete): tables, games for two, blocks, stepping away, support, editing the profile, reissuing the paper code and "My notices".
  x-description-ru: |-
    Контракт узла relay, спецификация первая (маршрут до отрисовки, этап Э4а, решение владельца 15.09.2026).
    x-status built — маршрут есть в relay/node/src (main.ts, routes/*.ts); формы прочитаны из кода 15.09.2026 и живым запросом не проверены.
    x-status spec или proposed — описано в docs/protocol_RU.md §4 и каноне чата, не построено. Где канон тела не называет, здесь его не выдумывают.
    Сверяется scripts/check-openapi.sh с таблицами протокола, кодом и собранными страницами.
    В контракт ещё не внесены (15.09.2026, открытый пункт api.contract.incomplete): столы, парные игры, блокировки, отлучка, поддержка, правка профиля, перевыпуск бумажного кода и «Мои уведомления».
tags:
  - name: node
    description: Service routes of the node. HEAD answers for every GET, OPTIONS answers 204 on any path (main.ts).
    x-description-ru: Служебные маршруты узла. HEAD отвечает на каждый GET, OPTIONS — 204 на любой путь (main.ts).
  - name: intake
    description: Public intake from the storefronts, keyed by a publishable key or none.
    x-description-ru: Публичный приём с витрин, по публикуемому ключу или без него.
  - name: v1
    description: The public API for third parties, by secret key. Errors have the form {error:{code,message}}.
    x-description-ru: Публичный API для третьих сторон, по секретному ключу. Ошибки в форме {error:{code,message}}.
  - name: auth
    description: Sign-in to the panel by an emailed link.
    x-description-ru: Вход в панель по ссылке из письма.
  - name: admin
    description: The panel's routes, by panel session and permission.
    x-description-ru: Маршруты панели, по сессии панели и пермишену.
  - name: identity
    description: Identity and session (protocol §4.1). Not built.
    x-description-ru: Личность и сессия (протокол §4.1). Не построено.
  - name: feed
    description: The feed (protocol §4.2). Not built.
    x-description-ru: Лента (протокол §4.2). Не построено.
  - name: chat
    description: Like, match, chat (protocol §4.3). Not built.
    x-description-ru: Лайк, мэтч, чат (протокол §4.3). Не построено.
components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Publishable storefront key ak_pub_…, public by design; answers "which face", nothing more.
      x-description-ru: Публикуемый ключ витрины ak_pub_…, публичен по замыслу; отвечает «какое лицо», и только.
    secretKey:
      type: http
      scheme: bearer
      description: Secret key "ak_live_….secret" in Authorization. Scopes are permissions of access/.
      x-description-ru: Секретный ключ «ak_live_….секрет» в Authorization. Скоупы — пермишены access/.
    panelSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Panel session JWT (HS256, 7 days) from /auth/callback; each route checks a permission.
      x-description-ru: Сессия панели, JWT (HS256, 7 суток) из /auth/callback; каждый маршрут проверяет пермишен.
    metricsToken:
      type: http
      scheme: bearer
      description: METRICS_TOKEN in Authorization or x-metrics-token; without it the route answers 404.
      x-description-ru: METRICS_TOKEN в Authorization или x-metrics-token; без него маршрут отвечает 404.
    identitySignature:
      type: apiKey
      in: header
      name: x-identity-sign
      description: 'Request signature (protocol §2): ECDSA P-256 over method, path, body sha256 and unix time; with x-identity-session and x-identity-time, a ±5 minute window.'
      x-description-ru: 'Подпись запроса (протокол §2): ECDSA P-256 над методом, путём, sha256 тела и unix-временем; вместе с x-identity-session и x-identity-time, окно ±5 минут.'
  schemas:
    Error:
      type: object
      description: The node's flat error.
      x-description-ru: Плоская ошибка узла.
      required: [error]
      properties:
        error: {type: string}
    V1Error:
      type: object
      description: The error form of /v1.
      x-description-ru: Форма ошибки /v1.
      required: [error]
      properties:
        error:
          type: object
          properties:
            code: {type: string, enum: [rate_limited, unauthorized, forbidden, unknown_brand, invalid_body]}
            message: {type: string}
    LegalReacceptance:
      type: object
      description: 409 for any signed request that publishes or opens a chat while an accepted revision is stale (protocol §6).
      x-description-ru: 409 на подписанный запрос, который публикует или открывает чат при разошедшейся редакции (протокол §6).
      properties:
        error: {type: string, const: legal_reacceptance_required}
        documents:
          type: array
          items:
            type: object
            properties:
              document: {type: string, enum: [terms, privacy, guidelines]}
              revision_date: {type: string, format: date}
              revision_sha256: {type: string}
    Ok:
      type: object
      properties:
        ok: {type: boolean}
    Health:
      type: object
      properties:
        status: {type: string, const: ok}
        node: {type: string}
        region: {type: string}
        env: {type: string}
        image: {type: string}
        storage: {type: boolean}
        storage_transport: {type: string}
        mail: {type: string}
        brands: {type: array, items: {type: string}}
        database: {type: string, enum: [ok, down, "off"]}
        ts: {type: string}
    Ready:
      type: object
      properties:
        status: {type: string, enum: [ready, not_ready]}
        node: {type: string}
        env: {type: string}
        database: {type: string}
        ts: {type: string}
    WaitlistLead:
      type: object
      required: [email]
      properties:
        email: {type: string, maxLength: 254, description: Checked by isEmail.}
        website: {type: string, description: Bot trap; a non-empty value answers 202 before any check.}
        source: {type: string, maxLength: 120}
        lang: {type: string, maxLength: 8}
        accent: {type: string, maxLength: 16}
        mode: {type: string, maxLength: 16}
        early_access: {type: boolean}
    ClientError:
      type: object
      properties:
        kind: {type: string, maxLength: 64}
        message: {type: string, maxLength: 1000}
        stack: {type: string, maxLength: 2000}
        page_url: {type: string, maxLength: 300}
        user_agent: {type: string, maxLength: 300}
        source: {type: string, maxLength: 120}
        extra: {type: object, description: Flat, at most 12 keys.}
    Pageview:
      type: object
      properties:
        path: {type: string, maxLength: 200}
        lang: {type: string, maxLength: 8}
        referrer: {type: string, description: Only the host of an http(s) referrer is kept.}
        viewport: {type: number, description: Reduced to mobile, tablet or desktop.}
        first_in_tab: {type: boolean}
        source: {type: string, maxLength: 120}
    Notice:
      type: object
      description: An Article 16 DSA notice.
      x-description-ru: Уведомление по ст. 16 DSA.
      required: [target_kind, reason_text, bona_fide]
      properties:
        target_kind: {type: string, enum: [feed_message, offer, table_line, chat, other]}
        reason_text: {type: string, maxLength: 4000}
        bona_fide: {type: boolean, const: true}
        notifier_name: {type: string, maxLength: 200}
        notifier_email: {type: string}
        target_id: {type: string, maxLength: 400}
        lang: {type: string, maxLength: 8}
        source: {type: string, maxLength: 120}
    KeySelf:
      type: object
      properties:
        id: {type: string}
        brand: {type: string}
        name: {type: string}
        scopes: {type: array, items: {type: string}}
    FeedItem:
      type: object
      description: A feed item — a circle, not a point; lat and lon rounded to the grid of area_radius (protocol §4.2).
      x-description-ru: Карточка ленты — круг, а не точка; lat и lon округлены до узла сетки с шагом area_radius (протокол §4.2).
      properties:
        id: {type: string, format: uuid}
        text: {type: string, maxLength: 128}
        mode: {type: string}
        lat: {type: number}
        lon: {type: number}
        area_radius: {type: integer, enum: [100, 300, 1000, 3000, 10000]}
        like_count: {type: integer}
        created_at: {type: integer, description: 'Unix seconds; carries visible_at, the moment the phrase passed the queue, not the moment it was submitted (chat canon §8.3, 2026-09-15).', x-description-ru: 'Unix-секунды; несёт visible_at — момент прохождения очереди, а не отправки (канон чата §8.3, 15.09.2026).'}
    LikeResult:
      type: object
      properties:
        state: {type: string, enum: [liked, matched, spent]}
        match_id: {type: string, format: uuid}
    SessionsInvite:
      type: object
      properties:
        lookup_id: {type: string, description: First 32 bytes of Argon2id over the nine-character code.}
        ttl: {type: integer, const: 120}
    ReceiptQuery:
      type: object
      description: The device's receipt code, in the body and never in the address (dsa/SPEC §6).
      x-description-ru: Код квитанции с устройства, в теле и никогда в адресе (dsa/SPEC §6).
      properties:
        code: {type: string}
    SessionsClaim:
      type: object
      properties:
        lookup_id: {type: string}
        enc_secret: {type: string, description: 'An envelope: the new device''s signing and wrapping public keys and a label.'}
    ChatsAlive:
      type: object
      properties:
        ids: {type: array, items: {type: string, format: uuid}}
    ChatsAliveResult:
      type: object
      properties:
        alive: {type: array, items: {type: string, format: uuid}}
paths:
  /health:
    get:
      tags: [node]
      summary: Node health, always 200
      x-summary-ru: Состояние узла, всегда 200
      x-status: built
      x-source: relay/node/src/main.ts
      security: []
      responses:
        "200": {description: The node answers., x-description-ru: Узел отвечает., content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /ready:
    get:
      tags: [node]
      summary: Readiness, 503 while the database is down
      x-summary-ru: Готовность, 503 пока база недоступна
      x-status: built
      x-source: relay/node/src/main.ts
      security: []
      responses:
        "200": {description: Ready., x-description-ru: Готов., content: {application/json: {schema: {$ref: "#/components/schemas/Ready"}}}}
        "503": {description: Database down., x-description-ru: База недоступна.}
  /metrics:
    get:
      tags: [node]
      summary: Prometheus counters by token
      x-summary-ru: Счётчики Prometheus по токену
      x-status: built
      x-internal: true
      x-source: relay/node/src/main.ts
      security: [{metricsToken: []}]
      responses:
        "200": {description: text/plain; version=0.0.4, x-description-ru: text/plain; version=0.0.4}
        "404": {description: No token or a wrong one — not 401, so the path is not confirmed., x-description-ru: Нет токена или не тот — не 401, чтобы путь не подтверждался.}
  /chat:
    get:
      tags: [node]
      summary: Chat relay slot, not enabled
      x-summary-ru: Слот релея чата, не включён
      x-status: built
      x-source: relay/node/src/main.ts
      security: []
      responses:
        "501": {description: chat relay not enabled on this node yet, x-description-ru: релей чата на этом узле ещё не включён}
  /waitlist:
    post:
      tags: [intake]
      summary: A waitlist lead from a storefront
      x-summary-ru: Заявка в лист ожидания с витрины
      x-status: built
      x-source: relay/node/src/main.ts
      security: [{publishableKey: []}, {}]
      description: Rate limit 20 per hour and 60 per day by address; the key is optional unless REQUIRE_API_KEY=true.
      x-description-ru: Предел 20 в час и 60 в сутки по адресу; ключ необязателен, если не REQUIRE_API_KEY=true.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/WaitlistLead"}}}}
      responses:
        "200": {description: Stored, a duplicate, or storage off., x-description-ru: Сохранено, дубль или хранилище выключено., content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "202": {description: Bot trap filled., x-description-ru: Заполнена ловушка для ботов.}
        "401": {description: Missing or invalid key., x-description-ru: Нет ключа или ключ неверен., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Origin not allowed for this key., x-description-ru: Источник не разрешён для ключа.}
        "422": {description: invalid email, x-description-ru: неверная почта}
        "429": {description: Address limit or daily quota., x-description-ru: Предел адреса или суточная квота.}
        "503": {description: brand unavailable, x-description-ru: бренд недоступен}
  /client-error:
    post:
      tags: [intake]
      summary: A client error report, always 200
      x-summary-ru: Отчёт об ошибке клиента, всегда 200
      x-status: built
      x-source: relay/node/src/main.ts
      security: [{publishableKey: []}, {}]
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ClientError"}}}}
      responses:
        "200": {description: Accepted or silently dropped., x-description-ru: Принято или молча отброшено., content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
  /pageview:
    post:
      tags: [intake]
      summary: A page view for our own counter, always 200
      x-summary-ru: Просмотр страницы для своего счётчика, всегда 200
      x-status: built
      x-source: relay/node/src/main.ts
      security: [{publishableKey: []}]
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/Pageview"}}}}
      responses:
        "200": {description: Accepted or silently dropped., x-description-ru: Принято или молча отброшено., content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
  /report:
    post:
      tags: [intake]
      summary: An Article 16 notice, public by design
      x-summary-ru: Уведомление по ст. 16, публично по замыслу
      x-status: built
      x-source: relay/node/src/main.ts
      security: [{publishableKey: []}, {}]
      description: Rate limit 10 per hour and 40 per day by address; a key only names the brand and never refuses the notice.
      x-description-ru: Предел 10 в час и 40 в сутки по адресу; ключ только называет бренд и уведомление не отклоняет.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/Notice"}}}}
      responses:
        "202": {description: Accepted with an id., x-description-ru: Принято, с номером.}
        "422": {description: invalid body or a required field missing, x-description-ru: неверное тело или нет обязательного поля}
        "429": {description: Address limit., x-description-ru: Предел адреса.}
        "503": {description: could not store the notice, x-description-ru: не удалось сохранить уведомление}
  /report/decision:
    post:
      tags: [intake]
      summary: The decision on a notice by its receipt code
      x-summary-ru: Решение по уведомлению по коду квитанции
      x-status: proposed
      security: []
      description: 'Not signed by an identity; the code in the body. "No such receipt" and "not decided yet" get one answer: status 200, the body byte for byte, Cache-Control no-store, one minimum response time for both branches; the per-address limit lives in memory and is not logged (dsa/SPEC §6, protocol §4.5). The decision body is not spelled out in the canon.'
      x-description-ru: 'Личностью не подписан; код в теле. На «нет такой квитанции» и «решения ещё нет» ответ один: статус 200, тело байт в байт, Cache-Control no-store, одно минимальное время на обе ветки; предел по адресу держится в памяти и в журнал не пишется (dsa/SPEC §6, протокол §4.5). Тело решения в каноне поле за полем не описано.'
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ReceiptQuery"}}}}
      responses:
        "200": {description: The same answer for an unknown receipt and an undecided notice; the decision once there is one., x-description-ru: Один ответ на неизвестную квитанцию и нерешённое уведомление; решение, когда оно есть.}
  /csp-report:
    post:
      tags: [intake]
      summary: A content-security-policy violation, always 204
      x-summary-ru: Нарушение политики безопасности контента, всегда 204
      x-status: built
      x-source: relay/node/src/main.ts
      security: []
      responses:
        "204": {description: No body, even over the limit., x-description-ru: Без тела, даже сверх предела.}
  /v1/waitlist:
    post:
      tags: [v1]
      summary: A waitlist lead by secret key
      x-summary-ru: Заявка в лист ожидания по секретному ключу
      x-status: built
      x-source: relay/node/src/routes/v1.ts
      security: [{secretKey: []}]
      description: Scope waitlist.write. Idempotency-Key replays a stored response when key and body hash match.
      x-description-ru: Скоуп waitlist.write. Idempotency-Key повторяет сохранённый ответ при совпадении ключа и хэша тела.
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string}}
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/WaitlistLead"}}}}
      responses:
        "200": {description: Stored., x-description-ru: Сохранено., content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "401": {description: No secret key, or unknown or revoked., x-description-ru: Нет секретного ключа или он неизвестен или отозван., content: {application/json: {schema: {$ref: "#/components/schemas/V1Error"}}}}
        "403": {description: Key not scoped., x-description-ru: У ключа нет скоупа.}
        "409": {description: unknown_brand, x-description-ru: unknown_brand}
        "422": {description: invalid_body, x-description-ru: invalid_body}
        "429": {description: Address limit or daily quota., x-description-ru: Предел адреса или суточная квота.}
  /v1/pageview:
    post:
      tags: [v1]
      summary: A page view by secret key
      x-summary-ru: Просмотр страницы по секретному ключу
      x-status: built
      x-source: relay/node/src/routes/v1.ts
      security: [{secretKey: []}]
      description: Scope pageviews.write.
      x-description-ru: Скоуп pageviews.write.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/Pageview"}}}}
      responses:
        "200": {description: Accepted., x-description-ru: Принято., content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "401": {description: No or unknown secret key., x-description-ru: Нет или неизвестен секретный ключ., content: {application/json: {schema: {$ref: "#/components/schemas/V1Error"}}}}
        "403": {description: Key not scoped., x-description-ru: У ключа нет скоупа.}
        "429": {description: Address limit or daily quota., x-description-ru: Предел адреса или суточная квота.}
  /v1/client-error:
    post:
      tags: [v1]
      summary: A client error by secret key
      x-summary-ru: Ошибка клиента по секретному ключу
      x-status: built
      x-source: relay/node/src/routes/v1.ts
      security: [{secretKey: []}]
      description: Scope client_errors.write.
      x-description-ru: Скоуп client_errors.write.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ClientError"}}}}
      responses:
        "200": {description: Accepted., x-description-ru: Принято., content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "401": {description: No or unknown secret key., x-description-ru: Нет или неизвестен секретный ключ., content: {application/json: {schema: {$ref: "#/components/schemas/V1Error"}}}}
        "403": {description: Key not scoped., x-description-ru: У ключа нет скоупа.}
        "429": {description: Address limit or daily quota., x-description-ru: Предел адреса или суточная квота.}
  /v1/me:
    get:
      tags: [v1]
      summary: What this key is
      x-summary-ru: Что это за ключ
      x-status: built
      x-source: relay/node/src/routes/v1.ts
      security: [{secretKey: []}]
      responses:
        "200": {description: The key describing itself., x-description-ru: Ключ описывает сам себя., content: {application/json: {schema: {$ref: "#/components/schemas/KeySelf"}}}}
        "401": {description: No or unknown secret key., x-description-ru: Нет или неизвестен секретный ключ., content: {application/json: {schema: {$ref: "#/components/schemas/V1Error"}}}}
        "429": {description: Address limit., x-description-ru: Предел адреса.}
  /auth/request-link:
    post:
      tags: [auth]
      summary: Ask for a sign-in link, always 204
      x-summary-ru: Запросить ссылку для входа, всегда 204
      x-status: built
      x-source: relay/node/src/routes/admin.ts
      security: []
      description: The letter goes only to an existing operator, at most 6 an hour per mailbox; the answer never says which.
      x-description-ru: Письмо уходит только существующему оператору, не больше 6 в час на ящик; ответ этого не выдаёт.
      responses:
        "204": {description: Accepted., x-description-ru: Принято.}
        "429": {description: Address limit., x-description-ru: Предел адреса.}
  /auth/callback:
    get:
      tags: [auth]
      summary: Exchange a one-time link for a session
      x-summary-ru: Обменять одноразовую ссылку на сессию
      x-status: built
      x-source: relay/node/src/routes/admin.ts
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
      responses:
        "200": {description: A panel session JWT., x-description-ru: JWT сессии панели.}
        "401": {description: invalid or expired link, x-description-ru: ссылка неверна или истекла}
  /auth/me:
    get:
      tags: [auth]
      summary: Who is signed in
      x-summary-ru: Кто вошёл
      x-status: built
