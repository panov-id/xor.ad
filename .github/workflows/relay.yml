name: relay

# Test the node, then build + push the node/caddy images to ghcr with immutable
# tags: branch sha (dev iteration) and semver on a vX.Y.Z tag (release). No :latest.
on:
  push:
    # Everything but main. On main the release path owns the build: deploy-uat.yml
    # creates the tag and calls this workflow. A branch trigger here would start a
    # second run for the same commit — a different image, and an overwrite of the
    # sha tag the first run had just written. That is how one commit came to have
    # two relay-caddy digests on 2026-08-07.
    branches-ignore: [main]
    tags: ["v*"]
    # Repeated below rather than anchored: GitHub Actions does not support YAML
    # anchors, and a workflow that fails to parse fails silently.
    paths:
      - "relay/**"
      # Documentation inside relay/ is not code. One edit to ARCHITECTURE_RU.md
      # was starting two multi-arch builds with arm64 emulation.
      - "!relay/**.md"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "relay/**"
      - "!relay/**.md"
      - ".github/workflows/relay.yml"
  # Called by deploy-uat.yml right after it creates the release tag. A tag pushed
  # from a workflow carries GITHUB_TOKEN, and GitHub deliberately does not start
  # a new run for those — so the release tag never triggered this build on its
  # own, at any tag format. Being called does not depend on whose token wrote the
  # tag, which is the point.
  workflow_call:
    inputs:
      release_tag:
        description: "Tag to label the images with, in addition to the sha"
        type: string
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          # The same version the image runs (relay/node/Dockerfile) and the same
          # the local test script uses. A floating v2.x once type-checked the
          # code against a newer standard library than the one that would ship,
          # which fails a release for a difference that does not exist in prod.
          deno-version: v2.1.4
      # Mirrors scripts/run-relay-tests.sh — the reads and writes are the tenancy
      # tests working against a real temp dir, because a mock of the boundary
      # under test would prove nothing.
      # The database suite is excluded here and runs in the `database` job below:
      # this job has no Postgres, and that is deliberate — a node without
      # DATABASE_URL is a supported configuration.
      - name: unit tests
        working-directory: relay/node
        run: deno test --allow-env --allow-read --allow-write --ignore=test/tenancy.test.ts,test/database.test.ts
      # In a process of its own: it rewrites BRANDS/SESSION_SECRET, and config.ts
      # captures those at import, so sharing a process would leak them into
      # everyone else's configuration.
      - name: tenancy test
        working-directory: relay/node
        # Loopback only: the invitation tests hand the letter to a fake SMTP
        # server in-process, so the suite reads what the recipient would.
        run: deno test --allow-env --allow-read --allow-write --allow-net=127.0.0.1 test/tenancy.test.ts
      # Not just main.ts: the tools are the migration and the key minting, and a
      # broken one is only discovered when it is needed most.
      - name: type check
        working-directory: relay/node
        run: deno check $(find src tools -name "*.ts")
      - name: integration (local stand)
        run: bash relay/test/integration.sh

  # Its own job, because it is the only one that needs a database — and because
  # what it covers is invisible to the job above: every suite there runs with
  # DATABASE_URL unset, so the branches that need Postgres do not fail, they never
  # execute. A foreign key that made key issuance impossible shipped that way.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: test
          POSTGRES_DB: relay_test
        ports: ["5432:5432"]
        # The runner's step starts long before Postgres accepts a connection;
        # without this the migration loses a race it cannot retry.
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://relay:test@localhost:5432/relay_test
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      # The same tool the wizard runs before a node starts, so CI proves the
      # migrations apply as well as that the code passes.
      - name: migrations
        working-directory: relay/node
        run: deno run --allow-env --allow-net --allow-read tools/migrate_db.ts
      - name: database tests
        working-directory: relay/node
        run: deno test --allow-env --allow-net --allow-read --allow-write test/database.test.ts

  build-push:
    needs: [test, database]
    # Only the refs that get deployed need an image: dev, a release tag, and the
    # release path on main (which reaches us as a call). Day branches run the
    # tests above and stop there — nothing deploys from them, and a third run in
    # the concurrency group below would cancel whichever run is waiting in it.
    #
    # The call is recognised by `inputs.release_tag`, not by the event name: a
    # reusable workflow sees the CALLER's `github` context, so on a call from
    # deploy-uat `github.event_name` reads "push" and `github.ref` reads main.
    # Inputs exist only on a call, which makes them the honest signal.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_call')
      && (inputs.release_tag != ''
          || github.ref == 'refs/heads/dev'
          || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # One commit, one image — however many refs it lands on. In the ordinary flow
    # a commit reaches dayN, then dev, then main, and each landing used to start
    # its own build: three images for one commit, each overwriting the sha tag the
    # previous had written. Runs for the same sha now queue instead of racing, and
    # the one behind finds the image already there (see "already built?" below).
    # Without the queue both would look, both would see nothing, and both build.
    #
    # Two runs at most may enter this group — the dev push and the release call —
    # and that ceiling is the point of the job condition above. `cancel-in-progress:
    # false` protects the run that is executing, never the one that waits: GitHub
    # keeps a single pending run per group and cancels it when a third arrives. A
    # third arrival would therefore cancel the release call, and UAT would deploy a
    # tag that has no image.
    concurrency:
      group: relay-build-${{ github.sha }}-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    strategy:
      matrix:
        image: [node, caddy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # arm64 emulation for the multi-arch build
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/panov-id/relay-${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            # The release tag as given. Not type=semver: that reads the ref, and
            # on a call the ref is the branch, not the tag.
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
      # The sha tag is the identity of a commit's image. If it is already in the
      # registry this commit was built by an earlier run, and building again would
      # produce a *different* image for the same source — multi-arch builds are not
      # bit-reproducible, and relay-caddy proved it on 2026-08-07 with two digests
      # for one commit.
      - name: already built?
        id: existing
        run: |
          reference="ghcr.io/panov-id/relay-${{ matrix.image }}:sha-${GITHUB_SHA::7}"
          if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "уже собран: $reference"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "не найден, собираем: $reference"
          fi

      # Label the manifest that exists rather than making a new one. Every tag the
      # metadata step would have applied is applied here, so a release tag and a
      # branch tag still land — on the bytes that were tested, not on a rebuild.
      - name: tag the image that already exists
        if: steps.existing.outputs.found == 'true'
        run: |
          arguments=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && arguments+=(--tag "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${arguments[@]}" \
            "ghcr.io/panov-id/relay-${{ matrix.image }}:sha-${GITHUB_SHA::7}"

      - name: build + push (multi-arch)
        id: build
        if: steps.existing.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: relay/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64 # boxes are ARM (Hetzner CAX, Oracle A1) + x86 (GCP)
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true # SBOM attestation
          provenance: mode=max # SLSA provenance
      # Signing and scanning belong to the build that produced the image. A run
      # that only added tags has nothing new to sign: the digest it labelled was
      # signed and scanned when it was first built.
      - name: sign (cosign, keyless)
        if: steps.existing.outputs.found == 'false'
        run: cosign sign --yes ghcr.io/panov-id/relay-${{ matrix.image }}@${{ steps.build.outputs.digest }}
      - name: vulnerability scan (report)
        if: steps.existing.outputs.found == 'false'
        # Run Trivy's official image directly — avoids the trivy-action composite
        # whose setup-trivy pin is fragile. Report only; don't block on base CVEs.
        run: |
          docker run --rm -v "$HOME/.docker":/root/.docker:ro aquasec/trivy:0.72.0 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            ghcr.io/panov-id/relay-${{ matrix.image }}@${{ steps.build.outputs.digest }}
