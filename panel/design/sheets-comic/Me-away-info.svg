<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
<defs><style>@font-face{font-family:"Russo One";src:url(/fonts/comic-russo-one.ttf)}@font-face{font-family:"Golos Text";font-weight:500;src:url(/fonts/comic-golos-500.ttf)}
.h{font-family:"Russo One";letter-spacing:.04em}.b,.m{font-family:"Golos Text";font-weight:500}.mono{font-family:"DejaVu Sans Mono",monospace;font-weight:700}</style>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8893b"/><stop offset=".5" stop-color="#e9cf8a"/><stop offset="1" stop-color="#b8893b"/></linearGradient><pattern id="sh" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#141018"/><circle cx="3" cy="3" r="1.9" fill="#141018"/></pattern></defs>
<rect width="375" height="812" fill="#f6efe2"/>
<g transform="translate(4.4 0) scale(0.9767)">
<polygon points="12,16 363,12 367,60 8,64" fill="url(#gold)" stroke="#141018" stroke-width="2.5" stroke-linejoin="round"/>
<text x="24" y="46" class="h" font-size="19.8" fill="#141018" text-anchor="start" >отойти</text>
<text x="16" y="108" class="b" font-size="17" fill="#141018" text-anchor="start" >20 минут</text>
<path d="M340 96 L346 102 L340 108" fill="none" stroke="#141018" stroke-width="2.5"/><rect x="16" y="128" width="343" height="3" fill="#141018"/>
<text x="16" y="166" class="b" font-size="17" fill="#141018" text-anchor="start" >час</text>
<path d="M340 154 L346 160 L340 166" fill="none" stroke="#141018" stroke-width="2.5"/><rect x="16" y="186" width="343" height="3" fill="#141018"/>
<text x="16" y="224" class="b" font-size="17" fill="#141018" text-anchor="start" >4 часа</text>
<path d="M340 212 L346 218 L340 224" fill="none" stroke="#141018" stroke-width="2.5"/><rect x="16" y="244" width="343" height="3" fill="#141018"/>
<text x="16" y="278" class="m" font-size="14" fill="#5a4e44" text-anchor="start" >выберите срок — посчитаем, что он стоит</text>
<rect x="20" y="298" width="40" height="40" fill="#141018"/><rect x="16" y="294" width="40" height="40" fill="url(#gold)" stroke="#141018" stroke-width="2.5"/>
<g transform="translate(23.76 301.76) scale(1.02)" fill="none" stroke="#141018" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="--f:#ffffff"><circle class="f" fill="#ffffff" cx="12" cy="12" r="9"/><path d="M12 11 V17"/><circle cx="12" cy="7.5" r="1.3" fill="#141018"/></g>
<rect x="16" y="354" width="343" height="52" fill="#ece3d2" stroke="#5a4e44" stroke-width="2.5" stroke-dasharray="6 4"/>
<g opacity="0.45">
<g transform="translate(173.1 365.6) scale(1.2)" fill="none" stroke="#141018" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="--f:#ffffff"><circle class="f" fill="#ffffff" cx="12" cy="13" r="8"/><path d="M12 9 V13 L15 15 M9 2 H15"/></g>
</g>
<rect x="20" y="424" width="343" height="52" fill="#141018"/>
<rect x="16" y="420" width="343" height="52" fill="#fffaf0" stroke="#141018" stroke-width="2.5" />
<g opacity="1">
<g transform="translate(173.1 431.6) scale(1.2)" fill="none" stroke="#141018" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="--f:#d9b766"><path d="M15 5 L8 12 L15 19"/></g>
</g>
</g>
<rect width="375" height="812" fill="#141018" opacity=".45"/>
<path d="M12 354 H26 L36 338 L46 354 H363 V781 H12Z" transform="translate(4 4)" fill="#141018" stroke="#141018" stroke-width="2.5"/><path d="M12 354 H26 L36 338 L46 354 H363 V781 H12Z" fill="#fffaf0" stroke="#141018" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="17" y="359" width="341" height="417" fill="none" stroke="url(#gold)" stroke-width="1"/>
<g transform="translate(325.48 368.48) scale(0.96)" fill="none" stroke="#141018" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="--f:#fffaf0"><path d="M6 6 L18 18 M18 6 L6 18"/></g>
<text x="28" y="394" class="b" font-size="15" fill="#141018" text-anchor="start" >Ваши фразы исчезнут вместе с</text>
<text x="28" y="415" class="b" font-size="15" fill="#141018" text-anchor="start" >лайками, ваши лайки на чужих фразах</text>
<text x="28" y="436" class="b" font-size="15" fill="#141018" text-anchor="start" >и столах снимутся, а предложения</text>
<text x="28" y="457" class="b" font-size="15" fill="#141018" text-anchor="start" >поговорить сгорят. Беседы живут по</text>
<text x="28" y="478" class="b" font-size="15" fill="#141018" text-anchor="start" >своим срокам: этот перерыв</text>
<text x="28" y="499" class="b" font-size="15" fill="#141018" text-anchor="start" >переживут только те, чей срок</text>
<text x="28" y="520" class="b" font-size="15" fill="#141018" text-anchor="start" >дольше перерыва с учётом вашей</text>
<text x="28" y="541" class="b" font-size="15" fill="#141018" text-anchor="start" >последней реплики, — сколько</text>
<text x="28" y="562" class="b" font-size="15" fill="#141018" text-anchor="start" >именно, сказано выше. Если вы</text>
<text x="28" y="583" class="b" font-size="15" fill="#141018" text-anchor="start" >сидите за столом — вы из-за него</text>
<text x="28" y="604" class="b" font-size="15" fill="#141018" text-anchor="start" >встанете, игра продолжится без вас.</text>
<text x="28" y="625" class="b" font-size="15" fill="#141018" text-anchor="start" >Фраза, которая ещё ждёт проверки,</text>
<text x="28" y="646" class="b" font-size="15" fill="#141018" text-anchor="start" >исчезнет вместе с остальными.</text>
<text x="28" y="667" class="b" font-size="15" fill="#141018" text-anchor="start" >Часовой предел публикаций и пауза</text>
<text x="28" y="688" class="b" font-size="15" fill="#141018" text-anchor="start" >после отказов перерыв переживут:</text>
<text x="28" y="709" class="b" font-size="15" fill="#141018" text-anchor="start" >вернувшись, вы получите четыре</text>
<text x="28" y="730" class="b" font-size="15" fill="#141018" text-anchor="start" >свободных места, но не новый час.</text>
</svg>