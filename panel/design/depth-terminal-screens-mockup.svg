<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1150">
<title>depth · first terminal screens · 80x24 each</title>
<style>text{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:14px;fill:#d8d8d0;white-space:pre}.h{fill:#8a8a80;font-size:12px}.q{font-family:"Inter",sans-serif;fill:#14140f;font-size:15px}.c{fill:#6a6a60}</style>
<rect width="100%" height="100%" fill="#f2f2f0"/>
<clipPath id="s0"><rect x="20.0" y="20" width="686" height="482"/></clipPath>
<rect x="20.0" y="20" width="700" height="482" rx="6" fill="#14140f"/>
<g clip-path="url(#s0)">
<text x="34.0" y="36" class="h">1 · регистрация (new)</text>
<text x="34.0" y="70" xml:space="preserve">Operator.</text>
<text x="34.0" y="88" xml:space="preserve"></text>
<text x="34.0" y="106" xml:space="preserve">Новая личность. Она живёт в этом томе; удалишь том — это будет другой человек.</text>
<text x="34.0" y="124" xml:space="preserve"></text>
<text x="34.0" y="142" xml:space="preserve">  имя     &gt; Аня_</text>
<text x="34.0" y="160" xml:space="preserve">  возраст &gt; 27</text>
<text x="34.0" y="178" xml:space="preserve"></text>
<text x="34.0" y="196" xml:space="preserve"></text>
<text x="34.0" y="214" xml:space="preserve">Бумажный код (запиши, на экране он больше не появится):</text>
<text x="34.0" y="232" xml:space="preserve"></text>
<text x="34.0" y="250" xml:space="preserve">      K7Q-M3F-2X9</text>
<text x="34.0" y="268" xml:space="preserve"></text>
<text x="34.0" y="286" xml:space="preserve">  повтори код &gt; ___-___-___</text>
<text x="34.0" y="304" xml:space="preserve"></text>
<text x="34.0" y="322" xml:space="preserve"></text>
<text x="34.0" y="340" xml:space="preserve">[ дальше ]   выход</text>
<text x="34.0" y="358" xml:space="preserve"></text>
<text x="34.0" y="376" xml:space="preserve" class="c"># ПИН и настоящий код — заглушки testOnly до решения по Argon2id</text>
</g>
<clipPath id="s1"><rect x="740.0" y="20" width="686" height="482"/></clipPath>
<rect x="740.0" y="20" width="700" height="482" rx="6" fill="#14140f"/>
<g clip-path="url(#s1)">
<text x="754.0" y="36" class="h">2 · локация — при каждом запуске, в памяти процесса</text>
<text x="754.0" y="70" xml:space="preserve">Где ты?</text>
<text x="754.0" y="88" xml:space="preserve"></text>
<text x="754.0" y="106" xml:space="preserve">Точка — это фильтр ленты и место, откуда уйдёт твоя фраза.</text>
<text x="754.0" y="124" xml:space="preserve">Она живёт до выхода: на диск не пишется, при следующем запуске спросим снова.</text>
<text x="754.0" y="142" xml:space="preserve"></text>
<text x="754.0" y="160" xml:space="preserve">  широта  &gt; 59.9343</text>
<text x="754.0" y="178" xml:space="preserve">  долгота &gt; 30.3351</text>
<text x="754.0" y="196" xml:space="preserve">  радиус    ‹ 1000 м ›</text>
<text x="754.0" y="214" xml:space="preserve"></text>
<text x="754.0" y="232" xml:space="preserve"></text>
<text x="754.0" y="250" xml:space="preserve"></text>
<text x="754.0" y="268" xml:space="preserve"></text>
<text x="754.0" y="286" xml:space="preserve"></text>
<text x="754.0" y="304" xml:space="preserve"></text>
<text x="754.0" y="322" xml:space="preserve"></text>
<text x="754.0" y="340" xml:space="preserve">[ смотреть ленту ]   выход</text>
<text x="754.0" y="358" xml:space="preserve"></text>
<text x="754.0" y="376" xml:space="preserve">↑↓ поле  ←→ радиус и кнопки  enter выбрать</text>
</g>
<clipPath id="s2"><rect x="20.0" y="522" width="686" height="482"/></clipPath>
<rect x="20.0" y="522" width="700" height="482" rx="6" fill="#14140f"/>
<g clip-path="url(#s2)">
<text x="34.0" y="538" class="h">3 · лента</text>
<text x="34.0" y="572" xml:space="preserve">signal · 59.93, 30.34 · 1000 м · 24–34                          Аня, 27</text>
<text x="34.0" y="590" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────</text>
<text x="34.0" y="608" xml:space="preserve">› Марк, 29 · 300 м · 4 мин</text>
<text x="34.0" y="626" xml:space="preserve">  кто на пробежку вдоль реки в семь?</text>
<text x="34.0" y="644" xml:space="preserve"></text>
<text x="34.0" y="662" xml:space="preserve">  Ира, 31 · 1 км · 12 мин</text>
<text x="34.0" y="680" xml:space="preserve">  ищу компанию на выставку в субботу</text>
<text x="34.0" y="698" xml:space="preserve"></text>
<text x="34.0" y="716" xml:space="preserve">  Том, 26 · 800 м · 20 мин</text>
<text x="34.0" y="734" xml:space="preserve">  продаю велосипед, но лучше бы покатались вместе</text>
<text x="34.0" y="752" xml:space="preserve"></text>
<text x="34.0" y="770" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────</text>
<text x="34.0" y="788" xml:space="preserve">твоя фраза: «гуляю у реки» · на проверке</text>
<text x="34.0" y="806" xml:space="preserve"></text>
<text x="34.0" y="824" xml:space="preserve">[ ♥ лайк ]  написать  входящие  сменить точку  выход</text>
<text x="34.0" y="842" xml:space="preserve"></text>
<text x="34.0" y="860" xml:space="preserve">↑↓ фраза  ←→ действие  enter выбрать</text>
</g>
<clipPath id="s3"><rect x="740.0" y="522" width="686" height="482"/></clipPath>
<rect x="740.0" y="522" width="700" height="482" rx="6" fill="#14140f"/>
<g clip-path="url(#s3)">
<text x="754.0" y="538" class="h">4 · чат, код безопасности открыт из меню</text>
<text x="754.0" y="572" xml:space="preserve">Ира, 31 · до 23:40</text>
<text x="754.0" y="590" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────</text>
<text x="754.0" y="608" xml:space="preserve">                                                   Ира: привет, ты у реки?</text>
<text x="754.0" y="626" xml:space="preserve">Ты: да, у моста</text>
<text x="754.0" y="644" xml:space="preserve">                                                   Ира: иду</text>
<text x="754.0" y="662" xml:space="preserve"></text>
<text x="754.0" y="680" xml:space="preserve">  │ код безопасности</text>
<text x="754.0" y="698" xml:space="preserve">  │  5079 0098 2219 6667 9602</text>
<text x="754.0" y="716" xml:space="preserve">  │  сверьте голосом или при встрече:</text>
<text x="754.0" y="734" xml:space="preserve">  │  совпал — между вами никого нет</text>
<text x="754.0" y="752" xml:space="preserve">  │  [ совпал ]   закрыть</text>
<text x="754.0" y="770" xml:space="preserve"></text>
<text x="754.0" y="788" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────</text>
<text x="754.0" y="806" xml:space="preserve">&gt; _                                                                      0/146</text>
<text x="754.0" y="824" xml:space="preserve">отправить  [ код ]  назад · истории на диске нет</text>
<text x="754.0" y="842" xml:space="preserve"></text>
<text x="754.0" y="860" xml:space="preserve">←→ действие  enter выбрать</text>
</g>
<text x="20" y="1024" class="q" font-weight="600">Вопросы</text>
<text x="20" y="1048" class="q">1. Какие языки в первом наборе: RU и EN, или сразу языки витрин (сколько и какие)?</text>
<text x="20" y="1072" class="q">2. Экран локации — ввод цифрами, как нарисовано, или ещё поиск по адресу (нужен геокодер, внешний сервис)?</text>
<text x="20" y="1096" class="q">3. Входящие — отдельный экран из меню ленты (как нарисовано) — так?</text>
</svg>