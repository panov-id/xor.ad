worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Local-dev stand-in for the xor.ad gateway: serves each face's static
    # content by hostname and proxies the relay's public routes to the local
    # stand (relay/local, published on the host as 8081).
    #
    # The landing's committed config.js sets apiUrl to "" — same origin — so the
    # form posts to this gateway and the proxy below is what carries it to the
    # node. Point apiUrl straight at the node and this block stops mattering;
    # the same-origin default is kept because it is what production looks like.

    # The node runs in its own compose project, so it is reached through the
    # host rather than a shared network. host-gateway is mapped in
    # docker-compose.gateway.yml.
    upstream relay {
        server host.docker.internal:8081;
    }

    server {
        listen 80;
        server_name sosed.place;

        root /var/www/sosed.place;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ ^/(waitlist|client-error|pageview|health)$ {
            proxy_pass http://relay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }
    }

    server {
        listen 80;
        server_name neighbro.place;

        root /var/www/neighbro.place;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ ^/(waitlist|client-error|pageview|health)$ {
            proxy_pass http://relay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }
    }

    # Fallback for local testing without editing /etc/hosts:
    # curl -H "Host: sosed.place" http://localhost:8080/
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
}
