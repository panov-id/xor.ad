      security: [{publishableKey: []}]
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/Pageview"}}}}
      responses:
        "200": {description: Accepted or silently dropped., x-description-ru: Принято или молча отброшено., content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
  /report:
    post:
      tags: [intake]
      summary: An Article 16 notice, public by design
      x-summary-ru: Уведомление по ст. 16, публично по замыслу
      x-status: built
      x-source: relay/node/src/main.ts
      security: [{publishableKey: []}, {}]
      description: Rate limit 10 per hour and 40 per day by address; a key only names the brand and never refuses the notice.
      x-description-ru: Предел 10 в час и 40 в сутки по адресу; ключ только называет бренд и уведомление не отклоняет.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/Notice"}}}}
      responses:
        "202": {description: Accepted with an id., x-description-ru: Принято, с номером.}
        "422": {description: invalid body or a required field missing, x-description-ru: неверное тело или нет обязательного поля}
        "429": {description: Address limit., x-description-ru: Предел адреса.}
        "503": {description: could not store the notice, x-description-ru: не удалось сохранить уведомление}
  /report/decision:
    post:
      tags: [intake]
      summary: The decision on a notice by its receipt code
      x-summary-ru: Решение по уведомлению по коду квитанции
      x-status: proposed
      security: []
      description: 'Not signed by an identity; the code in the body. "No such receipt" and "not decided yet" get one answer: status 200, the body byte for byte, Cache-Control no-store, one minimum response time for both branches; the per-address limit lives in memory and is not logged (dsa/SPEC §6, protocol §4.5). The decision body is not spelled out in the canon.'
      x-description-ru: 'Личностью не подписан; код в теле. На «нет такой квитанции» и «решения ещё нет» ответ один: статус 200, тело байт в байт, Cache-Control no-store, одно минимальное время на обе ветки; предел по адресу держится в памяти и в журнал не пишется (dsa/SPEC §6, протокол §4.5). Тело решения в каноне поле за полем не описано.'
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ReceiptQuery"}}}}
      parameters:
        - {$ref: "#/components/parameters/ProtocolVersion"}
      responses:
        "200": {description: The same answer for an unknown receipt and an undecided notice; the decision once there is one., x-description-ru: Один ответ на неизвестную квитанцию и нерешённое уведомление; решение, когда оно есть.}
  /csp-report:
    post:
      tags: [intake]
      summary: A content-security-policy violation, always 204
      x-summary-ru: Нарушение политики безопасности контента, всегда 204
      x-status: built
      x-source: relay/node/src/main.ts
      security: []
      responses:
        "204": {description: No body, even over the limit., x-description-ru: Без тела, даже сверх предела.}
