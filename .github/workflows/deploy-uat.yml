name: Deploy UAT

on:
  push:
    branches: [main]

# A called workflow inherits the caller's permissions and may not ask for more.
# relay.yml needs packages: write to push the images and id-token: write for
# keyless signing, so the grant has to be made here — without it the run fails
# before any job starts, which is exactly what happened.
permissions:
  contents: write # the release tag
  packages: write # ghcr push, in the called build
  id-token: write # cosign keyless signing, in the called build

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        name: Create release tag
        run: |
          # Semver, or the image never gets built. docker/metadata-action emits a
          # semver image tag only for a valid version, and "2026.08.05" is not one:
          # a leading zero makes it invalid, so the tag existed in git and nowhere
          # in the registry. %-m/%-d drop the padding.
          #
          # The sha carries a "g" prefix (git describe's convention) so it can
          # never be read as a numeric pre-release identifier — those may not have
          # a leading zero either, and a sha of all digits starting with one would
          # break the same way, rarely and unforgettably.
          TAG="v$(date +%Y.%-m.%-d)-g${GITHUB_SHA::7}"
          # Idempotent: a re-run of the same commit must not fail on an existing
          # tag. It did, and the failure had the worst shape — `release` went red
          # and everything depending on it was skipped, so re-running, which is
          # the first thing a person reaches for after a bad deploy, could not
          # work. sosed.place already did this; these two had not.
          git tag "$TAG" 2>/dev/null || echo "tag $TAG already exists locally"
          git push origin "$TAG" 2>/dev/null || echo "tag $TAG already on remote"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Created release $TAG"

  # Build the images under the release tag. Without this the tag exists in git
  # and nowhere in the registry, and a node can only ever be pinned by sha.
  images:
    needs: release
    uses: ./.github/workflows/relay.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  call:
    needs: release
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: uat
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
