<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
<title>Panel · Feed queue — a person gives the verdict · light theme, 1280 px</title>
<style>
  text { font-family: "Inter", system-ui, sans-serif; font-size: 15px; fill: #14140f; }
  .disp { font-family: "Unbounded", "Inter", sans-serif; font-size: 22px; font-weight: 600; }
  .muted { fill: #5b5b55; }
  .micro { font-size: 12px; fill: #5b5b55; }
  .th { font-size: 12px; font-weight: 600; fill: #5b5b55; letter-spacing: .04em; }
  .warn { fill: #8a5200; }
  .danger { fill: #b3261e; }
  .onaccent { fill: #ffffff; font-weight: 600; }
  .q { font-size: 14px; }
  .qh { font-size: 14px; font-weight: 600; }
  .line { stroke: #d9d9d4; stroke-width: 1; }
</style>
<rect width="1280" height="860" fill="#f2f2f0"/>

<!-- page head -->
<text x="40" y="56" class="disp">Feed queue</text>
<text x="40" y="82" class="muted">Phrases waiting for a verdict. Nobody sees a phrase until it is published; one nobody decides in 10 minutes is swept.</text>
<text x="1240" y="56" text-anchor="end" class="micro">refreshes every 15 s · 3 waiting</text>

<!-- card: surface, 2px line-strong border, 4/4 shadow -->
<rect x="44" y="108" width="1200" height="300" rx="6" fill="#14140f"/>
<rect x="40" y="104" width="1200" height="300" rx="6" fill="#ffffff" stroke="#14140f" stroke-width="2"/>

<!-- header row, 40 high -->
<text x="60" y="130" class="th">WAITING</text>
<text x="160" y="130" class="th">QUEUE</text>
<text x="270" y="130" class="th">NAME</text>
<text x="450" y="130" class="th">PHRASE</text>
<text x="900" y="130" class="th">MODE</text>
<line x1="41" y1="144" x2="1239" y2="144" class="line"/>

<!-- row 1: almost swept -->
<text x="60" y="180" class="warn">8 min 40 s</text>
<rect x="160" y="162" width="64" height="24" rx="3" fill="none" stroke="#5b5b55"/><text x="192" y="179" text-anchor="middle" class="micro">sosed</text>
<text x="270" y="172">Аня</text>
<rect x="270" y="180" width="96" height="20" rx="3" fill="none" stroke="#b26a00"/><text x="318" y="194" text-anchor="middle" class="micro warn">name unchecked</text>
<text x="450" y="180">кто сегодня идёт на набережную смотреть закат?</text>
<text x="900" y="180" class="muted">open</text>
<rect x="1002" y="159" width="100" height="36" rx="6" fill="#14140f"/><rect x="1000" y="157" width="100" height="36" rx="6" fill="#3355dd" stroke="#14140f" stroke-width="2"/><text x="1050" y="180" text-anchor="middle" class="onaccent">Publish</text>
<rect x="1116" y="157" width="100" height="36" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="1166" y="180" text-anchor="middle" class="danger">Refuse</text>
<line x1="41" y1="216" x2="1239" y2="216" class="line"/>

<!-- row 2: long phrase wraps to two lines, row grows -->
<text x="60" y="260">3 min 05 s</text>
<rect x="160" y="242" width="80" height="24" rx="3" fill="none" stroke="#5b5b55"/><text x="200" y="259" text-anchor="middle" class="micro">neighbro</text>
<text x="270" y="260">Max</text>
<text x="450" y="250">looking for someone to split a table at the board-game</text>
<text x="450" y="272">place on Friday, around seven, two seats are free already</text>
<text x="900" y="260" class="muted">open</text>
<rect x="1002" y="239" width="100" height="36" rx="6" fill="#14140f"/><rect x="1000" y="237" width="100" height="36" rx="6" fill="#3355dd" stroke="#14140f" stroke-width="2"/><text x="1050" y="260" text-anchor="middle" class="onaccent">Publish</text>
<rect x="1116" y="237" width="100" height="36" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="1166" y="260" text-anchor="middle" class="danger">Refuse</text>
<line x1="41" y1="296" x2="1239" y2="296" class="line"/>

<!-- row 3: just arrived; refuse pressed once — asks again in place -->
<text x="60" y="340">0 min 12 s</text>
<rect x="160" y="322" width="64" height="24" rx="3" fill="none" stroke="#5b5b55"/><text x="192" y="339" text-anchor="middle" class="micro">sosed</text>
<text x="270" y="340">Лев</text>
<text x="450" y="340">продам гараж</text>
<text x="900" y="340" class="muted">open</text>
<text x="1100" y="340" text-anchor="end" class="muted">Refuse for good?</text>
<rect x="1116" y="317" width="100" height="36" rx="6" fill="#b3261e" stroke="#14140f" stroke-width="2"/><text x="1166" y="340" text-anchor="middle" class="onaccent">Yes, refuse</text>

<text x="60" y="388" class="micro">The author's identity is not shown here and is not sent to the panel at all.</text>

<!-- empty state, small -->
<rect x="44" y="436" width="1200" height="96" rx="6" fill="#14140f"/>
<rect x="40" y="432" width="1200" height="96" rx="6" fill="#ffffff" stroke="#14140f" stroke-width="2"/>
<text x="640" y="476" text-anchor="middle" style="font-weight:600">Nothing is waiting.</text>
<text x="640" y="500" text-anchor="middle" class="muted">A phrase appears here the moment it is sent.</text>
<text x="40" y="552" class="micro">↑ the same page with an empty queue</text>

<!-- questions -->
<text x="40" y="604" class="qh">Вопросы</text>
<text x="40" y="632" class="q">1. Refuse — вторым нажатием на месте (как нарисовано в строке 3) или сразу, без подтверждения? Publish подтверждения не просит.</text>
<text x="40" y="658" class="q">2. Причина отказа: сейчас refusePhrase() её не принимает, и автор видит общий отказ. Оставляем без причины или добавляем выбор из списка?</text>
<text x="40" y="684" class="q">3. Обновление: опрос раз в 15 с (как нарисовано) или только кнопка «Refresh»? Очередь живёт 10 минут, так что ручное обновление легко опоздает.</text>
<text x="40" y="710" class="q">4. «name unchecked» — только метка, а вердикт по имени отдельным шагом позже; или Publish здесь заодно одобряет имя?</text>
<text x="40" y="736" class="q">5. Время ожидания желтеет после 8 минут из 10 — нужен ли этот сигнал, или хватит сортировки «старые сверху»?</text>
<text x="40" y="762" class="q">6. Место в меню: рядом с «DSA notices» под тем же разделом, видно ролям с правом feed_queue.read (админ, модератор).</text>
</svg>
