# Local stand — vжух: `docker compose up` and everything's here.
#   node         http://localhost:62080   the API (fs storage, mail -> Mailpit)
#   Mailpit      http://localhost:62025   catches welcome emails — and alerts
#   Dozzle       http://localhost:62090   live container logs in the browser
#   Prometheus   http://localhost:62091   scrapes the node, evaluates the alerts
#   Grafana      http://localhost:62092   dashboards, provisioned from files
#   Alertmanager http://localhost:62093   routes a firing alert into Mailpit
# Waitlist objects land in ./data/waitlist/local/*.json so you can eyeball them.
name: edge-node-local
services:
  node:
    # the API itself: tens of MB at rest, room for a burst of requests
    mem_limit: 512m
    cpus: 1.0
    build: { context: ../node }
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
      # Not just "postgres is up": the schema has to exist, or every brand, key
      # and quota request answers "relation does not exist" on a fresh stand.
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV_NAME: local
      NODE_ID: local
      NODE_REGION: local
      ALLOWED_ORIGINS: ""          # empty -> reflect any origin (local convenience)
      DATABASE_URL: postgres://relay:local@postgres:5432/relay
      STORAGE_TRANSPORT: fs
      STORAGE_DIR: /data
      MAIL_TRANSPORT: smtp
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: "1025"
      # Without it every registration answers 503 "cannot store a vault share",
      # and nothing that starts with an identity can be tried on the stand
      # (found 2026-09-22 seeding the feed queue). A throwaway local key.
      VAULT_SHARE_KEY: local-vault-share-key
      # Panel control plane. A throwaway local secret so /auth/* and /admin/*
      # can be exercised on the stand; magic links land on the panel dev server.
      SESSION_SECRET: local-panel-secret
      PANEL_URL: http://localhost:62173
      # Without it /metrics is 404 to everybody, including Prometheus beside it
      # (routes/metrics.ts says why that is the honest default).
      METRICS_TOKEN: local-metrics-token
    volumes:
      - ./data:/data
    ports: ["62080:8080"]           # 8080 on the host is the xor.ad gateway

  # The control-state schema, applied once per `up`. On a real box the wizard
  # does this before the node starts; the stand had no equivalent, so brands and
  # keys simply never worked here and every verify-*-local.sh script carried its
  # own copy of the incantation.
  migrate:
    # one-shot: applies the schema and exits
    mem_limit: 256m
    cpus: 0.5
    build: { context: ../node }
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://relay:local@postgres:5432/relay
    command: ["run", "--allow-env", "--allow-net", "--allow-read", "tools/migrate_db.ts"]

  postgres:
    # control state for a stand, not a production dataset
    mem_limit: 512m
    cpus: 0.75
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: local
      POSTGRES_USER: relay
      POSTGRES_DB: relay
    ports: ["62432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    # holds the letters a stand sends, in memory, and few of them
    mem_limit: 128m
    cpus: 0.25
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["62025:8025"]           # web UI (SMTP on 1025, internal)

  dozzle:
    # tails container logs; the work is the browser's
    mem_limit: 128m
    cpus: 0.25
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    ports: ["62090:8080"]

  # Everything below is the stand's eyes. It is in the compose file rather than
  # in a person's browser on purpose: a dashboard that exists only where it was
  # clicked together is a dashboard nobody else has.
  prometheus:
    # a stand's worth of series, fifteen days of them
    mem_limit: 512m
    cpus: 0.5
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    depends_on:
      node:
        condition: service_started
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # Without it every "Source" link in an alert letter points at the
      # container's own hostname, which no browser on this machine can open —
      # found by reading a letter that had actually been delivered (2026-09-20).
      - --web.external-url=http://localhost:62091
    ports: ["62091:9090"]

  grafana:
    mem_limit: 512m
    cpus: 0.5
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      # A stand, not a server: anonymous read is what makes "open the link and
      # look" true. Nothing here is reachable from outside the machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["62092:3000"]

  alertmanager:
    mem_limit: 256m
    cpus: 0.25
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      # Same reason as Prometheus above: the letter carries links, and a link
      # into a container hostname is a link nobody can follow.
      - --web.external-url=http://localhost:62093
    ports: ["62093:9093"]
