<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d0c" />
    <meta name="description" content="xor control panel" />
    <!-- The panel is private: nothing here should be crawled or previewed. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>xor panel</title>
    <script>
      // Applied before the first paint, so a dark-theme operator never gets a
      // flash of the light one. The same value the toggle writes.
      try {
        var stored = localStorage.getItem("panel_theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) { /* private mode: fall back to the system theme */ }
    </script>
    <!-- Self-hosted fonts: preload the above-the-fold latin faces. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Yq6W-LOTXCb04q32xlpwu8Zf.woff2" crossorigin />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>

</html>
